# Counts connection-pool acquire timeouts emitted by the runtime.
#
# The strings below are MEASURED, not assumed. This app runs Prisma 7 with the
# `@prisma/adapter-pg` driver adapter, so the pool is node-postgres' `pg.Pool`
# and the Rust query engine's pool is not in the path. That means the Prisma
# pool errors — `P2024` / `P2028` and the message
# "Timed out fetching a new connection from the connection pool" — are never
# produced here. A filter written against them matches nothing, and the alert
# that depends on it can never fire.
#
# What actually reaches the logs (reproduced against a socket that accepts but
# never completes the Postgres handshake, so no database is required):
#
#   acquire deadline exceeded  -> Error "timeout exceeded when trying to connect"
#   connect deadline exceeded  -> Error "Connection terminated due to connection timeout"
#
# Neither carries a `code`, so only the message text is matchable. The fourth
# branch catches the idle-client / transaction-connection paths, which
# `logPoolError` in `src/shared/db/prisma.ts` tags with
# `context.operation = "prismaPool"`.
#
# `__tests__/unit/db/prisma-pool-timeout-signal.test.ts` re-runs that
# reproduction and fails if a pg / Prisma upgrade changes the wording.
#
# Apply with:
#   gcloud logging metrics create prisma_pool_timeout \
#     --config-from-file=infra/monitoring/log-metrics/prisma-pool-timeout.yaml

filter: |-
  resource.type="cloud_run_revision"
  resource.labels.service_name=~"^myrrh-rental-space(-admin)?$"
  (
    textPayload:"timeout exceeded when trying to connect"
    OR jsonPayload.message:"timeout exceeded when trying to connect"
    OR jsonPayload.message:"Connection terminated due to connection timeout"
    OR jsonPayload.context.operation="prismaPool"
  )

description: |-
  Count of Prisma connection pool acquire timeouts / pool exhaustion signals
  from the myrrh-rental-space runtime. Feeds the prisma-pool-timeout alert
  policy.

metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
  displayName: "Prisma pool acquire timeouts (myrrh-rental-space)"
  labels:
    - key: service_name
      valueType: STRING
      description: "Cloud Run service name that produced the error"

labelExtractors:
  service_name: EXTRACT(resource.labels.service_name)
