# Alert on ANY log line at Cloud Logging severity=CRITICAL from the runtime.
# Our logger emits CRITICAL for ErrorSeverity.CRITICAL. Most call sites pick it
# deliberately (mail send failure that cannot retry, audit log integrity
# violation, cron config missing), but `criticalFetch` in
# `src/shared/lib/errors/safe-fetch.ts` promotes ANY error it catches to
# CRITICAL — today that covers the settings reads in
# `src/shared/domain/settings/queries/{features,site}.ts`, so a transient
# database blip on a page render also lands here. One instance is still worth
# paging: those reads sit in front of every rendered page.
#
# Uses a log-based condition (`conditionMatchedLog`), so no separate log
# metric is required — the alert fires on the log entry itself.
#
# https://cloud.google.com/monitoring/alerts/log-based-incidents

displayName: "myrrh-rental-space: CRITICAL severity log"
combiner: OR
enabled: true
notificationChannels:
  # - projects/myrrh-rental-space/notificationChannels/REPLACE_ME
documentation:
  content: |-
    The myrrh-rental-space runtime emitted a log line at severity=CRITICAL.
    Most CRITICAL call sites are irrecoverable domain-level failures (mail send
    failure that cannot retry, audit log integrity violation, encryption key
    unavailable, cron config missing). `criticalFetch` additionally promotes
    any error raised while reading site/feature settings, so a transient
    database error on a page render also appears here. Either way one
    occurrence is worth escalating — those settings reads gate every page.

    Open the incident in Cloud Logging and follow the runbook the message points to.
  mimeType: "text/markdown"

conditions:
  - displayName: "any CRITICAL log entry"
    conditionMatchedLog:
      filter: |-
        resource.type="cloud_run_revision"
        resource.labels.service_name=~"^myrrh-rental-space(-admin)?$"
        severity="CRITICAL"

alertStrategy:
  # notificationRateLimit avoids paging N times for N lines during the same
  # cascading failure — one page per 5 min is more useful than 200.
  notificationRateLimit:
    period: 300s
  autoClose: 3600s
