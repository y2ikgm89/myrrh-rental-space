name: 機能追加リクエスト
description: 新機能・改善の提案
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        機能提案ありがとうございます。**既存機能の変更を伴う場合は破壊的変更の影響も記載してください。**
        大きな機能は実装前に `docs/plans/` に計画書を作成することを推奨します。

  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: ユーザーや運用者がどう困っているか
      placeholder: 例. 予約履歴から直接コピー予約を作成できず、毎回手動入力が必要
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する解決方法
      description: どのような機能を追加 / 変更するか
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: なぜこの方法を選んだか / 他に検討した案があれば
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 影響範囲
      options:
        - 公開ページ（予約フロー）
        - 公開ページ（その他）
        - マイページ
        - 管理画面
        - API / 外部連携
        - インフラ / CI / ツール
        - ドキュメント
    validations:
      required: true

  - type: checkboxes
    id: impact
    attributes:
      label: 変更の影響
      options:
        - label: 破壊的変更（既存機能の動作が変わる）
        - label: DB スキーマ変更を伴う
        - label: 新しい環境変数が必要
        - label: migration が必要
        - label: 外部 API / Webhook の変更
        - label: ドキュメント更新が必要

  - type: textarea
    id: additional
    attributes:
      label: 追加情報
      description: 参考リンク・モックアップ・関連 issue 等
    validations:
      required: false
