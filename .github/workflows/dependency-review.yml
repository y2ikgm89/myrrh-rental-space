name: Dependency Review

# PR ごとに追加/更新される依存を scan し、脆弱性・ライセンス違反があれば block
# 参照: https://github.com/actions/dependency-review-action

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review new dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          # 脆弱性 severity 閾値: moderate 以上でブロック
          fail-on-severity: moderate
          # 禁止ライセンス（AGPL 等は商用不可）
          deny-licenses: |
            AGPL-1.0-only
            AGPL-1.0-or-later
            AGPL-3.0-only
            AGPL-3.0-or-later
            GPL-1.0-only
            GPL-1.0-or-later
            GPL-2.0-only
            GPL-3.0-only
            GPL-3.0-or-later
          # 許可ライセンス
          allow-licenses: |
            MIT
            Apache-2.0
            BSD-2-Clause
            BSD-3-Clause
            ISC
            0BSD
            CC0-1.0
            CC-BY-4.0
            Unlicense
            WTFPL
            BlueOak-1.0.0
            Python-2.0
          # 開発依存は lighter scrutiny（dev 依存のみの脆弱性は warning）
          comment-summary-in-pr: true
          warn-only: false
          # vulnerability-check は default で有効
