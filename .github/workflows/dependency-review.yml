name: Dependency Review

# PR ごとに追加/更新される依存を scan し、脆弱性・ライセンス違反があれば block
# 参照: https://github.com/actions/dependency-review-action

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review new dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # actions/dependency-review-action@v5 の制約:
      # 1. allow-licenses と deny-licenses は **排他的**（両方指定すると
      #    "You cannot specify both allow-licenses and deny-licenses" で fail）
      # 2. license list は **comma-separated 単一行** が canonical
      #    （YAML literal block `|` は leading whitespace が SPDX 識別子に混入）
      # 本プロジェクトでは商用 OSS の幅を確保したいため deny-licenses 方式
      # （AGPL / GPL のみ禁止）を採用。Stripe / Vercel / Linear と同等
      - name: Review dependencies
        uses: actions/dependency-review-action@v5
        with:
          # 脆弱性 severity 閾値: moderate 以上でブロック
          fail-on-severity: moderate
          # 禁止ライセンス（AGPL / GPL は商用組込 incompatible、SPDX identifier list）
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-1.0-only, GPL-1.0-or-later, GPL-2.0-only, GPL-3.0-only, GPL-3.0-or-later
          # PR に summary comment を post（vulnerability-check は default で有効）
          comment-summary-in-pr: true
          warn-only: false
