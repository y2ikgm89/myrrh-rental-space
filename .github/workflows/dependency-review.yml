name: Dependency Review

# PR ごとに追加/更新される依存を scan し、脆弱性・ライセンス違反があれば block
# 参照: https://github.com/actions/dependency-review-action

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review new dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # actions/dependency-review-action@v5 の allow-licenses / deny-licenses は
      # **comma-separated** 単一行が canonical。YAML literal block (`|`) の
      # newline-separated は leading whitespace が SPDX 識別子に混入し
      # `Invalid license(s) in allow-licenses: MIT` で必ず fail する silent bug
      - name: Review dependencies
        uses: actions/dependency-review-action@v5
        with:
          # 脆弱性 severity 閾値: moderate 以上でブロック
          fail-on-severity: moderate
          # 禁止ライセンス（AGPL / GPL は商用不可、SPDX identifier list）
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-1.0-only, GPL-1.0-or-later, GPL-2.0-only, GPL-3.0-only, GPL-3.0-or-later
          # 許可ライセンス（OSI / 商用利用可の SPDX identifier list）
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, CC0-1.0, CC-BY-4.0, Unlicense, WTFPL, BlueOak-1.0.0, Python-2.0
          # PR に summary comment を post（vulnerability-check は default で有効）
          comment-summary-in-pr: true
          warn-only: false
