name: PR Auto Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# 旧 run を cancel して force-push race condition を回避
# (2026-05-28 PR #290 で labeler が HttpError → 旧 run が in_progress 中に
# 新 push trigger で race し API conflict を起こした事例)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Apply path-based labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply labels from .github/labeler.yml
        # SHA 直 pin（公式 security best practice、tag force-push 攻撃 + codeload
        # 404 outage 対策）
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
