name: Terraform

# push-to-main の apply は deploy-production.yml の `terraform-apply` job に
# 統合済み (Codex P1 F6 対応)。本 workflow は PR 時の HCL syntax / provider
# schema 検証のみ担う (cloud credentials を握らせない設計、Codex P1 F4)。
on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

# NOTE: `pull-requests: write` (旧) は plan コメント自動 post のためだったが、
# untrusted PR HEAD の terraform コードが自 workflow の credentials 権限
# 経由で悪用される F4 リスクを縮小するため撤去。plan 出力は
# deploy-production.yml の terraform-apply job の Actions log で確認する。
permissions:
  contents: read

env:
  TF_VERSION: 1.10.0
  TF_WORKING_DIR: terraform
  TF_IN_AUTOMATION: "1"

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # PR 側は cloud credentials を握らせずに実行できる範囲だけ動かす。
  # `terraform init -backend=false` + `terraform validate` + `terraform fmt -check`
  # は provider schema と HCL syntax の検証で完結し、GCS backend / API 呼び出しは
  # 不要。これにより untrusted PR HEAD (fork も含む) 由来のコード実行が
  # OIDC token / SA credentials に触れる経路をゼロにする (Codex P1 F4)。
  # plan の実 diff は push-to-main 時の apply job が事前実行するため、差分レビュー
  # はその Actions log で確認する。
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt (check)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false -backend=false

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate
