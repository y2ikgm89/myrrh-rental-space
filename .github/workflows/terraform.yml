name: Terraform

# push-to-main の apply は deploy-production.yml の `terraform-apply` job に
# 統合済み (Codex P1 F6 対応)。本 workflow は PR 時の HCL syntax / provider
# schema 検証のみ担う (cloud credentials を握らせない設計、Codex P1 F4)。
#
# ## `paths:` filter を故意に付けない (2026-07-14 anti-pattern 修正)
#
# `paths: [terraform/**]` で filter すると terraform 以外を触る PR で本 workflow が
# 発火せず、`Terraform / validate` required check が **MISSING** 扱いになり
# branch protection で auto-merge が **永久 block** される (GitHub 公式仕様)。
# 参考: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/troubleshooting-rulesets#pull-requests-are-blocked-when-status-checks-are-required-but-not-set-up
#
# 対策: `paths:` filter を撤去し全 PR で走らせる。
# 実行時間 ~1-2 分 (terraform init + validate + Trivy + TFLint、いずれも
# read-only なので cloud 状態への影響なし) → CI 予算的に許容。
# `architecture-boundaries.test.ts` に「required checks に path-filtered workflow を
# 含めない」regression gate 追加済。
on:
  pull_request:
  # merge queue の検証 run。`Terraform / validate` は required check なので、
  # ここに載せないと queue 側で MISSING になり永久 block する（paths filter を
  # 付けたときと同じ壊れ方。上のコメントの PR #1103 と同根）。
  merge_group:

# NOTE: `pull-requests: write` (旧) は plan コメント自動 post のためだったが、
# untrusted PR HEAD の terraform コードが自 workflow の credentials 権限
# 経由で悪用される F4 リスクを縮小するため撤去。plan 出力は
# deploy-production.yml の terraform-apply job の Actions log で確認する。
#
# `security-events: write` は Trivy SARIF を GitHub Code Scanning へ upload
# するため (Sprint 1 Item E、2026-07-14 tfsec から Trivy へ移行)。cloud
# credentials では*ない* — GitHub API scope 内で findings tab を書き込むだけ。
# SARIF upload に失敗しても validate job 全体は fail させない
# (`continue-on-error: true`)。
#
# ## tfsec → Trivy 移行 (2026-07-14)
# tfsec は Terraform 1.7+ の `import {}` blocks を parse できず
# `Unsupported block type` で scan 失敗するため、aquasecurity が engineering
# effort を移した後継 Trivy (`scan-type: config`) に置換。Trivy は import blocks
# 対応、SARIF 出力互換、DB update 自動、rule 数も tfsec より多い。
permissions:
  contents: read
  security-events: write

env:
  TF_VERSION: 1.15.9
  TF_WORKING_DIR: terraform
  TF_IN_AUTOMATION: "1"

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # PR 側は cloud credentials を握らせずに実行できる範囲だけ動かす。
  # `terraform init -backend=false` + `terraform validate` + `terraform fmt -check`
  # は provider schema と HCL syntax の検証で完結し、GCS backend / API 呼び出しは
  # 不要。これにより untrusted PR HEAD (fork も含む) 由来のコード実行が
  # OIDC token / SA credentials に触れる経路をゼロにする (Codex P1 F4)。
  # plan の実 diff は push-to-main 時の apply job が事前実行するため、差分レビュー
  # はその Actions log で確認する。
  validate:
    # 明示 `name:` で check-run 名を `Terraform / validate` に固定
    # (branch-protection.json の required_status_checks.contexts と一致必須)。
    # 未設定だと check name = job ID `validate` になり、branch protection の
    # `Terraform / validate` context 要求と mismatch → MERGE BLOCKED になる
    # (2026-07-14 PR #1100 で発覚、`ci.yml` 同型 `name: 表示名` パターンに揃える)。
    name: Terraform / validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt (check)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false -backend=false
        env:
          # Cloudflare provider v5 は `CLOUDFLARE_API_TOKEN` env var を自動採用
          # (terraform/cloudflare_provider.tf 参照)。`terraform validate` 自体は
          # provider API を叩かないが、初回 provider fetch (registry からの
          # binary download) の一部 endpoints で 401/403 を招かないよう先行注入。
          # PR job は cloud credentials を握らないため cloudflare 実 mutation
          # は起きない (F4 hardening 契約は維持)。
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TERRAFORM_API_TOKEN }}

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # ---- Static analysis (Sprint 1 Item E) ----
      # HCL-level regression protection catches Codex #1063-class defects
      # (iap_enabled 削除 / ingress 誤設定 / IAM overprivilege) that only
      # PR review currently sees. Both tools are credentials-free — they
      # parse `.tf` files locally, no cloud API calls. F4 hardening 無影響。
      - name: Trivy IaC scan (High/Critical → fail)
        id: trivy
        # v0.36.0 — 2026-07-14 tfsec から移行 (tfsec が Terraform 1.7+
        # `import {}` blocks を parse 不可 = deprecated 後継)。
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # `scan-type: config` = IaC scan (Terraform / Kubernetes / Dockerfile
          # / etc)。`scan-ref` は scan 対象 path (repo root からの相対)。
          scan-type: config
          scan-ref: ${{ env.TF_WORKING_DIR }}
          # HIGH と CRITICAL 発見時 exit-code=1 で job fail (tfsec 相当挙動)。
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy.sarif
          hide-progress: "true"
          # `limit-severities-for-sarif` は severity 一致に関わらず全 finding
          # が SARIF に入るのを防ぐ (Code Scanning tab のノイズ削減)。
          limit-severities-for-sarif: "true"

      - name: Upload Trivy SARIF to Code Scanning
        # Runs even when Trivy fails so findings surface in the PR
        # "Files changed → Code scanning alerts" tab (otherwise the
        # developer only sees a red check). `continue-on-error` keeps
        # transient upload flakes from double-failing the job.
        if: ${{ always() && steps.trivy.conclusion != 'skipped' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          # 2026-07-16 (PR #1149): `latest` が sigstore-go bundle.TlogEntries で
          # nil pointer panic を起こす TFLint リリース (regression window
          # v0.61.0–v0.63.1、issue #2591/#2595) を踏むため一時 v0.58.0 に pin。
          # 2026-07-22 audit で upstream fix が v0.64.0 で確認済み (maintainer
          # 確認 + GitHub 側 API 変更の revert) のため v0.64.0 に bump。
          # この repo の他 action 同様 exact version pin を維持する方針のため
          # `latest` には戻さない (float tag より確定 SHA/version 相当の再現性を優先)。
          tflint_version: v0.64.0

      # ダウンロード済み ruleset を持ち回してネットワーク依存自体を減らす。
      # `.tflint.hcl` に plugin の version が書かれているので、その hash が
      # 変われば取り直す。cache hit 時の `tflint --init` は署名検証を含めて
      # 外部へ出ないため、下のリトライは cache miss のときの保険になる。
      - name: Cache TFLint plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ runner.os }}-${{ hashFiles('.tflint.hcl') }}

      - name: TFLint init (install ruleset plugins)
        working-directory: ${{ env.TF_WORKING_DIR }}
        # `tflint --init` は ruleset を GitHub Releases から取得し、その署名を
        # sigstore の TUF リポジトリ (tuf-repo-cdn.sigstore.dev) で検証する。
        # どちらも外部ホストなので、単発実行だと相手側の瞬断でジョブごと落ちる。
        # 実測 (2026-08-01, run 30703488913): Terraform を 1 行も含まない PR で
        # `tuf refresh failed: … read: connection reset by peer` が出て赤くなった。
        # 直近 40 run 中 1 件と頻度は低いが、**変更内容と無関係に落ちる**のが問題。
        # `scripts/bun-ci-install.sh` と同じ方針でリトライする。
        #
        # `shell: bash` を明示する。GHA の既定 shell は `bash -e {0}` 定義で
        # `-o pipefail` を含まず、明示したときだけ
        # `bash --noprofile --norc -eo pipefail {0}` になる。
        # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
        shell: bash
        run: |
          set -euo pipefail
          attempts=3
          for attempt in $(seq 1 "${attempts}"); do
            if tflint --init --config="${GITHUB_WORKSPACE}/.tflint.hcl"; then
              exit 0
            fi
            if [ "${attempt}" -eq "${attempts}" ]; then
              break
            fi
            delay=$((attempt * 10))
            echo "::warning::tflint --init failed (attempt ${attempt}/${attempts}); retrying in ${delay}s"
            sleep "${delay}"
          done
          echo "::error::tflint --init failed after ${attempts} attempts"
          exit 1
        env:
          # Increases the anonymous rate limit when fetching the google
          # ruleset from GitHub Releases (avoids 403 on busy runners).
          GITHUB_TOKEN: ${{ github.token }}

      - name: TFLint run
        working-directory: ${{ env.TF_WORKING_DIR }}
        # `--recursive` walks nested modules; `--format=compact` gives
        # one-line-per-issue output that GitHub's problem matcher parses
        # into inline PR annotations. Non-zero exit fails the job.
        run: tflint --recursive --format=compact --config="${GITHUB_WORKSPACE}/.tflint.hcl"
