name: Terraform

# push-to-main の apply は deploy-production.yml の `terraform-apply` job に
# 統合済み (Codex P1 F6 対応)。本 workflow は PR 時の HCL syntax / provider
# schema 検証のみ担う (cloud credentials を握らせない設計、Codex P1 F4)。
on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

# NOTE: `pull-requests: write` (旧) は plan コメント自動 post のためだったが、
# untrusted PR HEAD の terraform コードが自 workflow の credentials 権限
# 経由で悪用される F4 リスクを縮小するため撤去。plan 出力は
# deploy-production.yml の terraform-apply job の Actions log で確認する。
#
# `security-events: write` は tfsec SARIF を GitHub Code Scanning へ upload
# するため (Sprint 1 Item E)。cloud credentials では*ない* — GitHub API
# scope 内で findings tab を書き込むだけ。SARIF upload に失敗しても
# validate job 全体は fail させない (`continue-on-error: true`)。
permissions:
  contents: read
  security-events: write

env:
  TF_VERSION: 1.10.0
  TF_WORKING_DIR: terraform
  TF_IN_AUTOMATION: "1"

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # PR 側は cloud credentials を握らせずに実行できる範囲だけ動かす。
  # `terraform init -backend=false` + `terraform validate` + `terraform fmt -check`
  # は provider schema と HCL syntax の検証で完結し、GCS backend / API 呼び出しは
  # 不要。これにより untrusted PR HEAD (fork も含む) 由来のコード実行が
  # OIDC token / SA credentials に触れる経路をゼロにする (Codex P1 F4)。
  # plan の実 diff は push-to-main 時の apply job が事前実行するため、差分レビュー
  # はその Actions log で確認する。
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt (check)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false -backend=false

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # ---- Static analysis (Sprint 1 Item E) ----
      # HCL-level regression protection catches Codex #1063-class defects
      # (iap_enabled 削除 / ingress 誤設定 / IAM overprivilege) that only
      # PR review currently sees. Both tools are credentials-free — they
      # parse `.tf` files locally, no cloud API calls. F4 hardening 無影響。
      - name: tfsec (High/Critical → fail)
        id: tfsec
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        with:
          working_directory: ${{ env.TF_WORKING_DIR }}
          # `soft_fail: false` = exit non-zero on any surviving finding.
          # `--minimum-severity HIGH` filters out MEDIUM/LOW so the gate
          # only trips on High/Critical (per Sprint 1 scope). Loosen the
          # min-severity later if false-positives dominate.
          # `--out` path is relative to CWD (repo root when the action
          # runs), NOT to working_directory — hence the top-level filename.
          soft_fail: false
          format: sarif
          additional_args: --minimum-severity HIGH --out tfsec.sarif

      - name: Upload tfsec SARIF to Code Scanning
        # Runs even when tfsec fails so findings surface in the PR
        # "Files changed → Code scanning alerts" tab (otherwise the
        # developer only sees a red check). `continue-on-error` keeps
        # transient upload flakes from double-failing the job.
        if: ${{ always() && steps.tfsec.conclusion != 'skipped' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: tfsec.sarif
          category: tfsec

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          # `latest` inside setup-tflint@v4 resolves via Octokit at
          # action-run time. Pinning here would drift from the ruleset
          # min-version guarantee (google plugin needs tflint >= v0.46).
          tflint_version: latest

      - name: TFLint init (install ruleset plugins)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: tflint --init --config="${GITHUB_WORKSPACE}/.tflint.hcl"
        env:
          # Increases the anonymous rate limit when fetching the google
          # ruleset from GitHub Releases (avoids 403 on busy runners).
          GITHUB_TOKEN: ${{ github.token }}

      - name: TFLint run
        working-directory: ${{ env.TF_WORKING_DIR }}
        # `--recursive` walks nested modules; `--format=compact` gives
        # one-line-per-issue output that GitHub's problem matcher parses
        # into inline PR annotations. Non-zero exit fails the job.
        run: tflint --recursive --format=compact --config="${GITHUB_WORKSPACE}/.tflint.hcl"
