name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: myrrh-rental-space
  PROJECT_NUMBER: "626108938746"
  REGION: asia-northeast1
  SERVICE_NAME: myrrh-rental-space
  ADMIN_SERVICE_NAME: myrrh-rental-space-admin
  AR_REPOSITORY: myrrh-rental-space
  WORKER_POOL: myrrh-deploy-pool
  RUNTIME_SERVICE_ACCOUNT: myrrh-rental-space-runtime@myrrh-rental-space.iam.gserviceaccount.com
  BUILD_SERVICE_ACCOUNT: myrrh-rental-space-build@myrrh-rental-space.iam.gserviceaccount.com
  CRON_SERVICE_ACCOUNT_EMAIL: myrrh-rental-space-scheduler@myrrh-rental-space.iam.gserviceaccount.com
  CRON_OIDC_AUDIENCE: https://rental-space.myrrh-jp.com
  WORKLOAD_IDENTITY_PROVIDER: projects/626108938746/locations/global/workloadIdentityPools/github-actions/providers/github-myrrh-rental-space
  PUBLIC_DOMAIN: https://rental-space.myrrh-jp.com
  ADMIN_DOMAIN: https://admin.myrrh-jp.com
  IAP_JWT_AUDIENCE: /projects/626108938746/locations/asia-northeast1/services/myrrh-rental-space-admin
  ADMIN_ROLE_GROUP_SUPER_ADMIN_EMAIL: myrrh-super-admins@myrrh-jp.com
  ADMIN_ROLE_GROUP_ADMIN_EMAIL: myrrh-admins@myrrh-jp.com
  ADMIN_ROLE_GROUP_EDITOR_EMAIL: myrrh-editors@myrrh-jp.com
  ADMIN_ROLE_GROUP_VIEWER_EMAIL: myrrh-viewers@myrrh-jp.com
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAADi6Bqavj97fu7JG

jobs:
  # Terraform apply を deploy より先に実行する (Codex P1 F6)。
  #
  # 過去は terraform.yml (push-to-main で terraform/** 変更に反応する path
  # フィルタ付き) と本 workflow が push-to-main で並列トリガーされ、両者の
  # concurrency group が別 (terraform-* / deploy-production) だったため実行
  # 順序が保証されていなかった。secret_iam の binding が Cloud Run deploy
  # より遅く反映されると `--set-secrets=` が Permission denied で silent fail
  # する race があった。
  #
  # 解決: terraform apply を deploy の needs 前段として本 workflow に統合し、
  # terraform.yml 側の push トリガー / apply job は廃止 (PR-only validate 化)。
  # terraform apply は idempotent なので、terraform 差分ゼロでも数秒で終わる。
  #
  # ⚠️ 2026-07-14 一時措置 (production deploy unblock):
  #   Terraform state が空 (既存 GCP resources 未 import) + runner IAM が不完全
  #   (bootstrap 未完了) のため terraform apply が create attempt で 409/403 連発
  #   → 全 main push で deploy が blocked していた。段階復旧のため:
  #
  #     - `continue-on-error: true` で apply 失敗が deploy を blocking しない
  #     - deploy job は needs: terraform-apply を維持 (race 順序は保つ)
  #
  #   段階 2 (別 PR、fix/terraform-import-blocks + runner IAM 完了後) で
  #   Terraform 1.7+ `import{}` blocks を導入し既存 resources を宣言的に import
  #   → apply が idempotent no-op になる → この continue-on-error を削除して
  #   strict blocking gate に戻す。
  terraform-apply:
    name: Terraform Apply (IAM prereq)
    if: github.repository == 'y2ikgm89/myrrh-rental-space' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true # ⚠️ 2026-07-14 一時措置、上記コメント参照
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: terraform-runner@myrrh-rental-space.iam.gserviceaccount.com
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.0

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false
        env:
          TF_IN_AUTOMATION: "1"

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -input=false -auto-approve
        env:
          TF_IN_AUTOMATION: "1"

  deploy:
    name: Cloud Build Deploy
    needs: terraform-apply
    if: github.repository == 'y2ikgm89/myrrh-rental-space' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.BUILD_SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: beta

      - name: Submit Cloud Build
        shell: bash
        run: |
          set -euo pipefail

          BREAKING_MIGRATION_DEPLOY="false"
          BASE_SHA="${{ github.event.before }}"
          if [ -z "${BASE_SHA}" ] || [[ "${BASE_SHA}" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi

          mapfile -t changed_migrations < <(
            git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}" -- 'prisma/migrations/**/migration.sql'
          )

          if ((${#changed_migrations[@]} > 0)); then
            if grep -Eiq 'ALTER[[:space:]]+TABLE[[:space:]]+.*(DROP[[:space:]]+COLUMN|RENAME[[:space:]]+COLUMN|RENAME[[:space:]]+TO)|DROP[[:space:]]+TABLE|DROP[[:space:]]+TYPE' "${changed_migrations[@]}"; then
              BREAKING_MIGRATION_DEPLOY="true"
              printf 'Breaking migration deploy mode enabled for:\n'
              printf '  %s\n' "${changed_migrations[@]}"
            fi
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          SUBSTITUTIONS="SHORT_SHA=${SHORT_SHA}"
          SUBSTITUTIONS+=",_REGION=${REGION}"
          SUBSTITUTIONS+=",_SERVICE_NAME=${SERVICE_NAME}"
          SUBSTITUTIONS+=",_ADMIN_SERVICE_NAME=${ADMIN_SERVICE_NAME}"
          SUBSTITUTIONS+=",_IAP_JWT_AUDIENCE=${IAP_JWT_AUDIENCE}"
          SUBSTITUTIONS+=",_ADMIN_ROLE_GROUP_SUPER_ADMIN_EMAIL=${ADMIN_ROLE_GROUP_SUPER_ADMIN_EMAIL}"
          SUBSTITUTIONS+=",_ADMIN_ROLE_GROUP_ADMIN_EMAIL=${ADMIN_ROLE_GROUP_ADMIN_EMAIL}"
          SUBSTITUTIONS+=",_ADMIN_ROLE_GROUP_EDITOR_EMAIL=${ADMIN_ROLE_GROUP_EDITOR_EMAIL}"
          SUBSTITUTIONS+=",_ADMIN_ROLE_GROUP_VIEWER_EMAIL=${ADMIN_ROLE_GROUP_VIEWER_EMAIL}"
          SUBSTITUTIONS+=",_REPOSITORY=${AR_REPOSITORY}"
          SUBSTITUTIONS+=",_WORKER_POOL=${WORKER_POOL}"
          SUBSTITUTIONS+=",_SERVICE_ACCOUNT=${RUNTIME_SERVICE_ACCOUNT}"
          SUBSTITUTIONS+=",_BUILD_SERVICE_ACCOUNT=${BUILD_SERVICE_ACCOUNT}"
          SUBSTITUTIONS+=",_NEXT_PUBLIC_BASE_URL=${PUBLIC_DOMAIN}"
          SUBSTITUTIONS+=",_NEXT_PUBLIC_APP_URL=${PUBLIC_DOMAIN}"
          SUBSTITUTIONS+=",_BETTER_AUTH_URL=${PUBLIC_DOMAIN}"
          SUBSTITUTIONS+=",_ADMIN_APP_URL=${ADMIN_DOMAIN}"
          SUBSTITUTIONS+=",_CRON_OIDC_AUDIENCE=${CRON_OIDC_AUDIENCE}"
          SUBSTITUTIONS+=",_CRON_SERVICE_ACCOUNT_EMAIL=${CRON_SERVICE_ACCOUNT_EMAIL}"
          SUBSTITUTIONS+=",_NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}"
          SUBSTITUTIONS+=",_DATABASE_URL_SECRET_VERSION=1"
          SUBSTITUTIONS+=",_BREAKING_MIGRATION_DEPLOY=${BREAKING_MIGRATION_DEPLOY}"
          SUBSTITUTIONS+=",_BETTER_AUTH_SECRET_VERSION=1"
          SUBSTITUTIONS+=",_ENCRYPTION_KEY_SECRET_VERSION=1"
          SUBSTITUTIONS+=",_AUDIT_LOG_HMAC_KEY_SECRET_VERSION=1"
          SUBSTITUTIONS+=",_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY_SECRET_VERSION=1"
          SUBSTITUTIONS+=",_R2_ACCOUNT_ID_SECRET_VERSION=1"
          SUBSTITUTIONS+=",_R2_ACCESS_KEY_ID_SECRET_VERSION=1"
          SUBSTITUTIONS+=",_R2_SECRET_ACCESS_KEY_SECRET_VERSION=1"
          SUBSTITUTIONS+=",_R2_BUCKET_NAME_SECRET_VERSION=1"
          SUBSTITUTIONS+=",_R2_PUBLIC_URL_SECRET_VERSION=1"
          SUBSTITUTIONS+=",_CLOUDFLARE_ZONE_ID_SECRET_VERSION=1"
          SUBSTITUTIONS+=",_CLOUDFLARE_API_TOKEN_SECRET_VERSION=1"
          SUBSTITUTIONS+=",_CLOUDFLARE_ORIGIN_HEADER_SECRET_VERSION=1"
          SUBSTITUTIONS+=",_GOOGLE_CLIENT_ID_SECRET_VERSION=1"
          SUBSTITUTIONS+=",_GOOGLE_CLIENT_SECRET_SECRET_VERSION=1"

          gcloud beta builds submit \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --config=cloudbuild.yaml \
            --substitutions="${SUBSTITUTIONS}"
