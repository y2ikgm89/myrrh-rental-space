name: Deploy Production

# Cost / wake control: main merge ではデプロイしない。本番反映は手動
# (Actions → Deploy Production → Run workflow)。ref は main のみ受け付ける。
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: myrrh-rental-space
  PROJECT_NUMBER: "626108938746"
  REGION: asia-northeast1
  SERVICE_NAME: myrrh-rental-space
  ADMIN_SERVICE_NAME: myrrh-rental-space-admin
  AR_REPOSITORY: myrrh-rental-space
  WORKER_POOL: myrrh-deploy-pool
  RUNTIME_SERVICE_ACCOUNT: myrrh-rental-space-runtime@myrrh-rental-space.iam.gserviceaccount.com
  BUILD_SERVICE_ACCOUNT: myrrh-rental-space-build@myrrh-rental-space.iam.gserviceaccount.com
  CRON_SERVICE_ACCOUNT_EMAIL: myrrh-rental-space-scheduler@myrrh-rental-space.iam.gserviceaccount.com
  CRON_OIDC_AUDIENCE: https://rental-space.myrrh-jp.com
  WORKLOAD_IDENTITY_PROVIDER: projects/626108938746/locations/global/workloadIdentityPools/github-actions/providers/github-myrrh-rental-space
  PUBLIC_DOMAIN: https://rental-space.myrrh-jp.com
  ADMIN_DOMAIN: https://myrrh-rental-space-admin-626108938746.asia-northeast1.run.app
  IAP_JWT_AUDIENCE: /projects/626108938746/locations/asia-northeast1/services/myrrh-rental-space-admin
  ADMIN_ROLE_GROUP_SUPER_ADMIN_EMAIL: myrrh-super-admins@myrrh-jp.com
  ADMIN_ROLE_GROUP_ADMIN_EMAIL: myrrh-admins@myrrh-jp.com
  ADMIN_ROLE_GROUP_EDITOR_EMAIL: myrrh-editors@myrrh-jp.com
  ADMIN_ROLE_GROUP_VIEWER_EMAIL: myrrh-viewers@myrrh-jp.com
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAADi6Bqavj97fu7JG

jobs:
  # ---------------------------------------------------------------------------
  # require-green-main: 出荷する commit で required check が全部緑であることを
  # 確認する。fail closed。
  #
  # ## なぜ要るか
  #
  # 本 workflow は `workflow_dispatch` のみで、これまで **main の CI 結果を一切
  # 参照していなかった**（`check-run` / `conclusion` の照会が全文に 0 件）。
  # `required_status_checks.strict` は意図的に false（auto-merge の永久停止を
  # 避けるため。`__tests__/unit/architecture/ci-workflow-contract.test.ts` が固定）
  # なので、**互いに古い base で緑になった 2 PR が main を赤にする状況は正常に
  # 起こりうる**。その赤い main をそのまま terraform apply → Cloud Build →
  # migrate → 新リビジョン公開まで止めるものが無かった。
  # 型エラーは Docker build が落とすが、ロジック回帰は何も検出しない。
  #
  # ## 判定
  #
  # `.github/branch-protection.json` の `required_status_checks.contexts` を
  # SSoT として読む（ここに列挙をコピーしない — 2 箇所になった瞬間ずれる）。
  # 各 context について、この commit の check-run が `success` であること。
  # **存在しない・skipped は不合格**。「まだ終わっていない」を緑と読むのが
  # 一番危ないため。
  #
  # ## 実行中は「不合格」ではなく「待つ」
  #
  # 「まだ終わっていない」への応答は 2 つある — **緑と読む**（危険）か
  # **待つ**（安全）か。旧実装は 3 つ目の「即座に落とす」を選んでいたが、これは
  # fail-closed ではあっても**構造的な偽陰性**だった:
  #
  # - 本 workflow は `workflow_dispatch` のみ。人がマージ直後に叩くのが自然な運用
  # - マージは必ず main の CI を起動し、required check は 5〜8 分走る
  # - つまり「マージ → デプロイ」を素直にやると**毎回落ちる**
  #
  # 実害 (run 32996975971): 赤い check は 1 つも無く、`Lint & Format` /
  # `Unit Tests` / `Smoke E2E` の 3 件が `in_progress` だっただけで中止された。
  # dispatch が 1 回無駄になるうえ、**`Require green main` の赤い check-run が
  # main の HEAD コミットに残り続ける**（check-run は削除できない）。
  #
  # そこで **終端状態になるまで待ってから**、同じ厳格さで判定する。
  # 待っている間に赤くなればもちろん落ちる。緑と読む箇所はどこにも無い。
  #
  # ## 落ちたときの直し方
  #
  # override input は置かない。main を緑に戻すのが唯一の道で、それは
  # 「hotfix PR を required check 経由で merge する」か「CI を再実行する」の
  # どちらか。逃げ道を作ると、急いでいるときに必ずそちらが使われる。
  # ---------------------------------------------------------------------------
  require-green-main:
    name: Require green main
    if: github.repository == 'y2ikgm89/myrrh-rental-space' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 待つぶんの余裕。内側の deadline (`WAIT_SECONDS`) を先に踏ませ、job timeout で
    # 打ち切られて理由の分からない赤になるのを避ける。
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require every branch-protection context to be green on this commit
        shell: bash
        env:
          # 式展開を run に直接埋めない（script injection 対策・公式 hardening）。
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          # required check が終端状態になるまで待つ上限（秒）。実測の裾は
          # `Smoke E2E` と `Unit Tests` の 5〜6 分だが、Actions が混んでいると
          # 伸びるので 20 分取る。job の `timeout-minutes` はこれより長くする。
          WAIT_SECONDS: "1200"
          # 1 回の照会あたりの待ち（秒）。
          POLL_SECONDS: "20"
        run: |
          set -euo pipefail

          # 突合は jq の中で完結させ、名前を shell のテキストとして扱わない。
          # `jq -r` を経由して bash で比較する書き方は、jq がプラットフォーム次第で
          # CRLF を吐くと `$1 == name` が全滅する（Windows で実測。最後の 1 件だけ
          # 一致して 8/9 が「存在しない」になった）。JSON のまま扱えばその面が消える。
          #
          # gh 側で name と結果だけに絞ってから jq へ渡す。応答全体を
          # `--argjson` に載せると **argv 長の上限に当たる**（実測: `Argument list
          # too long`）。ここで 500 バイト程度まで落ちる。
          # `--paginate` はページごとに filter を適用するので出力は JSON の並び
          # になる。`jq -s` で 1 つのオブジェクトへ畳む
          # （`--slurp` は `--jq` と併用できない — gh がエラーで拒否する）。
          # `filter=latest`（既定）なので name ごとに最新の 1 件だけが来る。
          # `missing` は「check-run がまだ作られていない」= CI 起動直後にも起きる。
          # `queued` / `in_progress` などと同じく**未確定**として扱い、待つ。
          # 終端状態（success / failure / cancelled / timed_out / skipped /
          # neutral / action_required / stale）になって初めて判定に進む。
          unsettled='["missing","queued","in_progress","pending","waiting","requested"]'

          deadline=$(( SECONDS + WAIT_SECONDS ))
          while :; do
            result=$(gh api --paginate \
              "repos/${REPO}/commits/${COMMIT_SHA}/check-runs?per_page=100" \
              --jq '.check_runs[] | { key: .name, value: (.conclusion // .status) }' \
              | jq -s 'from_entries')

            # 列挙の SSoT は branch-protection.json。ここにコピーしない。
            report=$(jq -n \
              --slurpfile protection .github/branch-protection.json \
              --argjson result "$result" \
              '$protection[0].required_status_checks.contexts
               | map({ context: ., result: ($result[.] // "missing") })')

            # 走査が空振りしたまま「違反 0 件」で緑にならないようにする。
            # 判定は jq の終了コードで受ける（数値を bash に持ち込まないので、
            # jq の出力改行コードに依存しない）。
            if ! printf '%s' "$report" | jq -e 'length > 0' > /dev/null; then
              echo "::error::.github/branch-protection.json から required context を 1 件も読めなかった"
              exit 1
            fi

            # 全部が終端状態なら判定へ抜ける。
            if printf '%s' "$report" \
              | jq -e --argjson u "$unsettled" \
                  'all(.result as $r | ($u | index($r)) == null)' > /dev/null; then
              break
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              printf '%s' "$report" | jq -r '.[] | "\(.result)\t\(.context)"'
              printf '%s' "$report" \
                | jq -r --argjson u "$unsettled" \
                    '.[] | select(.result as $r | ($u | index($r)) != null)
                     | "::error::\(.context): \(.result)（待機上限まで終わらなかった）"'
              echo "::error::main (${COMMIT_SHA}) の required check が ${WAIT_SECONDS} 秒以内に終わらなかった。出荷を中止した。"
              exit 1
            fi

            # 待機中は 1 行だけ出す。全件表を毎回出すと 20 秒ごとに 9 行増える。
            printf '%s' "$report" \
              | jq -r --argjson u "$unsettled" \
                  '[.[] | select(.result as $r | ($u | index($r)) != null)
                   | "\(.context)=\(.result)"]
                   | "未確定: " + join(", ")'
            echo "--- ${POLL_SECONDS} 秒後に再照会する ---"
            sleep "$POLL_SECONDS"
          done

          printf '%s' "$report" | jq -r '.[] | "\(.result)\t\(.context)"'

          if ! printf '%s' "$report" | jq -e 'all(.result == "success")' > /dev/null; then
            printf '%s' "$report" \
              | jq -r '.[] | select(.result != "success") | "::error::\(.context): \(.result)"'
            echo "::error::main (${COMMIT_SHA}) は緑ではない。出荷を中止した。"
            echo "hotfix を merge して main を緑に戻すか、落ちた check を再実行してから再 dispatch する。"
            echo "（実行中だっただけなら、この job が終端まで待つので落ちない）"
            exit 1
          fi

          echo "every required check is green on ${COMMIT_SHA}"

  # Terraform apply を deploy より先に実行する (Codex P1 F6)。
  #
  # 過去は terraform.yml (push-to-main で terraform/** 変更に反応する path
  # フィルタ付き) と本 workflow が push-to-main で並列トリガーされ、両者の
  # concurrency group が別 (terraform-* / deploy-production) だったため実行
  # 順序が保証されていなかった。secret_iam の binding が Cloud Run deploy
  # より遅く反映されると `--set-secrets=` が Permission denied で silent fail
  # する race があった。
  #
  # 解決: terraform apply を deploy の needs 前段として本 workflow に統合し、
  # terraform.yml 側の push トリガー / apply job は廃止 (PR-only validate 化)。
  # terraform apply は idempotent なので、terraform 差分ゼロでも数秒で終わる。
  #
  # Bootstrap debt (empty state / runner IAM) は PR #1075–#1079 で解消済み。
  # 一時措置の job-level continue-on-error は PR #1081 で削除。terraform-apply
  # 失敗時は deploy を blocking する strict gate (needs: terraform-apply)。
  # PR gate (terraform.yml validate) + 本 gate の 2 層防御。
  terraform-apply:
    name: Terraform Apply (IAM prereq)
    needs: require-green-main
    if: github.repository == 'y2ikgm89/myrrh-rental-space' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 失敗通知は `deploy-result` job が持つ。この job に `issues: write` は要らない。
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: terraform-runner@myrrh-rental-space.iam.gserviceaccount.com
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          # 既定の wrapper は `-detailed-exitcode` の 2 を握り潰して 0 を返す。
          # 本 job の apply は無条件なので挙動自体は正しかったが、step summary が
          # 差分ありの plan を `Plan exit code: 0 (0=no changes)` と誤報していた。
          # 機械強制: __tests__/unit/architecture/terraform-detailed-exitcode.test.ts
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false
        env:
          TF_IN_AUTOMATION: "1"
          # Cloudflare provider v5 は `CLOUDFLARE_API_TOKEN` env var を
          # 自動採用する (terraform/cloudflare_provider.tf 参照)。init step
          # 自体は provider 認証を要さないが、provider fetch キャッシュに
          # 触れる potential path として先行注入する。Terraform 専用 token
          # (Zone.DNS/Zone.Cache Rules/... Write scope) は runtime token
          # (Cache Purge only) と発行/rotation を分離してある。
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TERRAFORM_API_TOKEN }}

      # 2026-07-14 Sprint 1 Item F: plan → artifact → summary → apply.
      #
      # 過去は `terraform apply -auto-approve` のみで、diff が Actions log
      # (default 90d retention) にしか残らなかった。post-mortem 時に
      # 「Tuesday 03:14 UTC に何が変わったか」を確認するには、log を retention
      # 内に取得するか、当該 SHA 前後の git bisect で再構築する必要があった。
      #
      # 段階 1-4 unblock saga (PR #1075/1076/1078/1079/1081) で確立した監査 loop
      # (drift detection + strict blocking gate) を完成させるため、apply 前に
      # 人間可読の text diff を artifact として保存し、Actions run 画面の
      # Summary tab で即読める形にする。
      #
      # 契約:
      #   - artifact 名は `terraform-plan-${{ github.sha }}` で commit 固定
      #   - retention は GitHub default (90d) — repo settings 変更不要
      #   - plan は idempotent (段階 4 で apply 完全 success 確認済み) なので、
      #     no-op run でも監査 record が残る
      #   - **artifact に載せるのは `tfplan.txt` だけ。binary plan (`tfplan`) は
      #     絶対に載せない。** binary plan は sensitive 値を平文で保持する
      #     (terraform plan の公式仕様。
      #     https://developer.hashicorp.com/terraform/cli/commands/plan の
      #     `-out` 節が "will be saved in cleartext in the plan file" と明記)。
      #     このリポジトリは `TF_VAR_cloudflare_origin_header_secret` を plan に
      #     渡しており、public repo の artifact は GitHub アカウントさえあれば
      #     誰でも取得できるため、binary を載せると本番共有 secret が公開される。
      #     `terraform apply` は同一 job のローカル `tfplan` を使うので、
      #     artifact に含めなくても apply は成立する。
      #     機械強制: __tests__/unit/architecture/deploy-plan-artifact-no-binary.test.ts
      - name: Terraform plan
        id: plan
        working-directory: terraform
        shell: bash
        run: |
          set +e
          terraform plan -out=tfplan -input=false -detailed-exitcode -no-color
          EXITCODE=$?
          set -e
          # -detailed-exitcode: 0=no changes, 1=error, 2=changes present
          if [ "$EXITCODE" -eq 1 ]; then
            echo "::error::terraform plan failed" >&2
            exit 1
          fi
          echo "exitcode=$EXITCODE" >> "$GITHUB_OUTPUT"
          if [ "$EXITCODE" -eq 2 ]; then
            echo "Plan produced changes (exit 2) — proceeding to apply"
          else
            echo "Plan is a no-op (exit 0)"
          fi
        env:
          TF_IN_AUTOMATION: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TERRAFORM_API_TOKEN }}
          # cloudflare_ruleset.transform_rules_late.value を Cloudflare へ書き込む
          # sensitive TF_VAR (variables.tf cloudflare_origin_header_secret 参照)。
          # rate-limit trust chain の共有 secret、Cloud Run 側 Secret Manager
          # `CLOUDFLARE_ORIGIN_HEADER_SECRET` と同一値を維持する契約。
          TF_VAR_cloudflare_origin_header_secret: ${{ secrets.CLOUDFLARE_ORIGIN_HEADER_SECRET_TF }}
          TF_VAR_monitoring_alert_email: ${{ secrets.MONITORING_ALERT_EMAIL_TF }}

      - name: Render plan to text
        working-directory: terraform
        shell: bash
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Verify plan does not leak secret values
        working-directory: terraform
        shell: bash
        run: |
          # このステップが守るのは `tfplan.txt` だけで、それで足りる
          # (artifact に載るのも Summary に出るのも `tfplan.txt` だけ)。
          #
          # `sensitive = true` の値は `terraform show` の描画で
          # `(sensitive value)` に伏せられるので、この grep では原理的に
          # 検出できない。検出対象は「sensitive 指定が漏れた属性が平文で
          # 描画されてしまう」ケース。binary plan 側の平文は grep では
          # 守れないため、そもそも artifact に載せないことで対処している
          # (上の「契約」を参照)。
          #
          # 対象 attribute 名 (secret_id / password_policy /
          # google_secret_manager_secret 等) の単純出現は無視し、値付き代入
          # (`attr = "..."` / diff の `+ attr = "..."`) のみ検知:
          if grep -Ein '^[[:space:]]*[+-]?[[:space:]]*(secret_data|password|private_key)[[:space:]]*=[[:space:]]*"[^"]+"' tfplan.txt; then
            echo "::error::Plan appears to contain literal secret values — investigate the hits above before merging" >&2
            exit 1
          fi
          echo "Secret-leak grep gate: OK"

      - name: Upload plan artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-plan-${{ github.sha }}
          # binary plan (`terraform/tfplan`) は sensitive 値を平文で持つので
          # 載せない。追加すると deploy-plan-artifact-no-binary gate が落ちる。
          path: terraform/tfplan.txt
          retention-days: 90
          if-no-files-found: error

      - name: Append plan to job summary
        working-directory: terraform
        shell: bash
        run: |
          {
            echo "## Terraform plan"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Plan exit code: \`${{ steps.plan.outputs.exitcode }}\` (0=no changes, 2=changes present)"
            echo "- Artifact: \`terraform-plan-${GITHUB_SHA}\` (retention 90d)"
            echo ""
            echo '```hcl'
            cat tfplan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -input=false tfplan
        env:
          TF_IN_AUTOMATION: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TERRAFORM_API_TOKEN }}
          # cloudflare_ruleset.transform_rules_late.value を Cloudflare へ書き込む
          # sensitive TF_VAR (variables.tf cloudflare_origin_header_secret 参照)。
          # rate-limit trust chain の共有 secret、Cloud Run 側 Secret Manager
          # `CLOUDFLARE_ORIGIN_HEADER_SECRET` と同一値を維持する契約。
          TF_VAR_cloudflare_origin_header_secret: ${{ secrets.CLOUDFLARE_ORIGIN_HEADER_SECRET_TF }}
          TF_VAR_monitoring_alert_email: ${{ secrets.MONITORING_ALERT_EMAIL_TF }}

  deploy:
    name: Cloud Build Deploy
    needs: terraform-apply
    if: github.repository == 'y2ikgm89/myrrh-rental-space' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.BUILD_SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: beta

      - name: Submit Cloud Build
        shell: bash
        run: |
          set -euo pipefail

          BREAKING_MIGRATION_DEPLOY="false"
          # workflow_dispatch には github.event.before が無い。複数 merge をまとめて
          # デプロイするため、まず Cloud Run 上の現行 serving image tag (SHORT_SHA) を
          # base にする。
          #
          # **template は読まない。** pin 中は spec.template が最新 revision を指す。
          # serving は status.traffic[0].revisionName。revisions describe の image は
          # digest（@sha256:…）であり、DEPLOYED_IMAGE##*: すると 64 hex になって
          # ^[0-9a-f]{7,40}$ に落ち、毎デプロイが計画ダウンタイムになる。
          # digest は Artifact Registry の tags から git SHA tag へ戻す。
          #
          # **ここは fail-closed でなければならない。** base の解決に失敗したとき
          # 「直前 1 コミット」へ黙って縮退すると、それ以前に merge 済みの破壊的
          # migration が diff の窓から外れ、**計画ダウンタイム無しで本番に出る**。
          # 旧実装は `2>/dev/null || true` で describe の失敗を握りつぶしていたので、
          # 認証切れ・region 誤り・一時障害のいずれでもその縮退が起きた。
          BASE_SHA=""
          DEPLOYED_IMAGE=""
          DEPLOYED_TAG=""
          DESCRIBE_ERR="$(mktemp)"
          set +e
          SERVING_REVISION="$(
            gcloud run services describe "${SERVICE_NAME}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --format='value(status.traffic[0].revisionName)' 2>"${DESCRIBE_ERR}"
          )"
          DESCRIBE_RC=$?
          set -e
          if [ "${DESCRIBE_RC}" -ne 0 ]; then
            if grep -qiE 'NOT_FOUND|could not be found|does not exist' "${DESCRIBE_ERR}"; then
              # サービスが未作成 = 初回デプロイ。守るべき旧 revision が無い。
              printf 'Cloud Run service %s does not exist yet (first deploy).\n' "${SERVICE_NAME}"
            else
              cat "${DESCRIBE_ERR}" >&2
              echo "::error::Cloud Run の現行 image tag を取得できませんでした。破壊的 migration の判定範囲を決められないためデプロイを中止します。" >&2
              exit 1
            fi
          else
            set +e
            DEPLOYED_IMAGE="$(
              gcloud run revisions describe "${SERVING_REVISION}" \
                --project="${PROJECT_ID}" \
                --region="${REGION}" \
                --format='value(spec.containers[0].image)' 2>"${DESCRIBE_ERR}"
            )"
            REVISION_RC=$?
            set -e
            if [ "${REVISION_RC}" -ne 0 ]; then
              cat "${DESCRIBE_ERR}" >&2
              echo "::error::Cloud Run の現行 image tag を取得できませんでした。破壊的 migration の判定範囲を決められないためデプロイを中止します。" >&2
              exit 1
            fi
            if [[ "${DEPLOYED_IMAGE}" == *@sha256:* ]]; then
              DIGEST="${DEPLOYED_IMAGE##*@}"
              set +e
              AR_TAGS="$(
                gcloud artifacts docker images list \
                  "${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/${SERVICE_NAME}" \
                  --include-tags \
                  --filter="version:${DIGEST}" \
                  --format='value(tags)' 2>"${DESCRIBE_ERR}"
              )"
              AR_RC=$?
              set -e
              if [ "${AR_RC}" -ne 0 ]; then
                cat "${DESCRIBE_ERR}" >&2
                echo "::error::Cloud Run の現行 image tag を取得できませんでした。破壊的 migration の判定範囲を決められないためデプロイを中止します。" >&2
                exit 1
              fi
              AR_TAGS="${AR_TAGS//[$'\t\r\n']/}"
              IFS=',;' read -r -a AR_TAG_ARR <<< "${AR_TAGS}"
              for tag in "${AR_TAG_ARR[@]}"; do
                tag="${tag//[\'\"\[\][:space:]]/}"
                if [[ "${tag}" =~ ^[0-9a-f]{7,40}$ ]]; then
                  DEPLOYED_TAG="${tag}"
                  break
                fi
              done
            else
              DEPLOYED_TAG="${DEPLOYED_IMAGE##*:}"
            fi
          fi
          rm -f "${DESCRIBE_ERR}"

          if [[ "${DEPLOYED_TAG}" =~ ^[0-9a-f]{7,40}$ ]]; then
            BASE_SHA="$(git rev-parse "${DEPLOYED_TAG}" 2>/dev/null || true)"
          fi
          if [ -z "${BASE_SHA}" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            # base を確定できない = どこから差分を取ればよいか分からない。
            # 窓を狭める代わりに**履歴全体**へ広げ、同時に安全側（計画ダウンタイム）へ倒す。
            # 余計な停止時間より、破壊的 DDL の見落としのほうが高くつく。
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
            BREAKING_MIGRATION_DEPLOY="true"
            echo "::warning::デプロイ済み revision から base を決められませんでした（tag: ${DEPLOYED_TAG:-none}）。履歴全体を走査し、計画ダウンタイムありで進めます。"
          fi
          printf 'Breaking-migration base: %s (deployed tag: %s)\n' "${BASE_SHA}" "${DEPLOYED_TAG:-none}"

          mapfile -t changed_migrations < <(
            git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}" -- 'prisma/migrations/**/migration.sql'
          )

          # grep は **行単位**で照合する。Prisma / 手書きの migration は
          #   ALTER TABLE "terms_agreements"
          #     ALTER COLUMN "resourceId" SET DATA TYPE TEXT;
          # のように改行を挟むことがあり、その場合どちらの行も単独では条件を
          # 満たさないため **判定が丸ごとすり抜ける**（= 破壊的変更が計画
          # ダウンタイム無しで本番に出る）。実測: `ALTER TABLE` と
          # `ALTER COLUMN ... SET DATA TYPE` を別行に分けた実在の migration が
          # この形で rc=1（不一致）だった。
          #
          # 照合前に「1 文 = 1 行」へ正規化する:
          #   1. `sed` で行コメント（`--` 以降）を落とす
          #      — 散文に "DROP COLUMN" 等が出て誤検知するのを防ぐ
          #   2. 改行を空白に潰して文の途中の折返しを繋ぐ
          #   3. `;` で分割して 1 文 1 行にする
          #      — 隣接する無関係な文どうしが `.*` で繋がる誤検知を防ぐ
          #
          # **`grep -q` を使ってはならない。** この step は `set -euo pipefail` 下に
          # あり、`-q` は最初のマッチで即 exit する。上流の `tr` が閉じたパイプへ
          # 書き込むと SIGPIPE で死に（rc=141）、`pipefail` がそれをパイプライン
          # 全体の status に昇格させるので、`if` は **マッチしたのに「不一致」と
          # 評価する** = 破壊的 migration が計画ダウンタイム無しで本番に出る。
          # 発火条件は「最初のマッチ以降に残る出力がパイプバッファ（64 KiB）を
          # 超えるか」で、ファイルの大きさと当たり位置に依存する間欠 fail-open に
          # なる。実測: 破壊的文を先頭に置いた 318 KiB の migration が現に
          # rc=141 で素通りした（先頭 37 バイトのものは正しく検出された）。
          # 代わりに `-q` を外して出力を `/dev/null` へ捨てる。grep が入力を
          # 最後まで読み切るので SIGPIPE が起きない。
          if ((${#changed_migrations[@]} > 0)); then
            for migration_file in "${changed_migrations[@]}"; do
              # 削除された migration は diff に出るが実体が無い（通常は起きない）
              [ -f "${migration_file}" ] || continue
              if sed 's/--.*$//' "${migration_file}" \
                | tr '\n' ' ' \
                | tr ';' '\n' \
                | grep -Ei 'ALTER[[:space:]]+TABLE[[:space:]]+.*(DROP[[:space:]]+COLUMN|DROP[[:space:]]+CONSTRAINT|RENAME[[:space:]]+COLUMN|RENAME[[:space:]]+TO|ALTER[[:space:]]+COLUMN[[:space:]]+.*(SET[[:space:]]+NOT[[:space:]]+NULL|DROP[[:space:]]+DEFAULT|TYPE))|ALTER[[:space:]]+TYPE[[:space:]]+.*(RENAME[[:space:]]+VALUE|RENAME[[:space:]]+TO)|DROP[[:space:]]+TABLE|DROP[[:space:]]+TYPE' > /dev/null; then
                BREAKING_MIGRATION_DEPLOY="true"
                printf 'Breaking migration deploy mode enabled by: %s\n' "${migration_file}"
              fi
            done
          fi

          {
            echo "## rollback 判定"
            echo ""
            echo "- BREAKING_MIGRATION_DEPLOY=${BREAKING_MIGRATION_DEPLOY}"
            echo "- base: \`${BASE_SHA}\`"
            echo "- migrations:"
            if ((${#changed_migrations[@]} == 0)); then
              echo "  - なし"
            else
              for migration_file in "${changed_migrations[@]}"; do
                echo "  - \`${migration_file}\`"
              done
            fi
            echo ""
            echo "読み方: docs/runbooks/production-rollback.md"
          } >> "$GITHUB_STEP_SUMMARY"

          SHORT_SHA="${GITHUB_SHA::7}"
          SUBSTITUTIONS="SHORT_SHA=${SHORT_SHA}"
          SUBSTITUTIONS+=",_REGION=${REGION}"
          SUBSTITUTIONS+=",_SERVICE_NAME=${SERVICE_NAME}"
          SUBSTITUTIONS+=",_ADMIN_SERVICE_NAME=${ADMIN_SERVICE_NAME}"
          SUBSTITUTIONS+=",_IAP_JWT_AUDIENCE=${IAP_JWT_AUDIENCE}"
          SUBSTITUTIONS+=",_ADMIN_ROLE_GROUP_SUPER_ADMIN_EMAIL=${ADMIN_ROLE_GROUP_SUPER_ADMIN_EMAIL}"
          SUBSTITUTIONS+=",_ADMIN_ROLE_GROUP_ADMIN_EMAIL=${ADMIN_ROLE_GROUP_ADMIN_EMAIL}"
          SUBSTITUTIONS+=",_ADMIN_ROLE_GROUP_EDITOR_EMAIL=${ADMIN_ROLE_GROUP_EDITOR_EMAIL}"
          SUBSTITUTIONS+=",_ADMIN_ROLE_GROUP_VIEWER_EMAIL=${ADMIN_ROLE_GROUP_VIEWER_EMAIL}"
          SUBSTITUTIONS+=",_REPOSITORY=${AR_REPOSITORY}"
          SUBSTITUTIONS+=",_WORKER_POOL=${WORKER_POOL}"
          # Runtime SA / service shape は Terraform SSoT。Cloud Build は image のみ更新
          # するため `_SERVICE_ACCOUNT` substitution は渡さない（unmatched key 防止）。
          SUBSTITUTIONS+=",_BUILD_SERVICE_ACCOUNT=${BUILD_SERVICE_ACCOUNT}"
          SUBSTITUTIONS+=",_NEXT_PUBLIC_BASE_URL=${PUBLIC_DOMAIN}"
          SUBSTITUTIONS+=",_NEXT_PUBLIC_APP_URL=${PUBLIC_DOMAIN}"
          SUBSTITUTIONS+=",_BETTER_AUTH_URL=${PUBLIC_DOMAIN}"
          SUBSTITUTIONS+=",_ADMIN_APP_URL=${ADMIN_DOMAIN}"
          SUBSTITUTIONS+=",_CRON_OIDC_AUDIENCE=${CRON_OIDC_AUDIENCE}"
          SUBSTITUTIONS+=",_CRON_SERVICE_ACCOUNT_EMAIL=${CRON_SERVICE_ACCOUNT_EMAIL}"
          SUBSTITUTIONS+=",_NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}"
          SUBSTITUTIONS+=",_BREAKING_MIGRATION_DEPLOY=${BREAKING_MIGRATION_DEPLOY}"
          # ---- Secret version substitutions (build-time inline のみ) ----
          #
          # Phase 6b (PR #1101, 2026-07-14) で Cloud Run runtime secret bindings は
          # Terraform SSoT に完全移管 (terraform/variables.tf の
          # `cloud_run_secret_versions` map)。cloudbuild.yaml の runtime 用
          # `--set-secrets=` は削除済のため、対応する `_*_SECRET_VERSION`
          # substitutions も撤去 (Cloud Build "unmatched key" INVALID_ARGUMENT
          # 対策)。残存する _NEXT_SERVER_ACTIONS_ENCRYPTION_KEY_SECRET_VERSION は
          # cloudbuild.yaml の availableSecrets block で **build-time inline** に
          # 使用 (Next.js が client bundle に inline 化)。build-time と runtime の
          # 両 SSoT を維持する必要あり (secret 値は同じだが用途が違う)。
          SUBSTITUTIONS+=",_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY_SECRET_VERSION=1"

          gcloud beta builds submit \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --config=cloudbuild.yaml \
            --substitutions="${SUBSTITUTIONS}"

      - name: Verify canary revision before promoting
        env:
          PUBLIC_ORIGIN: ${{ env.PUBLIC_DOMAIN }}
        shell: bash
        run: |
          set -euo pipefail
          probe_sha="${GITHUB_SHA::7}"

          # Cloud Run が tag に割り当てた URL を使う。書式は公式どおり
          # https://[TAG---]SERVICE_IDENTIFIER.run.app だが、host を組み立てない。
          # 実測 (2026-08-25): tag 未割当で組み立てた host は HTTP 404。
          # https://docs.cloud.google.com/run/docs/triggering/https-request
          # https://docs.cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration#tags
          canary_origin=""
          attempt=1
          while [ "$attempt" -le 12 ]; do
            while IFS=',' read -r tag url _; do
              tag="${tag//$'\r'/}"
              url="${url//$'\r'/}"
              url="${url%/}"
              if [ "$tag" = "canary" ] && [[ "$url" == https://* ]]; then
                canary_origin="$url"
                break
              fi
            done < <(
              gcloud run services describe "${SERVICE_NAME}" \
                --project="${PROJECT_ID}" \
                --region="${REGION}" \
                --flatten='status.traffic[]' \
                --format='csv[no-heading](status.traffic.tag,status.traffic.url,status.traffic.revisionName)'
            )
            if [ -n "$canary_origin" ]; then
              break
            fi
            sleep 5
            attempt=$((attempt + 1))
          done
          if [ -z "$canary_origin" ]; then
            echo "::error::${SERVICE_NAME}: status.traffic に tag=canary の url が無い。" >&2
            gcloud run services describe "${SERVICE_NAME}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --format='yaml(status.traffic,status.url)' >&2 || true
            exit 1
          fi
          echo "canary origin ${canary_origin}"

          # 破壊的 migration モードでも canary を飛ばさない。
          # 破壊的モードでは cloudbuild が両サービスを --scaling=0 にしてから
          # migrate する。deploy-public は --scaling=auto を同時に渡すので
          # canary 検証中は自動スケーリングに戻っており、旧 revision が新
          # schema に対して 500 を返す。追加の停止時間は canary 検証分
          # （数十秒）で、310 秒の drain に対して十分小さい。
          # 条件分岐で無効化すると、最も危険な deploy だけ検証されなくなる。

          # 新 revision が tag URL に載るまでの短い窓。curl 失敗 (000) と、
          # tag hostname 未配線の 404 だけ数回待つ。それ以外の HTTP は即 fail。
          curl_headers() {
            local url="$1"
            local headers="$2"
            local extra_retry="${3:-}"
            local attempt=1
            local code="000"
            while [ "$attempt" -le 6 ]; do
              code="$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' --max-time 30 "$url" || true)"
              if [ "$code" != "000" ] && [ "$code" != "$extra_retry" ]; then
                printf '%s' "$code"
                return 0
              fi
              sleep 10
              attempt=$((attempt + 1))
            done
            printf '%s' "$code"
          }

          # A-PR4 の公開面内容検査を tag URL に流す。
          # Cloudflare の cache ヘッダは見ない（tag URL は run.app 直）。
          # admin IAP も見ない（admin は canary しない）。
          live_headers="$(mktemp)"
          live_code="$(curl_headers "${canary_origin}/api/live" "$live_headers" "404")"
          if [ "$live_code" != "200" ]; then
            echo "::error::${canary_origin}/api/live は 200 を期待。得たのは $live_code"
            cat "$live_headers"
            exit 1
          fi
          echo "ok ${canary_origin}/api/live $live_code"

          for path in "/" "/spaces"; do
            headers="$(mktemp)"
            code="$(curl_headers "${canary_origin}${path}?deploy-probe=${probe_sha}" "$headers")"
            if [ "$code" != "200" ]; then
              echo "::error::${canary_origin}${path} は 200 を期待。得たのは $code"
              cat "$headers"
              exit 1
            fi
            echo "ok ${canary_origin}${path} $code"
          done

          sitemap_headers="$(mktemp)"
          sitemap_url="${canary_origin}/sitemap.xml?deploy-probe=${probe_sha}"
          sitemap_code="$(curl_headers "$sitemap_url" "$sitemap_headers")"
          if [ "$sitemap_code" != "200" ]; then
            echo "::error::${sitemap_url} は 200 を期待。得たのは $sitemap_code"
            cat "$sitemap_headers"
            exit 1
          fi
          sitemap_body="$(mktemp)"
          curl -sS -o "$sitemap_body" --max-time 30 "$sitemap_url"
          lastmod_count="$(grep -c '<lastmod>' "$sitemap_body" || true)"
          if [ "$lastmod_count" -lt 1 ]; then
            echo "::error::${sitemap_url} の <lastmod> が ${lastmod_count}。DB 全断の fallbackStaticSitemap は lastmod 0 のまま 200 を返す"
            exit 1
          fi
          bad_origin_count=0
          while IFS= read -r loc; do
            [ -z "$loc" ] && continue
            case "$loc" in
              "${PUBLIC_ORIGIN}"*) ;;
              *) bad_origin_count=$((bad_origin_count + 1)) ;;
            esac
          done < <(sed -n 's/.*<loc>\([^<]*\)<\/loc>.*/\1/p' "$sitemap_body")
          if [ "$bad_origin_count" -ne 0 ]; then
            echo "::error::${sitemap_url} に ${PUBLIC_ORIGIN} で始まらない <loc> が ${bad_origin_count} 件"
            exit 1
          fi
          echo "ok ${sitemap_url} $sitemap_code lastmod=${lastmod_count}"

      - name: Promote to latest revision and verify serving image
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_PATH="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/${SERVICE_NAME}"

          # --clear-tags と --to-latest は別グループ。併用時は tag 変更が先、
          # そのあと traffic 百分率。公式:
          # https://docs.cloud.google.com/sdk/gcloud/reference/run/services/update-traffic
          promote_and_verify() {
            local service="$1"
            shift
            gcloud run services update-traffic "${service}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --to-latest \
              "$@"

            local revision image digest tags tag deployed_tag
            revision="$(
              gcloud run services describe "${service}" \
                --project="${PROJECT_ID}" \
                --region="${REGION}" \
                --format='value(status.traffic[0].revisionName)'
            )"
            if [ -z "${revision}" ]; then
              echo "::error::${service}: traffic[0].revisionName が空です。" >&2
              exit 1
            fi

            image="$(
              gcloud run revisions describe "${revision}" \
                --project="${PROJECT_ID}" \
                --region="${REGION}" \
                --format='value(spec.containers[0].image)'
            )"
            if [[ "${image}" == *@sha256:* ]]; then
              digest="${image##*@}"
              tags="$(
                gcloud artifacts docker images list \
                  "${IMAGE_PATH}" \
                  --include-tags \
                  --filter="version:${digest}" \
                  --format='value(tags)'
              )"
              deployed_tag=""
              tags="${tags//[$'\t\r\n']/}"
              IFS=',;' read -r -a tag_arr <<< "${tags}"
              for tag in "${tag_arr[@]}"; do
                tag="${tag//[\'\"\[\][:space:]]/}"
                if [[ "${tag}" =~ ^[0-9a-f]{7,40}$ ]]; then
                  deployed_tag="${tag}"
                  break
                fi
              done
            else
              deployed_tag="${image##*:}"
            fi
            if [ "${deployed_tag}" != "${SHORT_SHA}" ]; then
              echo "::error::${service}: serving image tag が ${SHORT_SHA} ではない（revision=${revision} tag=${deployed_tag:-none} image=${image}）。" >&2
              exit 1
            fi
            printf 'promoted %s to %s (tag %s)\n' "${service}" "${revision}" "${deployed_tag}"
          }

          promote_and_verify "${SERVICE_NAME}" --clear-tags
          promote_and_verify "${ADMIN_SERVICE_NAME}"

  # デプロイ後の公開面 / IAP 到達性。Cloud Run の /api/live probe は
  # 「プロセスが起動した」ことしか見ない。ここは Cloudflare 経由の公開 URL と
  # admin IAP を外から叩く。失敗しても revision は既に出ている — workflow を
  # 赤にして検証 NG を明示する（自動 rollback はしない）。
  #
  # 読み方: docs/runbooks/post-deploy-verification.md
  # 切り戻し: docs/runbooks/production-rollback.md
  post-deploy-smoke:
    name: Post-deploy smoke
    needs: deploy
    if: github.repository == 'y2ikgm89/myrrh-rental-space' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe public pages and admin IAP
        env:
          PUBLIC_ORIGIN: ${{ env.PUBLIC_DOMAIN }}
          ADMIN_ORIGIN: ${{ env.ADMIN_DOMAIN }}
        shell: bash
        run: |
          set -euo pipefail
          probe_sha="${GITHUB_SHA::7}"

          # 新 revision が CF / Cloud Run に載るまでの短い窓。curl 失敗 (000) だけ
          # 数回待つ。HTTP 本体が期待と違うときは即 fail（誤った 200 待ちはしない）。
          curl_headers() {
            local url="$1"
            local headers="$2"
            local attempt=1
            local code="000"
            while [ "$attempt" -le 6 ]; do
              code="$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' --max-time 30 "$url" || true)"
              if [ "$code" != "000" ]; then
                printf '%s' "$code"
                return 0
              fi
              sleep 10
              attempt=$((attempt + 1))
            done
            printf '%s' "$code"
          }

          live_headers="$(mktemp)"
          live_code="$(curl_headers "${PUBLIC_ORIGIN}/api/live" "$live_headers")"
          if [ "$live_code" != "200" ]; then
            echo "::error::${PUBLIC_ORIGIN}/api/live は 200 を期待。得たのは $live_code"
            cat "$live_headers"
            exit 1
          fi
          echo "ok ${PUBLIC_ORIGIN}/api/live $live_code"

          # /feed.xml と <title> は足さない。前者は posts feature OFF で
          # notFound()、後者は error boundary でも入るので何も証明しない。
          for path in "/" "/spaces"; do
            headers="$(mktemp)"
            code="$(curl_headers "${PUBLIC_ORIGIN}${path}?deploy-probe=${probe_sha}" "$headers")"
            if [ "$code" != "200" ]; then
              echo "::error::${PUBLIC_ORIGIN}${path} は 200 を期待。得たのは $code"
              cat "$headers"
              exit 1
            fi
            if ! grep -qiE '^cf-cache-status:' "$headers"; then
              echo "::error::${PUBLIC_ORIGIN}${path} に cf-cache-status が無い（Cloudflare 経由ではない）"
              cat "$headers"
              exit 1
            fi
            echo "ok ${PUBLIC_ORIGIN}${path} $code $(grep -iE '^cf-cache-status:' "$headers" | tr -d '\r')"
          done

          sitemap_headers="$(mktemp)"
          sitemap_url="${PUBLIC_ORIGIN}/sitemap.xml?deploy-probe=${probe_sha}"
          sitemap_code="$(curl_headers "$sitemap_url" "$sitemap_headers")"
          if [ "$sitemap_code" != "200" ]; then
            echo "::error::${sitemap_url} は 200 を期待。得たのは $sitemap_code"
            cat "$sitemap_headers"
            exit 1
          fi
          sitemap_body="$(mktemp)"
          curl -sS -o "$sitemap_body" --max-time 30 "$sitemap_url"
          lastmod_count="$(grep -c '<lastmod>' "$sitemap_body" || true)"
          if [ "$lastmod_count" -lt 1 ]; then
            echo "::error::${sitemap_url} の <lastmod> が ${lastmod_count}。DB 全断の fallbackStaticSitemap は lastmod 0 のまま 200 を返す"
            exit 1
          fi
          bad_origin_count=0
          while IFS= read -r loc; do
            [ -z "$loc" ] && continue
            case "$loc" in
              "${PUBLIC_ORIGIN}"*) ;;
              *) bad_origin_count=$((bad_origin_count + 1)) ;;
            esac
          done < <(sed -n 's/.*<loc>\([^<]*\)<\/loc>.*/\1/p' "$sitemap_body")
          if [ "$bad_origin_count" -ne 0 ]; then
            echo "::error::${sitemap_url} に ${PUBLIC_ORIGIN} で始まらない <loc> が ${bad_origin_count} 件"
            exit 1
          fi
          echo "ok ${sitemap_url} $sitemap_code lastmod=${lastmod_count}"

          admin_headers="$(mktemp)"
          # IAP は未認証を 302（Accounts へ）または 401 にする。リダイレクトは追わない。
          admin_code="$(curl_headers "${ADMIN_ORIGIN}/" "$admin_headers")"
          if [ "$admin_code" != "302" ] && [ "$admin_code" != "401" ]; then
            echo "::error::${ADMIN_ORIGIN}/ は IAP で 302 または 401 を期待。得たのは $admin_code"
            cat "$admin_headers"
            exit 1
          fi
          echo "ok ${ADMIN_ORIGIN}/ $admin_code (IAP)"

  # 手動デプロイの結果を **人が見える場所へ出す** 唯一の経路。
  #
  # 旧実装は terraform-apply job の中の step (`Open apply failure issue`) で、
  # **開くことしかしなかった**。そのため:
  #
  #   - 復旧しても閉じないので Issue が永久に残る。実測 2026-08-11 時点で
  #     `[deploy-broken] ...` の open が 7 件 / closed が 0 件。うち 6 件は
  #     07-19 のもので、08-08 の success で復旧済み = 現状を 1 件も表して
  #     いなかった。
  #   - title に SHA を埋めていたので、復旧 run は別 title になり既存 Issue に
  #     辿り着けない。失敗のたびに新しい Issue が増えるだけだった (07-19 に 6 件)。
  #   - 通知が terraform-apply job の中にあったので、**deploy job の失敗は
  #     一切通知されなかった**。実測: 08-07 と 07-24 x2 の failure run は
  #     いずれも terraform-apply が success / deploy が failure で、対応する
  #     Issue が存在しない。
  #
  # 現行は ci.yml の `post-merge-result` と同じ形にする。失敗したら Issue を立て
  # (既に開いていればコメントを足し)、復旧したら同じ Issue に復旧を記録して
  # 閉じる。**自己解消する**ので、開いている Issue の存在そのものが
  # 「いま Deploy Production が赤」を意味する。
  #
  # 強制: `__tests__/unit/architecture/status-notifier-self-resolves.test.ts`
  deploy-result:
    name: Deploy result notice
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [require-green-main, terraform-apply, deploy, post-deploy-smoke]
    # `always()` が無いと **緑の run で job ごと skip され、閉じる経路が消える**。
    #
    # repository / ref ガードは前段 job と同一にする。ここだけ緩めると、main
    # 以外の ref へ dispatch したときに前段が両方 skipped になり、それを
    # 「緑」と読んで**開いている Issue を閉じてしまう**。
    if: ${{ always() && github.repository == 'y2ikgm89/myrrh-rental-space' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      issues: write
    steps:
      # ローカル action (`uses: ./…`) を使うため checkout が要る。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide deploy status
        id: status
        env:
          # 式展開を run に直接埋めない（script injection 対策・公式 hardening）。
          # 値は全て env 経由で受け取る。
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # **「failure でない = 緑」ではない。** `needs.<job>.result` は failure 以外に
          # cancelled を取る。timeout で打ち切られた job を緑と読まないよう、
          # 「success でも skipped でもないものは失敗」と裏返す。値の名前を列挙
          # しないので、将来 result に新しい値が増えても取りこぼさない。
          #
          # `skipped` の明示除外は必須。terraform-apply が失敗すると deploy は
          # skipped になるが、その run は terraform-apply の failure で既に赤と
          # 判定される。除外を外すと復旧不能な二重計上になる。
          failed=$(printf '%s' "$NEEDS_JSON" \
            | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')

          if [ -z "$failed" ]; then
            # 空文字 = 緑。status-notice はこれを見て Issue を閉じる。
            echo "report=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 複数行を step output で渡す公式の書き方（delimiter 付き heredoc）。
          {
            echo "report<<__NOTICE_EOF__"
            printf '%s\n' \
              "Deploy Production (workflow_dispatch) が失敗しました。" \
              "" \
              "- run: $RUN_URL" \
              "- commit: \`$COMMIT_SHA\`" \
              "- 失敗した job: $failed" \
              "" \
              "失敗した job を見て切り分けること:" \
              "" \
              "- terraform-apply / deploy の失敗: 新 revision は出ていない（build / migrate も走らない）" \
              "- post-deploy-smoke の失敗: デプロイは済んでいる。公開面または IAP の検証が NG" \
              "  （読み方: docs/runbooks/post-deploy-verification.md）" \
              "  （切り戻し: docs/runbooks/production-rollback.md）" \
              "" \
              "1. 上の run の log で原因を特定する" \
              "2. 修正 PR を main へ merge する" \
              "3. Actions → Deploy Production を手動実行する" \
              "" \
              "次に緑になった run が本 Issue を自動で閉じます（手で閉じる必要はありません）。"
            echo "__NOTICE_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Notify deploy status
        uses: ./.github/actions/status-notice
        with:
          # **title に SHA や run id を混ぜてはならない。** 混ぜると復旧 run が
          # 別 title になり、既存 Issue へ辿り着けず増える一方になる（旧実装）。
          title: Deploy Production failure
          marker: "<!-- deploy-production-status: do not remove (owned by deploy-production.yml / deploy-result) -->"
          report: ${{ steps.status.outputs.report }}
          recovered-message: Deploy Production が復旧しました（${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}）。
          label: deploy-broken
          label-description: Deploy Production failure (self-resolving; owned by deploy-result)
          github-token: ${{ secrets.GITHUB_TOKEN }}
