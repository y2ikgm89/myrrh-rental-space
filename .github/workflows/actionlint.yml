name: Actionlint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actionlint.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actionlint.yml"

jobs:
  actionlint:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # SHA 直 pin (公式 security best practice、詳細は
        # .claude/rules/ops/ci-workflow.md §8.1)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0

      # rhysd/actionlint: GitHub Actions workflow の lint（syntax + expression + shellcheck）
      # 公式: https://github.com/rhysd/actionlint
      - name: Download actionlint
        id: actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Run actionlint
        run: ${{ steps.actionlint.outputs.executable }} -color
