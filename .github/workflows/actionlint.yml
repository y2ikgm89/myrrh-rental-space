name: Actionlint

# `paths:` filter を故意に付けない (terraform.yml と同型の 2026-07-14 anti-pattern 修正)。
#
# `paths: [.github/workflows/**, .github/actions/**]` で filter すると、対象外の PR で
# 本 workflow が発火せず、この check を required 化した際に MISSING 扱いになり
# branch protection で auto-merge が永久 block される (GitHub 公式仕様、PR #1103 実例)。
# 参考: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/troubleshooting-rulesets#pull-requests-are-blocked-when-status-checks-are-required-but-not-set-up
#
# 対策: `paths:` filter を撤去し全 PR で走らせる。実行時間 ~数十秒 (actionlint バイナリの
# DL+検証+実行のみ、read-only) なので CI 予算的に許容。
# `architecture-boundaries.test.ts` の「required checks に path-filtered workflow を
# 含めない」regression gate も、この workflow が provide する check を将来 required 化
# する際に同種の再発を検出する。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小権限の原則（公式 Security hardening）。読み取りのみで十分。
# https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions
permissions:
  contents: read

jobs:
  actionlint:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # SHA 直 pin（公式 security best practice。tag force-push 攻撃 + codeload 404 outage 対策）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rhysd/actionlint v1.7.12 を SHA256 検証付きで取得して直接実行する。
      # 旧方式 `bash <(curl ...main/scripts/download-actionlint.bash)` は
      # - main ブランチからの取得 = supply-chain 攻撃 surface
      # - SHA256 検証なし = MITM / tag force-push リスク
      # を伴うため、公式 release asset を SHA256 で固定する方式に置換。
      # 公式 release: https://github.com/rhysd/actionlint/releases/tag/v1.7.12
      # バージョン更新時は SHA256 も併せて更新する
      # (gh api repos/rhysd/actionlint/releases/tags/<tag> --jq '.assets[].digest')。
      - name: Download & verify actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint
          ./actionlint -version

      - name: Run actionlint
        run: ./actionlint -color
