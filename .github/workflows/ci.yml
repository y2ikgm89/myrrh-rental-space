name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
  # server.ts の z.string().min(32) と整合（短い値だと将来 server env を読むテストで破綻する）
  BETTER_AUTH_SECRET: test-secret-key-for-ci-0123456789abcdef0123456789ab
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

jobs:
  policy-docs-sync:
    name: Policy docs (codex-rules ↔ .claude/rules)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bun 未セットアップでも動くよう Node のみで検証（スクリプト正本）
      - name: Verify Lexical + inline editor rules are byte-identical
        run: node scripts/verify-policy-docs.mjs

  lint-and-typecheck:
    name: Lint & Type Check
    needs: [policy-docs-sync]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Run type check
        run: bun run type-check

  unit-tests:
    name: Unit Tests
    needs: [policy-docs-sync]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx --bun prisma generate

      - name: Run database migrations
        run: bunx --bun prisma migrate deploy

      - name: Run unit tests with coverage (threshold 90% via bunfig.toml)
        run: bun test --coverage

      - name: Coverage threshold fallback check
        if: success()
        run: node scripts/check-coverage.mjs --threshold 90

  e2e-tests:
    name: E2E Tests
    needs: [policy-docs-sync]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Generate Prisma client
        run: bunx --bun prisma generate

      - name: Run database migrations
        run: bunx --bun prisma migrate deploy

      - name: Seed test database
        run: bunx --bun prisma db seed

      - name: Build application
        run: bun run build:skip-env

      - name: Run E2E tests
        run: bunx playwright test
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  build:
    name: Build (env validation)
    runs-on: ubuntu-latest
    needs: [policy-docs-sync, lint-and-typecheck]
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx --bun prisma generate

      - name: Build with env validation
        run: bun run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789ab
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x0000000000000000000000000000000AA
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE2NDE3OTkyMDAsImV4cCI6MTk1NzM3NTIwMH0.placeholder
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-XXXXXXXXXX
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          CRON_SECRET: test-cron-secret-for-ci-build-strict-0123456789ab
          ADMIN_LOGIN_TOKEN: test-admin-login-token-for-ci-build-strict-0123456789ab
          RESEND_API_KEY: re_test_placeholder_for_ci_strict_build_only
          STRIPE_SECRET_KEY: sk_test_placeholder_for_ci_strict_build_only
          GOOGLE_CLIENT_ID: test-google-client-id.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: test-google-client-secret-for-ci-strict-build

  docs:
    name: Generate API Docs
    runs-on: ubuntu-latest
    needs: [policy-docs-sync, lint-and-typecheck]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate API documentation
        run: bun run docs

      - name: Upload API docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/api/
          retention-days: 90
