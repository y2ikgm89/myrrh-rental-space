name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    # PR に `visual-regression` ラベルが付与されると visual-regression job が起動
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run E2E tests"
        type: boolean
        required: false
        default: false
      run_visual:
        description: "Run visual regression tests (with --update-snapshots to regenerate baseline)"
        type: boolean
        required: false
        default: false
      update_visual_baseline:
        description: "Regenerate visual baseline (commit to repo after success)"
        type: boolean
        required: false
        default: false
      run_lighthouse:
        description: "Run Lighthouse CI"
        type: boolean
        required: false
        default: false

# 同一ブランチ・同一ワークフローで進行中の run があれば cancel。
# main / develop 以外では PR push のたびに前 run を捨てる。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

env:
  # GitHub-hosted runner の Node デフォルト heap (~2GB) は大規模 monorepo の
  # `tsc --noEmit` や `next build` (TypeScript フェーズ) で不足する。
  # ubuntu-latest は 16 GB RAM 確保されているため 4 GB 割当で確実に賄える。
  NODE_OPTIONS: "--max-old-space-size=4096"
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
  # server.ts の z.string().min(32) と整合（短い値だと将来 server env を読むテストで破綻する）
  BETTER_AUTH_SECRET: test-secret-key-for-ci-0123456789abcdef0123456789ab
  BETTER_AUTH_URL: http://localhost:3000
  # clientEnv（@t3-oss/env-nextjs）の z.string().url() を満たすため両 URL を渡す。
  # E2E / Visual / Lighthouse の Playwright webServer が `next start` を起動する際に
  # NEXT_PUBLIC_BASE_URL 未設定だと Invalid environment variables で起動失敗する。
  NEXT_PUBLIC_BASE_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

jobs:
  dependency-audit:
    name: Dependency Audit (bun audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # package.json#packageManager (bun@X.Y.Z) を SSoT として読み取り、
          # workflow への version hardcode drift を防止。
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # high 以上の脆弱性検出時は job 失敗。低 severity の transitive deps は許容
      - name: Run bun audit
        run: bun audit --prod --severity=high 2>&1 | tee audit-report.txt

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-${{ github.event.pull_request.number || github.sha }}
          path: audit-report.txt
          retention-days: 90

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Prettier format check を全ファイル対象で実行（lefthook が pre-commit で
      # auto-fix する前提だが、CI でも最終ゲートとして検証）
      - name: Check code formatting
        run: bun run format:check

      - name: Run lint
        run: bun run lint

      - name: Run type check
        run: bun run type-check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx --bun prisma generate

      - name: Run database migrations
        run: bunx --bun prisma migrate deploy

      # per-file isolation 実行（scripts/run-tests.mjs）必須:
      # mock.module() は process グローバルに live binding を残すため、複数 test
      # ファイルを同一 bun test 起動で実行すると干渉する（公式 docs の guidance）。
      # 各 *.test.ts を独立 bun サブプロセスで起動して干渉を物理的に排除する。
      - name: Run unit tests (per-file isolation)
        run: bun run test:unit

      - name: Run integration tests (per-file isolation)
        run: bun run test:integration

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    # E2E は重く maintenance コストが高いため opt-in 実行（Stripe / Vercel / Linear
    # 等の業界標準パターン）。
    # - PR に `e2e` ラベル付与時 (labeled イベント含む)
    # - workflow_dispatch で手動実行時
    # main / develop への push では実行しない。本番デプロイ前検証は
    # post-deploy-smoke skill (HTTP smoke) と Cloud Run staging で代替。
    if: |
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Playwright browsers は大きい (chromium ~130MB)。hash ベースで cache
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium --with-deps

      - name: Install Playwright system deps (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Generate Prisma client
        run: bunx --bun prisma generate

      - name: Run database migrations
        run: bunx --bun prisma migrate deploy

      - name: Seed test database
        run: bunx --bun prisma db seed

      - name: Build application
        run: bun run build:skip-env
        env:
          # NEXT_PUBLIC_* は build 時に static replace されるため build step で渡す。
          # E2E 専用 opt-in: DevLoginButton を production build でも表示し、
          # setup-customer / setup-admin が dev login ボタンをクリックできるようにする。
          # staging / production には絶対伝播させない（login bypass risk）。
          NEXT_PUBLIC_ENABLE_E2E_LOGIN: "1"
          SKIP_ENV_VALIDATION: "true"

      - name: Run E2E tests
        run: bunx playwright test
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          # webServer が next start で起動する際の runtime env。
          NEXT_PUBLIC_ENABLE_E2E_LOGIN: "1"
          # production build を `next start` で動かすため validateProductionEnv の
          # 要求 env を埋める（lhci-start.ts と同方針）。
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          CRON_SECRET: "test-cron-secret-for-ci-e2e-strict-0123456789ab"
          ADMIN_LOGIN_TOKEN: "test-admin-login-token-for-ci-e2e-strict-0123456789ab"
          R2_ACCOUNT_ID: "test-r2-account"
          R2_ACCESS_KEY_ID: "test-r2-access-key"
          R2_SECRET_ACCESS_KEY: "test-r2-secret-key-32-min-length!!"
          R2_BUCKET_NAME: "test-r2-bucket"
          R2_PUBLIC_URL: "https://example.com"
          RESEND_API_KEY: "re_test_placeholder_for_ci_e2e_only"
          STRIPE_SECRET_KEY: "sk_test_placeholder_for_ci_e2e_only"
          GOOGLE_CLIENT_ID: "test-google-client-id.apps.googleusercontent.com"
          GOOGLE_CLIENT_SECRET: "test-google-client-secret-for-ci-e2e"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  build:
    name: Build (env validation)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx --bun prisma generate

      - name: Build with env validation
        run: bun run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789ab
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x0000000000000000000000000000000AA
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-XXXXXXXXXX
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          CRON_SECRET: test-cron-secret-for-ci-build-strict-0123456789ab
          ADMIN_LOGIN_TOKEN: test-admin-login-token-for-ci-build-strict-0123456789ab
          RESEND_API_KEY: re_test_placeholder_for_ci_strict_build_only
          STRIPE_SECRET_KEY: sk_test_placeholder_for_ci_strict_build_only
          GOOGLE_CLIENT_ID: test-google-client-id.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: test-google-client-secret-for-ci-strict-build

  bundle-size-diff:
    name: Bundle Size Diff (PR comment)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    # PR のみ実行（base vs head の gzipped size 差分を sticky comment）
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # preactjs/compressed-size-action:
      # base と head で build を実行し、指定 pattern のファイルサイズを gzip で比較
      # 参照: https://github.com/preactjs/compressed-size-action
      - name: Compressed size diff
        uses: preactjs/compressed-size-action@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          build-script: "build:skip-env"
          pattern: ".next/static/**/*.{js,css}"
          exclude: "{**/*.map,**/node_modules/**}"
          # 1KB 以下の増減は警告しない（noise 削減）
          minimum-change-threshold: 1024

  bundle-analysis:
    name: Bundle Analysis (Turbopack)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    # PR とメインブランチ push のみで実行（フィーチャーブランチ push はスキップ）
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx --bun prisma generate

      # Next.js 16 公式の Turbopack-native bundle analyzer
      # 結果は .next/diagnostics/analyze に出力される
      - name: Run bundle analyzer
        run: bun run analyze
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Upload bundle analysis artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-analysis-${{ github.event.pull_request.number || github.sha }}
          path: .next/diagnostics/analyze/
          retention-days: 30

  lighthouse-ci:
    name: Lighthouse CI (perf / a11y / SEO)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    # Lighthouse は重く Cloud Run staging URL での実測の方が本番に近い指標が得られる
    # ため opt-in 実行に変更（Web.dev / Calibre 等の現代パフォーマンス計測のベスト
    # プラクティス: 静的 build を runner で測るより staging 環境の RUM ベース計測を
    # 優先）。
    # - PR に `lighthouse` ラベル付与時
    # - workflow_dispatch で手動実行時
    if: |
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'lighthouse')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_lighthouse == 'true')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx --bun prisma generate

      - name: Run database migrations
        run: bunx --bun prisma migrate deploy

      - name: Seed test database
        run: bunx --bun prisma db seed

      # Lighthouse CI autorun: .lighthouserc.json 設定に従い
      # collect → assert → upload (temporary-public-storage) を一括実行
      - name: Run Lighthouse CI
        run: bunx lhci autorun --config=.lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report-${{ github.event.pull_request.number || github.sha }}
          path: .lighthouseci/
          retention-days: 30

  visual-regression:
    name: Visual Regression (opt-in)
    runs-on: ubuntu-latest
    # opt-in 実行条件:
    # - PR に `visual-regression` ラベルが付与された（labeled イベント含む）
    # - workflow_dispatch で run_visual=true 指定（baseline 比較）
    # - workflow_dispatch で update_visual_baseline=true 指定（baseline 再生成 + commit）
    # baseline regeneration は意図的な workflow_dispatch でのみ実行する（main push
    # 自動 regeneration は破壊的変更時に baseline を silent 上書きする risk のため廃止）。
    permissions:
      contents: write # baseline commit 用
    if: |
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'visual-regression')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.run_visual == 'true' || github.event.inputs.update_visual_baseline == 'true'))
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Generate Prisma client
        run: bunx --bun prisma generate

      - name: Run database migrations
        run: bunx --bun prisma migrate deploy

      - name: Seed test database
        run: bunx --bun prisma db seed

      - name: Build application
        run: bun run build:skip-env
        env:
          SKIP_ENV_VALIDATION: "true"

      # Playwright 公式の visual regression:
      # - baseline が存在すれば diff 検証
      # - update_visual_baseline=true で --update-snapshots を渡して baseline を再生成
      #   （CI Ubuntu runner と本番の font rendering が一致するため CI 上で baseline 生成が canonical）
      - name: Run visual regression tests
        run: |
          if [ "${{ github.event.inputs.update_visual_baseline }}" = "true" ]; then
            bunx playwright test --project=chromium-visual --update-snapshots
          else
            bunx playwright test --project=chromium-visual
          fi
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_VISUAL: "1"
          # production build を `next start` で動かすため validateProductionEnv の
          # 要求 env を埋める（webServer は playwright.config.ts の分岐により CI で next start）。
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          CRON_SECRET: "test-cron-secret-for-ci-visual-strict-0123456789ab"
          ADMIN_LOGIN_TOKEN: "test-admin-login-token-for-ci-visual-strict-0123456789ab"
          R2_ACCOUNT_ID: "test-r2-account"
          R2_ACCESS_KEY_ID: "test-r2-access-key"
          R2_SECRET_ACCESS_KEY: "test-r2-secret-key-32-min-length!!"
          R2_BUCKET_NAME: "test-r2-bucket"
          R2_PUBLIC_URL: "https://example.com"
          RESEND_API_KEY: "re_test_placeholder_for_ci_visual_only"
          STRIPE_SECRET_KEY: "sk_test_placeholder_for_ci_visual_only"
          GOOGLE_CLIENT_ID: "test-google-client-id.apps.googleusercontent.com"
          GOOGLE_CLIENT_SECRET: "test-google-client-secret-for-ci-visual"

      - name: Upload Playwright visual diff report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-visual-report-${{ github.event.pull_request.number || github.sha }}
          path: |
            playwright-report/
            e2e/visual/**/*-snapshots/
          retention-days: 30

      # baseline 再生成成功時、生成された snapshot を main に commit する。
      # 再生成は意図的な操作のため push back は safe。
      - name: Commit regenerated visual baseline
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.update_visual_baseline == 'true' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'e2e/visual/**/*-snapshots/' || true
          if git diff --cached --quiet; then
            echo "[visual baseline] no changes to commit"
          else
            git commit -m "ci(visual): regenerate visual baseline (run ${{ github.run_id }} by ${{ github.actor }})"
            git push origin HEAD:${{ github.ref_name }}
          fi

  docs:
    name: Generate API Docs
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate API documentation
        run: bun run docs

      - name: Upload API docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/api/
          retention-days: 90
