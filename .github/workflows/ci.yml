name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    # PR に `visual-regression` ラベルが付与されると visual-regression job が起動
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      run_visual:
        description: "Run visual regression tests"
        type: boolean
        required: false
        default: false

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
  # server.ts の z.string().min(32) と整合（短い値だと将来 server env を読むテストで破綻する）
  BETTER_AUTH_SECRET: test-secret-key-for-ci-0123456789abcdef0123456789ab
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

jobs:
  dependency-audit:
    name: Dependency Audit (bun audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # high 以上の脆弱性検出時は job 失敗。低 severity の transitive deps は許容
      - name: Run bun audit
        run: bun audit --prod --severity=high 2>&1 | tee audit-report.txt

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-${{ github.event.pull_request.number || github.sha }}
          path: audit-report.txt
          retention-days: 90

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Prettier format check を全ファイル対象で実行（lefthook が pre-commit で
      # auto-fix する前提だが、CI でも最終ゲートとして検証）
      - name: Check code formatting
        run: bun run format:check

      - name: Run lint
        run: bun run lint

      - name: Run type check
        run: bun run type-check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx --bun prisma generate

      - name: Run database migrations
        run: bunx --bun prisma migrate deploy

      # per-directory batch 必須（mock.module グローバル干渉防止）
      - name: Run unit tests (per-directory batch)
        run: bun run test:unit

      - name: Run integration tests (per-directory batch)
        run: bun run test:integration

      # coverage は全件統合実行でのみ計測可能だが mock 干渉するため、
      # CI では per-directory batch で correctness を優先する。
      # coverage 計測はローカル `bun test --coverage` で参考値として取得。

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Playwright browsers は大きい (chromium ~130MB)。hash ベースで cache
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium --with-deps

      - name: Install Playwright system deps (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Generate Prisma client
        run: bunx --bun prisma generate

      - name: Run database migrations
        run: bunx --bun prisma migrate deploy

      - name: Seed test database
        run: bunx --bun prisma db seed

      - name: Build application
        run: bun run build:skip-env

      - name: Run E2E tests
        run: bunx playwright test
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  build:
    name: Build (env validation)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx --bun prisma generate

      - name: Build with env validation
        run: bun run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789ab
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x0000000000000000000000000000000AA
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-XXXXXXXXXX
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          CRON_SECRET: test-cron-secret-for-ci-build-strict-0123456789ab
          ADMIN_LOGIN_TOKEN: test-admin-login-token-for-ci-build-strict-0123456789ab
          RESEND_API_KEY: re_test_placeholder_for_ci_strict_build_only
          STRIPE_SECRET_KEY: sk_test_placeholder_for_ci_strict_build_only
          GOOGLE_CLIENT_ID: test-google-client-id.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: test-google-client-secret-for-ci-strict-build

  bundle-size-diff:
    name: Bundle Size Diff (PR comment)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    # PR のみ実行（base vs head の gzipped size 差分を sticky comment）
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # preactjs/compressed-size-action:
      # base と head で build を実行し、指定 pattern のファイルサイズを gzip で比較
      # 参照: https://github.com/preactjs/compressed-size-action
      - name: Compressed size diff
        uses: preactjs/compressed-size-action@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          build-script: "build:skip-env"
          pattern: ".next/static/**/*.{js,css}"
          exclude: "{**/*.map,**/node_modules/**}"
          # 1KB 以下の増減は警告しない（noise 削減）
          minimum-change-threshold: 1024

  bundle-analysis:
    name: Bundle Analysis (Turbopack)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    # PR とメインブランチ push のみで実行（フィーチャーブランチ push はスキップ）
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx --bun prisma generate

      # Next.js 16 公式の Turbopack-native bundle analyzer
      # 結果は .next/diagnostics/analyze に出力される
      - name: Run bundle analyzer
        run: bun run analyze
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Upload bundle analysis artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-analysis-${{ github.event.pull_request.number || github.sha }}
          path: .next/diagnostics/analyze/
          retention-days: 30

  lighthouse-ci:
    name: Lighthouse CI (perf / a11y / SEO)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    # Lighthouse は重いため main/develop push と PR のみ実行
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx --bun prisma generate

      - name: Run database migrations
        run: bunx --bun prisma migrate deploy

      - name: Seed test database
        run: bunx --bun prisma db seed

      # Lighthouse CI autorun: .lighthouserc.json 設定に従い
      # collect → assert → upload (temporary-public-storage) を一括実行
      - name: Run Lighthouse CI
        run: bunx lhci autorun --config=.lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report-${{ github.event.pull_request.number || github.sha }}
          path: .lighthouseci/
          retention-days: 30

  visual-regression:
    name: Visual Regression (opt-in)
    runs-on: ubuntu-latest
    # opt-in 実行条件:
    # - PR に `visual-regression` ラベルが付与された（labeled イベント含む）
    # - workflow_dispatch で run_visual=true 指定
    # - main/develop への push（baseline regeneration 用）
    if: |
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'visual-regression')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_visual == 'true') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Generate Prisma client
        run: bunx --bun prisma generate

      - name: Run database migrations
        run: bunx --bun prisma migrate deploy

      - name: Seed test database
        run: bunx --bun prisma db seed

      - name: Build application
        run: bun run build:skip-env

      # Playwright 公式の visual regression:
      # - baseline が存在すれば diff 検証
      # - 初回 / baseline 変更時は --update-snapshots で artifact として生成
      - name: Run visual regression tests
        run: bunx playwright test --project=chromium-visual
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_VISUAL: "1"

      - name: Upload Playwright visual diff report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-visual-report-${{ github.event.pull_request.number || github.sha }}
          path: |
            playwright-report/
            e2e/visual/**/*-snapshots/
          retention-days: 30

  docs:
    name: Generate API Docs
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate API documentation
        run: bun run docs

      - name: Upload API docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/api/
          retention-days: 90
