name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  # 広域 E2E の nightly 実行。opt-in の手動 dispatch だけに頼ると失敗が誰にも
  # 見られないまま滞留する（実例: 2026-07-31 に main で 3 件の hard failure が
  # 放置されていた）。18:00 UTC = 03:00 JST の低トラフィック帯に main を回す。
  # concurrency group に event_name を含めているため push run とは干渉しない。
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      run_full_ci:
        description: "Run full CI (E2E, visual comparison, Lighthouse)"
        type: boolean
        required: false
        default: false
      update_visual_baseline:
        description: "Regenerate visual baseline (commit to repo after success)"
        type: boolean
        required: false
        default: false

# 同一イベントタイプで進行中の run があれば cancel（feature branch のみ）。
# event_name を group に含めることで workflow_dispatch (手動 trigger) と push (auto)
# が独立 group となり、互いに cancel し合わない（race condition 回避）。
# main は履歴保持のため cancel しない、feature branch は PR push のたびに前 run を捨てる。
#
# **push だけ commit 単位の group にする。** ref 単位にすると main への push が
# すべて同じ group に入り、「main は cancel しない」設定と噛み合って run が
# **job を 1 つも実行しないまま捨てられる**。公式:
#
# > any existing `pending` job or workflow in the same concurrency group will be
# > canceled and the new queued job or workflow will take its place
#
# つまり保持される pending は 1 本だけで、3 本目の push が 2 本目を追い出す。
# 実測: PR を 3 本続けてマージしたとき、2 本目のマージ commit の run が
# jobs=0 のまま cancelled になった（直近 100 run で同じ形が 6 件）。
#
# `queue: max`（pending を最大 100 本保持）は使えない — 公式が
# `cancel-in-progress: true` との併用を validation error と定めており、
# ここは PR で true に評価される式だから。commit 単位の group なら
# PR 側のキャンセル挙動を一切変えずに取りこぼしだけが消える。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Workflow-level の最小権限 default。
# 個別 job (bundle-size-diff = pull-requests:write, visual-regression =
# contents:write + pull-requests:write) は job-level permissions で override される。
# 公式: https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions
permissions:
  contents: read

env:
  # service postgres image は Docker Hub (`postgres:18`) ではなく
  # `public.ecr.aws/docker/library/postgres:18` を使う。
  # バージョンは**本番 Neon（18 系）と docker-compose.yml に揃える**。
  # 三者がずれると環境差の切り分けができなくなる。
  # Docker Hub 匿名 pull は hosted runner で timeout / rate-limit flake が出るため
  # （認証不要の AWS Public ECR Official Images ミラー）。
  # https://gallery.ecr.aws/docker/library/postgres
  # GitHub-hosted runner の Node デフォルト heap (~2GB) は大規模 monorepo の
  # `tsc --noEmit` や `next build` (TypeScript フェーズ) で不足する。
  # ubuntu-latest は 16 GB RAM 確保されているため 4 GB 割当で確実に賄える。
  NODE_OPTIONS: "--max-old-space-size=4096"
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
  # Prisma CLI (prisma.config.ts datasource). Local/CI: same as DATABASE_URL.
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/test_db
  # 実 DB 必須の統合テスト（イベント overbooking TOCTOU 等）が接続するテスト DB。
  # 未設定だと当該テストは describe ごと skip される（dev DB 誤汚染防止の安全弁）。
  # `test:all` が `test:db:migrate` で `prisma migrate deploy` を適用してから実行する。
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
  # server.ts の z.string().min(32) と整合（短い値だと将来 server env を読むテストで破綻する）
  BETTER_AUTH_SECRET: test-secret-key-for-ci-0123456789abcdef0123456789ab
  BETTER_AUTH_URL: http://localhost:3000
  AUDIT_LOG_HMAC_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  AUDIT_LOG_HMAC_KEY_ID: ci
  # clientEnv（@t3-oss/env-nextjs）の z.string().url() を満たすため両 URL を渡す。
  # E2E / Visual / Lighthouse の Playwright webServer が `next start` を起動する際に
  # NEXT_PUBLIC_BASE_URL 未設定だと Invalid environment variables で起動失敗する。
  NEXT_PUBLIC_BASE_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
  # Production-mode Playwright webServer also runs server env validation.
  # These are non-secret dummy Google group addresses for CI only.
  ADMIN_ROLE_GROUP_SUPER_ADMIN_EMAIL: ci-super-admins@example.com
  ADMIN_ROLE_GROUP_ADMIN_EMAIL: ci-admins@example.com
  ADMIN_ROLE_GROUP_EDITOR_EMAIL: ci-editors@example.com
  ADMIN_ROLE_GROUP_VIEWER_EMAIL: ci-viewers@example.com

jobs:
  # ---------------------------------------------------------------------------
  # migration-safety: 意図的な破壊的 migration を明示する gate（Risk 1）。
  # Cloud Run ローリング切替窓（cloudbuild Step6 migrate → Step7 deploy の間も
  # 旧リビジョンが処理）で旧コードが破壊済み新スキーマを叩く 500 を merge 前に検出する。
  # 破壊的 migration は SQL に rule 名つき `-- squawk-ignore <rule>` または
  # `-- squawk-ignore-file <rule>` を置き、旧参照ゼロを確認して明示する。
  # job は常に走らせ（required check の安定化）、squawk step のみ migration
  # 変更時に gate する。**この gate だけは残す** — squawk は migration SQL を
  # 読む道具で、SQL が変わっていなければ実行しても常に同じ結果になるため、
  # 「走らせなかったせいで見逃す」形が構造的に存在しない。
  # 他の job にあった path gate（旧 `changes` job）はこの性質を持たず、
  # md を読む architecture gate まで飛ばしていたので撤去した。
  # escape hatch は SQL 内の
  # `-- squawk-ignore <rule>` / `-- squawk-ignore-file <rule>`
  # （意図的な破壊的 migration 用）。
  # ---------------------------------------------------------------------------
  migration-safety:
    name: Migration Safety (squawk)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed migrations
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # shell: シェルエスケープ済みのファイル一覧を outputs.migrations_files に出力
          list-files: shell
          # `added|modified` を明示する。既定の change type は **deleted も含む**ため、
          # migration 履歴を畳む PR（99 本削除 + 1 本追加）では削除済みパスまで
          # outputs.migrations_files に載り、squawk が実体の無いファイルを読んで落ちる。
          # 削除された migration は lint しようが無いので、そもそも列挙させない。
          # https://github.com/dorny/paths-filter
          # `.squawk.toml` も trigger に含める。設定（`pg_version` や除外ルール）だけを
          # 変えた PR で squawk job が走らないと、**設定変更が一度も検証されないまま
          # main に入る**。次に migration を足した誰かが、無関係な PR で初めて壊れを踏む。
          # 設定変更時に走るのは下の Self-test gate（fixture で unsafe→検出 /
          # safe→通過 / ignored→通過 を実証する）で、そこが実質の検証になる。
          # `migrations_files` に `.squawk.toml` が載っても `lint-migrations.ts` は
          # migration SQL 以外を無視するので無害（実測済み）。
          filters: |
            migrations:
              - added|modified: 'prisma/migrations/**/migration.sql'
              - added|modified: '.squawk.toml'

      - name: Setup Bun
        if: steps.filter.outputs.migrations == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # 公式リリースの生バイナリを SHA256 検証して直接実行する。
      # npm ラッパー（squawk-cli）は spawn 失敗時に exit 0 を返し偽陰性を生むため不使用。
      # バージョン更新時は SHA256 も更新（gh api .../releases/tags/vX で digest 取得）。
      - name: Download & verify squawk
        if: steps.filter.outputs.migrations == 'true'
        env:
          SQUAWK_VERSION: "2.51.0"
          SQUAWK_SHA256: "8433b7e4500ce6ab7e5b4283ba80be9dde46b7a4de9e22bf766a217777ddb6f9"
        run: |
          set -euo pipefail
          curl -fsSL -o squawk \
            "https://github.com/sbdchd/squawk/releases/download/v${SQUAWK_VERSION}/squawk-linux-x64"
          echo "${SQUAWK_SHA256}  squawk" | sha256sum -c -
          chmod +x squawk
          ./squawk --version

      # 毎回 fixture でゲート挙動を実証（unsafe→検出 / safe→通過 / ignored→通過）。
      # squawk の挙動・除外設定の回帰をこの環境で検出する。
      - name: Self-test gate (fixtures)
        if: steps.filter.outputs.migrations == 'true'
        env:
          SQUAWK_BIN: ${{ github.workspace }}/squawk
        run: bun scripts/lint-migrations.ts --selftest

      - name: Lint changed migrations
        if: steps.filter.outputs.migrations == 'true'
        env:
          SQUAWK_BIN: ${{ github.workspace }}/squawk
        run: bun scripts/lint-migrations.ts ${{ steps.filter.outputs.migrations_files }}

  dependency-audit:
    name: Dependency Audit (bun audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun-deps

      # high 以上の脆弱性検出時は job 失敗。低 severity の transitive deps は許容。
      #
      # **`--prod` は付けない。** 付けると dev 依存ツリー（`@lhci/cli` / `typedoc` /
      # `react-email` / `eslint-plugin-react-hooks`）の advisory を一切見なくなる。
      # 実測（2026-08-11）: `--prod` 付きが "No vulnerabilities found" の状態で
      # 素の `bun audit` は 9 件（high 4）を報告していた。`docs/dependency-overrides.md`
      # の pin 表には元から dev 専用 pin（`minimatch` / `basic-ftp` 等）が入っており、
      # 「dev も潰す」が運用の実態。gate だけがそれより狭く、差分が無言で溜まっていた。
      #
      # `set -euo pipefail` は必須。`run:` の既定 shell は非 Windows で `bash -e {0}` と
      # 定義されており `-o pipefail` を含まない（`shell: bash` を明示した場合のみ
      # `bash --noprofile --norc -eo pipefail {0}` になる）。pipefail 無しでは
      # `| tee` を挟んだ時点でパイプライン終了コードが常に tee の 0 になり、
      # bun audit の非ゼロ終了が握り潰されて gate が完全な no-op になる。
      # 公式: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
      #
      # severity 閾値は `--audit-level`。`--severity` は bun audit に存在しないフラグで、
      # bun は未知フラグを黙って無視するため閾値が一切効かない状態になる。
      # 公式: https://bun.com/docs/install/audit
      - name: Run bun audit
        run: |
          set -euo pipefail
          bun audit --audit-level=high 2>&1 | tee audit-report.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-${{ github.event.pull_request.number || github.sha }}
          path: audit-report.txt
          retention-days: 90

  # ---------------------------------------------------------------------------
  # lint-format / type-check は並列実行。typecheck (~2-3 分) が dominant のため
  # 直列実行時の wall clock 損失を回避。両 job を branch protection の required
  # status check に個別登録する。単一 wrapper job は持たず、失敗面を明確に分ける。
  # ---------------------------------------------------------------------------
  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun-deps

      # job 内の step は順次実行されるため、read-only な format check と lint は
      # wrapper 内で同時起動して Lint & Format の wall clock を短縮する。
      - name: Run lint and format checks
        run: bun run lint-format

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun-deps

      - name: Run type check
        run: bun run type-check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18@sha256:1957b2ff3137e4ef7f3bc813e74fff50b1e1ffddc85c8b9d6f14ade972be8687
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun-deps

      # per-file isolation 実行（scripts/run-tests.ts）必須:
      # mock.module() は process グローバルに live binding を残すため、複数 test
      # ファイルを同一 bun test 起動で実行すると干渉する（公式 docs の guidance）。
      # 各 *.test.ts を独立 bun サブプロセスで起動して干渉を物理的に排除する。
      - name: Run unit and integration tests (per-file isolation)
        run: bun run test:all

  smoke-e2e:
    name: Smoke E2E (critical path)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 毎 push 実行する critical path smoke。`chromium-smoke`
    # (`e2e/smoke/*.smoke.spec.ts`) に加え、public surface では
    # `chromium-a11y-public`（公開面 axe）を回す（+約 30 秒）。
    # 広域 E2E (`e2e-tests` job) は full CI opt-in 維持、本 job のみ
    # branch protection required status checks に含める。
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18@sha256:1957b2ff3137e4ef7f3bc813e74fff50b1e1ffddc85c8b9d6f14ade972be8687
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun-deps

      - name: Setup Playwright Chromium
        uses: ./.github/actions/setup-playwright-chromium

      - name: Generate Prisma client
        run: bunx --bun prisma generate

      # migrate / seed はここでやらない。Playwright の webServer chain
      # (`playwright.config.ts`) が `test:db:migrate` → `bun prisma/seed.ts --dev` を
      # **毎回実行する**ので、先に流しても同じ DB を 2 度作り直すだけになる
      # (`prisma db seed` は引数なし = dev モードで、chain の `--dev` と同一経路)。
      # build は DB を要求しない (`generateStaticParams` は 0 件・静的 prelude は空。
      # 実測: 0 テーブルの空 DB に対して `build:skip-env:prepared` が exit 0)。

      # Turbopack build キャッシュ。設計と実測は build job の同名 step を見ること。
      # variant を分けるのは `NEXT_PUBLIC_ENABLE_E2E_LOGIN=1` でビルドするから
      # （`NEXT_PUBLIC_*` は build 時にバンドルへ焼き込まれるので、env validation
      # 側のビルド成果とは別物になる）。
      - name: Cache Turbopack build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-smoke-${{ runner.os }}-${{ hashFiles('bun.lock', 'next.config.ts', 'package.json') }}

      - name: Build application
        run: bun run build:skip-env:prepared
        env:
          NEXT_PUBLIC_ENABLE_E2E_LOGIN: "1"
          SKIP_ENV_VALIDATION: "true"

      - name: Run public smoke E2E tests
        run: bunx playwright test --project=chromium-smoke --project=chromium-a11y-public
        env:
          CI: true
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/public
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_ENABLE_E2E_LOGIN: "1"
          APP_SURFACE: public
          ADMIN_APP_URL: http://localhost:3000
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          SUPPRESSION_HASH_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          CRON_OIDC_AUDIENCE: "http://localhost:3000"
          CRON_SERVICE_ACCOUNT_EMAIL: "scheduler-ci@example.iam.gserviceaccount.com"
          R2_ACCOUNT_ID: "test-r2-account"
          R2_ACCESS_KEY_ID: "test-r2-access-key"
          R2_SECRET_ACCESS_KEY: "test-r2-secret-key-32-min-length!!"
          R2_BUCKET_NAME: "test-r2-bucket"
          R2_INQUIRIES_BUCKET_NAME: "test-r2-inquiries-bucket"
          R2_PUBLIC_URL: "https://example.com"
          RESEND_API_KEY: "re_test_placeholder_for_ci_smoke_only"
          STRIPE_SECRET_KEY: "sk_test_placeholder_for_ci_smoke_only"
          GOOGLE_CLIENT_ID: "test-google-client-id.apps.googleusercontent.com"
          GOOGLE_CLIENT_SECRET: "test-google-client-secret-for-ci-smoke"

      - name: Run admin smoke E2E tests
        # admin surface でしか踏めない経路だけを選ぶ（PR feedback を短く保つため全件は回さない）。
        # - 管理入口: IAP 模擬の到達性
        # - CSP violation: admin だけが読み込む sonner の <style> hash / Radix scroll lock
        run: bunx playwright test --project=chromium-smoke e2e/smoke/auth.smoke.spec.ts e2e/smoke/homepage.smoke.spec.ts --grep "管理入口|CSP violation"
        env:
          CI: true
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/admin
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_ENABLE_E2E_LOGIN: "1"
          APP_SURFACE: admin
          ADMIN_APP_URL: http://localhost:3000
          IAP_JWT_AUDIENCE: "/projects/123456789012/locations/asia-northeast1/services/myrrh-rental-space-admin"
          # e2e/fixtures/test-data.ts の testUsers.admin と一致させる（seed 上 SUPER_ADMIN）。
          # admin@example.com は seed 上 ADMIN で settings:manage / auditLog:read を持たない。
          ADMIN_TEST_IAP_EMAIL: "superadmin@example.com"
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          SUPPRESSION_HASH_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          CRON_OIDC_AUDIENCE: "http://localhost:3000"
          CRON_SERVICE_ACCOUNT_EMAIL: "scheduler-ci@example.iam.gserviceaccount.com"
          R2_ACCOUNT_ID: "test-r2-account"
          R2_ACCESS_KEY_ID: "test-r2-access-key"
          R2_SECRET_ACCESS_KEY: "test-r2-secret-key-32-min-length!!"
          R2_BUCKET_NAME: "test-r2-bucket"
          R2_INQUIRIES_BUCKET_NAME: "test-r2-inquiries-bucket"
          R2_PUBLIC_URL: "https://example.com"
          RESEND_API_KEY: "re_test_placeholder_for_ci_smoke_only"
          STRIPE_SECRET_KEY: "sk_test_placeholder_for_ci_smoke_only"
          GOOGLE_CLIENT_ID: "test-google-client-id.apps.googleusercontent.com"
          GOOGLE_CLIENT_SECRET: "test-google-client-secret-for-ci-smoke"

      # 同一 job で playwright test を 2 回走らせると、後段の HTML reporter が前段を上書きする
      # （実測: run 32815852317 の smoke artifact は admin 2 件だけ残り public 26 件を失った）。
      # Playwright は PLAYWRIGHT_HTML_OUTPUT_DIR を reportFolderFromEnv() ?? resolveReporterOutputPath(...) より優先する。
      - name: Upload smoke Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-smoke-report-${{ github.event.pull_request.number || github.sha }}
          path: playwright-report/
          retention-days: 14

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 広域 E2E は重く maintenance コストが高いため opt-in 実行。
    # critical path は `smoke-e2e` job が毎 push でカバー。
    # 起動経路:
    # - nightly の schedule（main、18:00 UTC = 03:00 JST）
    # - workflow_dispatch で run_full_ci=true 指定
    #
    # かつて `codex/full-ci/` prefix の PR branch でも起動する条件があったが、
    # **起動実績はゼロだったため撤去した**（2026-07-31 時点の調査:
    # `gh pr list --state all --limit 1000` で PR #673〜#1679 を走査、
    # `git ls-remote --heads origin 'refs/heads/codex/full-ci/*'` ともに 0 件）。
    # branch 名を後から変えるのは PR 作成後に取りにくい選択肢で、これが
    # 使われなかった実務的な理由と考えられる。opt-in を手動 dispatch だけに
    # 頼った結果、main の失敗が誰にも見られず滞留する事故が起きたため
    # （2026-07-31、hard failure 3 件）、nightly を正規の起動経路に据える。
    #
    # main への push では実行しない (single-env 運用のため staging preflight は
    # 存在しない — 参照: docs/adr/0001-single-env-terraform.md)。
    #
    # **本番デプロイ直後の自動検証**は Cloud Run の /api/live probe に加え、
    # `deploy-production.yml` の `post-deploy-smoke` が公開 `/` `/spaces` と
    # admin IAP を外から叩く。ここ (nightly E2E) はその代替ではない。
    # 読み方: docs/runbooks/post-deploy-verification.md
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_full_ci)
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18@sha256:1957b2ff3137e4ef7f3bc813e74fff50b1e1ffddc85c8b9d6f14ade972be8687
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun-deps

      - name: Setup Playwright browsers (chromium + webkit)
        uses: ./.github/actions/setup-playwright-chromium
        with:
          # webkit-*-mobile project (e2e/mobile/*.spec.ts) はこの job でのみ実行される。
          browsers: "chromium webkit"

      - name: Generate Prisma client
        run: bunx --bun prisma generate

      # migrate / seed はここでやらない。Playwright の webServer chain
      # (`playwright.config.ts`) が `test:db:migrate` → `bun prisma/seed.ts --dev` を
      # **毎回実行する**ので、先に流しても同じ DB を 2 度作り直すだけになる
      # (`prisma db seed` は引数なし = dev モードで、chain の `--dev` と同一経路)。
      # build は DB を要求しない (`generateStaticParams` は 0 件・静的 prelude は空。
      # 実測: 0 テーブルの空 DB に対して `build:skip-env:prepared` が exit 0)。

      # Turbopack build キャッシュ。設計と実測は build job の同名 step を見ること。
      # smoke-e2e と同じ variant（`NEXT_PUBLIC_ENABLE_E2E_LOGIN=1` +
      # `build:skip-env:prepared`）なので `nextjs-smoke-` キーを共有する。
      # main push の smoke が書いたエントリを nightly / dispatch が restore できる。
      - name: Cache Turbopack build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-smoke-${{ runner.os }}-${{ hashFiles('bun.lock', 'next.config.ts', 'package.json') }}

      - name: Build application
        run: bun run build:skip-env:prepared
        env:
          # NEXT_PUBLIC_* は build 時に static replace されるため build step で渡す。
          # E2E 専用 opt-in: DevLoginButton を production build でも表示し、
          # setup-customer が dev login ボタンをクリックできるようにする。
          # setup-admin は IAP-only のため、runtime env の ADMIN_TEST_IAP_EMAIL で
          # ローカル IAP identity を解決する（値は testUsers.admin と一致必須）。
          # production には絶対伝播させない（login bypass risk — single-env
          # 運用のため production = 唯一の非 CI 環境）。
          NEXT_PUBLIC_ENABLE_E2E_LOGIN: "1"
          SKIP_ENV_VALIDATION: "true"

      # `--fail-on-flaky-tests` は nightly / opt-in の広域 E2E にだけ付ける。
      # CI は retries を持つので、1 回目に落ちて 2 回目に通ったテストは緑になる。
      # それは required check（smoke-e2e）では正しい挙動 — merge を止めたくない。
      # だが広域 E2E は「壊れかけを見つける」ための夜間実行なので、隠れた flake を
      # 可視化する側に倒す。公式 CLI: "Fail if any test is flagged as flaky"。
      # required の smoke-e2e には**付けない**（付けると flake で merge が止まる）。
      - name: Run E2E tests (admin surface)
        run: bunx playwright test --fail-on-flaky-tests
        env:
          CI: true
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/admin
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          # webServer が next start で起動する際の runtime env。
          NEXT_PUBLIC_ENABLE_E2E_LOGIN: "1"
          APP_SURFACE: admin
          ADMIN_APP_URL: http://localhost:3000
          IAP_JWT_AUDIENCE: "/projects/123456789012/locations/asia-northeast1/services/myrrh-rental-space-admin"
          # e2e/fixtures/test-data.ts の testUsers.admin と一致させる（seed 上 SUPER_ADMIN）。
          # admin@example.com は seed 上 ADMIN で settings:manage / auditLog:read を持たず、
          # /admin/settings/{features,billing,integrations,system} と監査ログが
          # requireAdminPermission の redirect("/admin") に落ちる。
          ADMIN_TEST_IAP_EMAIL: "superadmin@example.com"
          # production build を `next start` で動かすため validateProductionEnv の
          # 要求 env を埋める（lhci-start.ts と同方針）。
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          SUPPRESSION_HASH_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          CRON_OIDC_AUDIENCE: "http://localhost:3000"
          CRON_SERVICE_ACCOUNT_EMAIL: "scheduler-ci@example.iam.gserviceaccount.com"
          R2_ACCOUNT_ID: "test-r2-account"
          R2_ACCESS_KEY_ID: "test-r2-access-key"
          R2_SECRET_ACCESS_KEY: "test-r2-secret-key-32-min-length!!"
          R2_BUCKET_NAME: "test-r2-bucket"
          R2_INQUIRIES_BUCKET_NAME: "test-r2-inquiries-bucket"
          R2_PUBLIC_URL: "https://example.com"
          RESEND_API_KEY: "re_test_placeholder_for_ci_e2e_only"
          STRIPE_SECRET_KEY: "sk_test_placeholder_for_ci_e2e_only"
          GOOGLE_CLIENT_ID: "test-google-client-id.apps.googleusercontent.com"
          GOOGLE_CLIENT_SECRET: "test-google-client-secret-for-ci-e2e"

      # `/` を踏む spec は admin surface では実行できない（proxy が `/admin` へ
      # リダイレクトする）。surface は webServer プロセス単位の env なので、
      # 1 回の playwright 実行では両立しない。**この step が無いと
      # `e2e/public/homepage.spec.ts` と `e2e/mobile/public-mobile.*.spec.ts` は
      # どの CI ジョブでも 1 test も走らない**（監査 F-16 の実害）。
      # 選ぶ project は公開 surface 専用の 3 つだけ。mutator の鎖 (`chromium-feature-modules*`)
      # は選ばれないので、reader との排他も不要。
      # 強制: __tests__/unit/architecture/e2e-surface-skip-has-runner.test.ts
      - name: Run E2E tests (public surface)
        run: bunx playwright test --fail-on-flaky-tests --project=chromium-public-root --project=chromium-mobile --project=webkit-mobile
        env:
          CI: true
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/public
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_ENABLE_E2E_LOGIN: "1"
          APP_SURFACE: public
          ADMIN_APP_URL: http://localhost:3000
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          SUPPRESSION_HASH_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          CRON_OIDC_AUDIENCE: "http://localhost:3000"
          CRON_SERVICE_ACCOUNT_EMAIL: "scheduler-ci@example.iam.gserviceaccount.com"
          R2_ACCOUNT_ID: "test-r2-account"
          R2_ACCESS_KEY_ID: "test-r2-access-key"
          R2_SECRET_ACCESS_KEY: "test-r2-secret-key-32-min-length!!"
          R2_BUCKET_NAME: "test-r2-bucket"
          R2_INQUIRIES_BUCKET_NAME: "test-r2-inquiries-bucket"
          R2_PUBLIC_URL: "https://example.com"
          RESEND_API_KEY: "re_test_placeholder_for_ci_e2e_only"
          STRIPE_SECRET_KEY: "sk_test_placeholder_for_ci_e2e_only"
          GOOGLE_CLIENT_ID: "test-google-client-id.apps.googleusercontent.com"
          GOOGLE_CLIENT_SECRET: "test-google-client-secret-for-ci-e2e"

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # lint-format / type-check には **needs を張らない**。理由は 2 つあり、
  # どちらも速度より先に正しさの問題。
  #
  # 1. `needs.lint-format.result == 'success'` を条件にすると、lint が落ちた PR で
  #    この job は **skip** される。GitHub 公式は「A job is skipped by a conditional →
  #    The job reports "Success"」と明記しており、required check の合格状態は
  #    `success` / `skipped` / `neutral`。つまり required の
  #    "Build (env validation)" が **一度もビルドせずに緑**になる。
  # 2. その条件を成立させるための `always()` が `cancel-in-progress` を無効にする。
  #    公式: cancel 時に running job の `if` は再評価され「`if: always()` would
  #    evaluate to true and the job continues to run」。実測（run 31343600498）では
  #    Unit Tests が cancelled になった後も build は 3m50 走り切っていた。
  #
  # 待ち時間の節約は PUBLIC リポジトリでは意味を持たない（標準 runner の minutes は
  # "free and unlimited"）。代償はクリティカルパス +5 分だった。
  build:
    name: Build (env validation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun-deps

      # ---------------------------------------------------------------------
      # Turbopack build キャッシュ（`.next/cache/turbopack`）。**ここが SSoT**。
      # smoke-e2e / bundle-size-diff の同名 step はこの説明を参照している。
      #
      # Next.js 16.3.0 で `turbopackFileSystemCacheForBuild` が dev/build とも
      # 既定 true になった。公式は「効かせるには `.next/cache` を build 間で
      # 保持する必要があり、CI では明示的な設定が要る。保持できないなら
      # 無駄な書き込みを避けるため無効化を推奨」と書いている。保持する側を取る。
      #
      # 実測（ローカル・`bun run build:skip-env`）:
      #
      # | 条件                        | 所要   |
      # | --------------------------- | ------ |
      # | cold（キャッシュ無し）      | 112.1s |
      # | warm（無変更）              |  31.9s |
      # | warm（ソース 3 ファイル変更）|  66.1s |
      #
      # キャッシュ実体は 723 MB。**出力が cold と変わらないことは対照実験で確認済み**
      # — warm↔cold のファイルサイズ多重集合の差は 198 行 / 63 バイトで、
      # cold↔cold（196 行 / 61 バイト）と同じ。差はチャンク名長の非決定性であって
      # キャッシュ由来の陳腐化ではない。
      #
      # **鍵にソースのハッシュを入れない。** 公式例は
      # `hashFiles('**.[jt]s','**.[jt]sx')` + restore-keys だが、それだと
      # コミットごとに ~300 MB の新エントリができる。当リポジトリの Actions
      # キャッシュは既に 10.01 GB / 113 件で上限に張り付いており、その速度で
      # 積むと bun-deps(883 MB) や playwright(364 MB) まで LRU で落ちる。
      # 依存と設定だけを鍵にして **variant ごと 1 エントリ**に固定する。
      # 完全一致のみ（restore-keys 無し）なので、hit した run は save もしない。
      #
      # 代償はソース drift。上表のとおり drift しても cold より 41% 速い。
      # drift が効かなくなったら、そのときに鍵へ回転要素を足す判断をする。
      #
      # **キャッシュはブランチにスコープされる。** PR run が作ったものは main の run
      # から見えない。この設定を触った PR は「PR run は miss（cold + save）→ merge 後の
      # main run も miss → 3 本目でようやく hit」の順になるので、**最初の run が速く
      # ないことを効果の否定と読まない。** warm を測るなら
      # `gh workflow run ci.yml --ref main`（dispatch は push と別 concurrency group
      # なので互いに cancel しない）。ただし dispatch は build job を回さない
      # （下の `if:` が pull_request と main push だけ）。
      # ---------------------------------------------------------------------
      - name: Cache Turbopack build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-envcheck-${{ runner.os }}-${{ hashFiles('bun.lock', 'next.config.ts', 'package.json') }}

      - name: Build with env validation
        run: bun run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/test_db
          BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789ab
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x0000000000000000000000000000000AA
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-XXXXXXXXXX
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SUPPRESSION_HASH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          CRON_OIDC_AUDIENCE: http://localhost:3000
          CRON_SERVICE_ACCOUNT_EMAIL: scheduler-ci@example.iam.gserviceaccount.com
          RESEND_API_KEY: re_test_placeholder_for_ci_strict_build_only
          STRIPE_SECRET_KEY: sk_test_placeholder_for_ci_strict_build_only
          GOOGLE_CLIENT_ID: test-google-client-id.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: test-google-client-secret-for-ci-strict-build

  bundle-size-diff:
    name: Bundle Size Diff (PR comment)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PR のみ実行（base vs head の gzipped size 差分を sticky comment）。
    #
    # build job と同じ理由で lint-format / type-check には needs を張らない。
    # ここは required check ですらないのに、`always()` のせいで cancel が効かず
    # 実測（run 31343600498）で **superseded 済みの commit に 8m01 かけて
    # sticky comment を投稿**していた。PR に古い数字が残る原因そのもの。
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # preactjs/compressed-size-action は内部で `bun install --frozen-lockfile`
      # （= `bun ci` の同義 alias、Bun 公式 docs）を呼ぶため、先に Bun を PATH
      # に通し、Bun package cache を復元する。
      # （未設定だと "Unable to locate executable file: bun" で fail）
      # compressed-size-action は比較中に worktree を切り替えるため、post step を持つ
      # local composite action を前段に置かない。local action は action.yml が残っている
      # checkout 上で post cleanup される必要がある。
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-deps-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      # Turbopack build キャッシュ。設計と実測は build job の同名 step を見ること。
      # この job は base と head で 2 回ビルドするので、1 run 内でも 2 回効く。
      - name: Cache Turbopack build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-sizediff-${{ runner.os }}-${{ hashFiles('bun.lock', 'next.config.ts', 'package.json') }}

      # preactjs/compressed-size-action:
      # base と head で build を実行し、指定 pattern のファイルサイズを gzip で比較
      # 参照: https://github.com/preactjs/compressed-size-action
      # SHA 直 pin（公式 security best practice。tag force-push 攻撃対策）
      #
      # **末尾コメントのタグ名に `v` を付けない。** この action のバージョンタグは
      # `2.10.0` 形式で、`v2.10.0` は存在しない（`v` 付きは `v1` / `v2` の移動タグのみ）。
      # Renovate は末尾コメントを現在版として読むため、実在しないタグを書くと
      # `Could not determine new digest for update` で lookup が落ち、この action だけ
      # 更新対象から永久に外れる（2026-08-11、Renovate 有効化直後に実際に発生）。
      - name: Compressed size diff
        uses: preactjs/compressed-size-action@f322c295dde06a1cb7ccaef105732dd8a726d1d9 # 2.10.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          build-script: "build:skip-env"
          pattern: ".next/static/**/*.{js,css}"
          exclude: "{**/*.map,**/node_modules/**}"
          # 1KB 以下の増減は警告しない（noise 削減）
          minimum-change-threshold: 1024

  bundle-analysis:
    name: Bundle Analysis (Turbopack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-format, type-check]
    # main push のみ実行（PR は bundle-size-diff で代替、build 重複回避）。
    # PR の bundle 影響可視化は bundle-size-diff の sticky comment で十分、
    # archived analysis は historical trend 用のため main のみで artifact 保管。
    if: |
      always() && needs.lint-format.result == 'success' && needs.type-check.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun-deps

      # Next.js 16 公式の Turbopack-native bundle analyzer
      # 結果は .next/diagnostics/analyze に出力される
      - name: Run bundle analyzer
        run: bun run analyze
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Upload bundle analysis artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bundle-analysis-${{ github.event.pull_request.number || github.sha }}
          path: .next/diagnostics/analyze/
          retention-days: 30

  lighthouse-ci:
    name: Lighthouse CI (perf / a11y / SEO)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-format, type-check]
    # Lighthouse は重い。single-env 運用 (docs/adr/0001-single-env-terraform.md)
    # のため staging URL は存在せず、CI 内 next start (localhost:3000) で測る。
    # required check にはしない。起動は nightly schedule と
    # workflow_dispatch (run_full_ci=true)。
    if: |
      always() && needs.lint-format.result == 'success' && needs.type-check.result == 'success' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.run_full_ci))
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18@sha256:1957b2ff3137e4ef7f3bc813e74fff50b1e1ffddc85c8b9d6f14ade972be8687
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun-deps

      - name: Generate Prisma client
        run: bunx --bun prisma generate

      # この 2 step が要るのは **Lighthouse job だけ**。lhci は
      # `scripts/lhci-start.ts` (`next start` + readiness poll のみ) でサーバーを
      # 起動し、Playwright の webServer chain を通らないため、DB の準備はここでしか
      # 行われない。E2E / smoke / visual の 3 job では chain が同じことをするので
      # 置いていない。
      - name: Run database migrations
        run: bunx --bun prisma migrate deploy

      - name: Seed test database
        run: bunx --bun prisma db seed

      # build は LHCI の startServerReadyPattern 監視窓の外に置く。
      # scripts/lhci-start.ts は next start と readiness poll のみを担当する
      # （build 出力が ready 判定に混ざる構造を排除）。

      # Turbopack build キャッシュ。設計と実測は build job の同名 step を見ること。
      # E2E_LOGIN 無しの `build:skip-env:prepared` なので smoke とは別 variant。
      # visual-regression と同じ `nextjs-start-` キーを共有する。
      - name: Cache Turbopack build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-start-${{ runner.os }}-${{ hashFiles('bun.lock', 'next.config.ts', 'package.json') }}

      - name: Build application
        run: bun run build:skip-env:prepared
        env:
          SKIP_ENV_VALIDATION: "true"

      # Lighthouse CI autorun: .lighthouserc.json 設定に従い
      # collect → assert → upload (temporary-public-storage) を一括実行。
      # runtime env は scripts/lhci-start.ts が SSoT として供給する
      # （validateProductionEnv との drift は lighthouse-ci-env.test.ts が防ぐ）。
      - name: Run Lighthouse CI
        run: bunx lhci autorun --config=.lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lighthouse-report-${{ github.event.pull_request.number || github.sha }}
          path: .lighthouseci/
          retention-days: 30

  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 実行条件:
    # - **nightly の schedule**（main、18:00 UTC = 03:00 JST）
    # - workflow_dispatch で run_full_ci=true 指定（baseline 比較）
    # - workflow_dispatch で update_visual_baseline=true 指定（baseline 再生成 + auto-PR）
    #
    # 手動 dispatch だけに頼っていた間、この job は **8 日間 1 度も走っていなかった**
    # （最後の dispatch は 2026-08-01、baseline の最終生成は 07-31）。その間の公開ページ
    # 変更は視覚回帰が一度も検証されず、8 日ぶりに回したら locator の strict mode
    # violation でスナップショットを 1 枚も撮れない状態になっていた（PR #2060）。
    # e2e-tests を nightly に入れたのと同じ理由で schedule を正規の起動経路に据える。
    #
    # baseline regeneration は意図的な workflow_dispatch でのみ実行する（自動
    # regeneration は破壊的変更時に baseline を silent 上書きする risk のため）。
    # schedule では `inputs.update_visual_baseline` が空文字なので比較モードになる。
    # 再生成 baseline は main へ直接 push せず別 branch + auto-PR を作成し、
    # branch protection の required status checks を通過させてから merge する。
    permissions:
      contents: write # auto-PR 用 branch push
      pull-requests: write # auto-PR 作成
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.run_full_ci || inputs.update_visual_baseline))
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18@sha256:1957b2ff3137e4ef7f3bc813e74fff50b1e1ffddc85c8b9d6f14ade972be8687
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun-deps

      - name: Setup Playwright Chromium
        uses: ./.github/actions/setup-playwright-chromium

      - name: Generate Prisma client
        run: bunx --bun prisma generate

      # migrate / seed はここでやらない。Playwright の webServer chain
      # (`playwright.config.ts`) が `test:db:migrate` → `bun prisma/seed.ts --dev` を
      # **毎回実行する**ので、先に流しても同じ DB を 2 度作り直すだけになる
      # (`prisma db seed` は引数なし = dev モードで、chain の `--dev` と同一経路)。
      # build は DB を要求しない (`generateStaticParams` は 0 件・静的 prelude は空。
      # 実測: 0 テーブルの空 DB に対して `build:skip-env:prepared` が exit 0)。

      # Turbopack build キャッシュ。設計と実測は build job の同名 step を見ること。
      # E2E_LOGIN 無しの `build:skip-env:prepared` なので smoke とは別 variant。
      # lighthouse-ci と同じ `nextjs-start-` キーを共有する。
      - name: Cache Turbopack build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-start-${{ runner.os }}-${{ hashFiles('bun.lock', 'next.config.ts', 'package.json') }}

      - name: Build application
        run: bun run build:skip-env:prepared
        env:
          SKIP_ENV_VALIDATION: "true"

      # Playwright 公式の visual regression:
      # - baseline が存在すれば diff 検証
      # - update_visual_baseline=true で --update-snapshots を渡して baseline を再生成
      #   （CI Ubuntu runner と本番の font rendering が一致するため CI 上で baseline 生成が canonical）
      - name: Run visual regression tests
        run: |
          if [ "${{ inputs.update_visual_baseline }}" = "true" ]; then
            bunx playwright test --project=chromium-visual --update-snapshots
          else
            bunx playwright test --project=chromium-visual
          fi
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_VISUAL: "1"
          APP_SURFACE: public
          ADMIN_APP_URL: http://localhost:3000
          # production build を `next start` で動かすため validateProductionEnv の
          # 要求 env を埋める（webServer は playwright.config.ts の分岐により CI で next start）。
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          SUPPRESSION_HASH_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          CRON_OIDC_AUDIENCE: "http://localhost:3000"
          CRON_SERVICE_ACCOUNT_EMAIL: "scheduler-ci@example.iam.gserviceaccount.com"
          R2_ACCOUNT_ID: "test-r2-account"
          R2_ACCESS_KEY_ID: "test-r2-access-key"
          R2_SECRET_ACCESS_KEY: "test-r2-secret-key-32-min-length!!"
          R2_BUCKET_NAME: "test-r2-bucket"
          R2_INQUIRIES_BUCKET_NAME: "test-r2-inquiries-bucket"
          R2_PUBLIC_URL: "https://example.com"
          RESEND_API_KEY: "re_test_placeholder_for_ci_visual_only"
          STRIPE_SECRET_KEY: "sk_test_placeholder_for_ci_visual_only"
          GOOGLE_CLIENT_ID: "test-google-client-id.apps.googleusercontent.com"
          GOOGLE_CLIENT_SECRET: "test-google-client-secret-for-ci-visual"

      - name: Upload Playwright visual diff report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-visual-report-${{ github.event.pull_request.number || github.sha }}
          path: |
            playwright-report/
            e2e/visual/**/*-snapshots/
          retention-days: 30

      # baseline 再生成成功時、生成された snapshot を別 branch にステージし PR を作成する。
      # Branch protection の required status checks を通過させてから main に merge
      # することで「未検証 baseline の silent 上書き」を防ぐ。
      - name: Stage regenerated visual baseline
        if: github.event_name == 'workflow_dispatch' && inputs.update_visual_baseline && success()
        id: stage-baseline
        shell: bash
        run: |
          shopt -s globstar nullglob
          # bash globstar で **/*-snapshots/ をディレクトリ展開（null glob で 0 件でも fail しない）
          baseline_dirs=(e2e/visual/**/*-snapshots/)
          if [ ${#baseline_dirs[@]} -eq 0 ]; then
            echo "[visual baseline] no -snapshots/ directories found"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # git add 対象を明示。peter-evans/create-pull-request が diff 検出 + commit + push を担当
          git add "${baseline_dirs[@]}"
          if git diff --cached --quiet; then
            echo "[visual baseline] no changes to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "[visual baseline] changes detected, will create PR"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR for regenerated baseline
        if: steps.stage-baseline.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ci/visual-baseline-${{ github.run_id }}
          base: ${{ github.ref_name }}
          commit-message: "ci(visual): regenerate visual baseline (run ${{ github.run_id }})"
          title: "ci(visual): regenerate visual baseline"
          body: |
            ## Visual baseline regeneration

            **Trigger**: workflow_dispatch (`update_visual_baseline=true`)
            **Actor**: @${{ github.actor }}
            **Run**: [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **Base branch**: `${{ github.ref_name }}`

            > [!WARNING]
            > **この PR には required status checks が付きません。**
            > `GITHUB_TOKEN` で作成された PR は GitHub の再帰防止により `pull_request`
            > workflow を起動しないため、CodeQL 以外が未実行のまま BLOCKED になります。
            > close → reopen するか、同 branch の内容で人間名義の PR を作り直してください。

            ## Review checklist

            - [ ] `e2e/visual/**/*-snapshots/` の diff が **意図したデザイン変更** に対応している
            - [ ] CI Ubuntu runner の font rendering 起因の noise diff ではない
            - [ ] Required status checks 全て green
            - [ ] 関連する production code 変更が main に merge 済み（baseline 先行は禁止）

            ## Auto-generated note

            この PR は CI が自動生成しました。Playwright `--update-snapshots` で再生成された baseline を
            branch protection の required status checks 経由で merge するため、main に直接 push せず PR 化しています。

            Generated with [peter-evans/create-pull-request](https://github.com/peter-evans/create-pull-request).
          labels: |
            visual-baseline
            automated
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          delete-branch: true

  docs:
    name: Generate API Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-format, type-check]
    if: |
      always() && needs.lint-format.result == 'success' && needs.type-check.result == 'success' &&
      github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun-deps

      - name: Generate API documentation
        run: bun run docs

      - name: Upload API docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-docs
          path: .typedoc/api/
          retention-days: 90

  # nightly (schedule) の結果を **人が見える場所へ出す** 唯一の経路。
  #
  # nightly を入れた理由は「main の失敗が誰にも見られず滞留する事故」の防止だった
  # のに、失敗しても通知が無いため nightly 自体が 8/1〜8/7 の 7 連続で赤のまま
  # 誰にも見られていなかった。PR が無いので `gh pr list` にも出ず、Actions の
  # 一覧を能動的に見に行くまで気付けない。
  #
  # 失敗したら Issue を立て（既に開いていればコメントを足し）、復旧したら同じ
  # Issue に復旧を記録して閉じる。**自己解消する**ので、開いている Issue の存在
  # そのものが「いま nightly が赤」を意味する。
  nightly-result:
    name: Nightly result notice
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      [
        migration-safety,
        dependency-audit,
        lint-format,
        type-check,
        unit-tests,
        smoke-e2e,
        e2e-tests,
        visual-regression,
        lighthouse-ci,
        build,
      ]
    if: ${{ always() && github.event_name == 'schedule' }}
    permissions:
      contents: read
      issues: write
    steps:
      # ローカル action (`uses: ./…`) を使うため checkout が要る。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide nightly status
        id: status
        env:
          # 式展開を run に直接埋めない（script injection 対策・公式 hardening）。
          # 値は全て env 経由で受け取る。
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # **「failure でない = 緑」ではない。** `needs.<job>.result` は failure 以外にも
          # cancelled を取る。timeout で打ち切られた job や、実行中に停止された job は
          # cancelled になるので、`== "failure"` だけを見ると一番知りたい失敗を緑と読む。
          #
          # 判定は「success でも skipped でもないものは失敗」と裏返す。値の名前を
          # 列挙しないので、将来 result に新しい値が増えても取りこぼさない。
          #
          # `skipped` の明示除外は必須。schedule では build が skip される
          # （build の if は pull_request / push-main 限定）。除外を外すと nightly が
          # 毎晩赤になる。
          failed=$(printf '%s' "$NEEDS_JSON" \
            | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')

          if [ -z "$failed" ]; then
            # 空文字 = 緑。status-notice はこれを見て Issue を閉じる。
            echo "report=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 複数行を step output で渡す公式の書き方（delimiter 付き heredoc）。
          {
            echo "report<<__NOTICE_EOF__"
            printf '%s\n' \
              "nightly (schedule) が失敗しました。" \
              "" \
              "- run: $RUN_URL" \
              "- commit: \`$COMMIT_SHA\`" \
              "- 失敗した job: $failed"
            echo "__NOTICE_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Notify nightly status
        uses: ./.github/actions/status-notice
        with:
          title: Nightly CI failure
          marker: "<!-- nightly-ci-status: do not remove (owned by ci.yml / nightly-result) -->"
          report: ${{ steps.status.outputs.report }}
          recovered-message: nightly が復旧しました（${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}）。
          github-token: ${{ secrets.GITHUB_TOKEN }}
