name: Terraform Drift Detection

# 毎晩 (JST 03:00 / UTC 18:00) main branch の Terraform config と live GCP resource の
# drift を検知する。F1 structural closure (bootstrap-owns-all-project-IAM) は
# "attacker が runner 経由で IAM 付与" を防ぐが、"owner が Console/gcloud で
# 手動変更" 後の drift を <24h に短縮する監視穴を補完する belt-and-suspenders。
#
# 段階 1-4 unblock saga (PR #1075/1076/1078/1079/1081) では 44 pre-existing GCP
# resource が state と不整合な状態で apply が 409/403 で連続 fail してから
# 判明した — この blind spot を毎晩の read-only plan で自動検知に変える。
#
# Read-only 契約:
#   - `-lock=false` で state file lock を取らない (apply run と race しない)
#   - `-detailed-exitcode` で 0=no diff / 1=error / 2=diff の 3 状態を捕捉
#   - apply は絶対に呼ばない (drift 発生時は Issue に留め、人間が原因調査)
#
# False-positive 対策:
#   - Console-mandatory 操作 (IAP OAuth client rotation / IAP admin group
#     membership 変更 / Cloud Run revision deploy) は terraform config 側で
#     `lifecycle { ignore_changes = [...] }` で吸収済 → plan diff に出ない
#   - 実 diff が出るなら真の drift として Issue 化する
#
# 通知:
#   - GITHUB_STEP_SUMMARY に diff 全文を貼る (Actions run 画面で即読める)
#   - drift.txt (text) のみ artifact 化 (30d retention)。binary plan は
#     sensitive 値を平文で持つため artifact に載せない (下の plan step 参照)
#   - drift の有無は `drift-result` job が Issue 1 本で追跡する。開いていれば
#     「いま drift がある (または drift 検知が壊れている)」、閉じていれば緑。

on:
  schedule:
    # UTC 18:00 = JST 03:00 (深夜帯で他 workflow と競合しない)。GitHub Actions の
    # scheduled event は runner queue 状況次第で数分〜数十分遅延する仕様なので
    # SLA critical な time window に置かない。
    - cron: "0 18 * * *"
  workflow_dispatch:

# id-token: WIF impersonation (terraform-runner SA) — read-only plan のみ
# contents: read: checkout
#
# `issues: write` は通知を持つ `drift-result` job 側だけに置く。plan を走らせる
# job に Issue 書き込み権限を渡さない。
permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: 1.16.0
  TF_WORKING_DIR: terraform
  TF_IN_AUTOMATION: "1"

# 並行実行を抑止 (state file への lock は取らないが cost/log 見通しのため)。
concurrency:
  group: terraform-drift-detection
  cancel-in-progress: false

jobs:
  drift-detect:
    name: Terraform drift detection
    # fork / 手動転送された repository の scheduled trigger 誤発火を防ぐガード
    # (deploy-production.yml と同一 pattern)。
    if: github.repository == 'y2ikgm89/myrrh-rental-space'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 判定材料を後段の `drift-result` job へ渡す。job が途中で落ちた場合は空に
    # なるが、その run は `needs.drift-detect.result` 側で赤と判定される。
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
      changes: ${{ steps.render.outputs.changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # WIF auth は terraform-apply job と同一契約 (terraform-runner SA)。
      # runner は F1 refactor で project-level IAM 権限を絞られている
      # (SA create / cross-SA impersonation grant 不可) が、`terraform plan` は
      # provider API の read 呼び出しのみで実 mutation を伴わないため
      # 現行 role set (run.admin / iap.admin / etc.) で十分。
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/626108938746/locations/global/workloadIdentityPools/github-actions/providers/github-myrrh-rental-space
          service_account: terraform-runner@myrrh-rental-space.iam.gserviceaccount.com
          project_id: myrrh-rental-space

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # -lock-timeout=5m: GCS backend の conditional-write lock は通常瞬時に
      # 取れるが、apply run と時間帯が万一衝突しても 5min 待つことで transient
      # 競合を吸収する (それでも取れなければ error → drift 判定は次夜に持ち越し)。
      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false -lock-timeout=5m
        env:
          # Cloudflare provider v5 は `CLOUDFLARE_API_TOKEN` env var を自動採用
          # (terraform/cloudflare_provider.tf 参照)。drift 検知の read-only
          # plan は Cloudflare API を叩くため必須。
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TERRAFORM_API_TOKEN }}

      # -detailed-exitcode: 0=no changes / 1=error / 2=changes present
      # -lock=false: state file lock を取らない (read-only plan、apply と race しない)
      # -out=drift.plan: 後段の `terraform show` で text 化するための一時保存。
      #   **artifact には載せない。** binary plan は sensitive 値を平文で保持する
      #   (terraform plan の公式仕様。
      #   https://developer.hashicorp.com/terraform/cli/commands/plan の `-out` 節が
      #   "will be saved in cleartext in the plan file" と明記)。この job は
      #   `TF_VAR_cloudflare_origin_header_secret` を渡しているため、載せると
      #   本番共有 secret が public repo の artifact から取得可能になる。
      #   機械強制: __tests__/unit/architecture/deploy-plan-artifact-no-binary.test.ts
      - name: Terraform plan (drift detection)
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        env:
          # Cloudflare provider v5 は `CLOUDFLARE_API_TOKEN` env var を自動採用
          # (terraform/cloudflare_provider.tf 参照)。plan は Cloudflare zone
          # state を read するため必須。read-only なので mutation は起きない。
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TERRAFORM_API_TOKEN }}
          # cloudflare_ruleset.transform_rules_late で参照される sensitive var。
          # plan は value を state と比較するため必須 (未設定だと variable validation
          # error で plan abort)。drift 検知の base として GH Secret 側 value と
          # Cloudflare API 現行 value が一致することを毎夜確認する意味も持つ。
          TF_VAR_cloudflare_origin_header_secret: ${{ secrets.CLOUDFLARE_ORIGIN_HEADER_SECRET_TF }}
          TF_VAR_monitoring_alert_email: ${{ secrets.MONITORING_ALERT_EMAIL_TF }}
        run: |
          set +e
          terraform plan -detailed-exitcode -lock=false -no-color -out=drift.plan
          EXITCODE=$?
          set -e
          if [ "$EXITCODE" -eq 1 ]; then
            echo "::error::terraform plan failed" >&2
            exit 1
          fi
          echo "exitcode=$EXITCODE" >> "$GITHUB_OUTPUT"
          if [ "$EXITCODE" -eq 2 ]; then
            echo "Drift detected (exit 2) — will emit issue"
          else
            echo "No drift (exit 0)"
          fi

      - name: Render plan to text
        id: render
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          terraform show -no-color drift.plan > drift.txt
          # "Plan: N to add, M to change, K to destroy." を Issue 本文用に取り出す。
          # drift 無し (exit 0) の run ではこの行が出ないので空になる。
          #
          # `grep -m1` を使い**パイプを挟まない**。`grep | head -n 1` は
          # pipefail 下で SIGPIPE (rc=141) を拾いうる。
          changes="$(grep -m1 -E '^Plan:' drift.txt || true)"
          echo "changes=${changes}" >> "$GITHUB_OUTPUT"

      - name: Upload drift artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-drift-${{ github.run_id }}
          # binary plan (`terraform/drift.plan`) は sensitive 値を平文で持つので
          # 載せない。追加すると deploy-plan-artifact-no-binary gate が落ちる。
          path: terraform/drift.txt
          retention-days: 30
          if-no-files-found: error

      - name: Append drift to job summary
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        run: |
          {
            echo "## Terraform drift detection"
            echo ""
            echo "- Run: \`${GITHUB_RUN_ID}\` (\`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`)"
            echo "- Plan exit code: \`${{ steps.plan.outputs.exitcode }}\` (0=no drift, 2=drift detected)"
            echo "- Artifact: \`terraform-drift-${GITHUB_RUN_ID}\` (retention 30d)"
            echo ""
            echo '```hcl'
            cat drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # drift の状態を **人が見える場所へ出す** 唯一の経路。
  #
  # 旧実装は `drift-detect` job 内の `Open drift issue` step で、`exit 2` の
  # ときに Issue を開くだけだった。そのため:
  #
  #   - 閉じる経路が無いので、drift が解消しても Issue が残る。
  #   - title が `[drift] YYYY-MM-DD ...` と日付入りで重複抑止も無いため、
  #     drift が続けば**毎晩 1 件ずつ増える**。
  #   - `drift-detect` job 自体の失敗 (plan error / 認証切れ) は
  #     `steps.plan.outputs.exitcode == '2'` に一致しないので **完全に無通知**
  #     だった。drift の有無が分からない状態こそ知りたいのに黙っていた。
  #
  # deploy-production.yml の `deploy-result` / ci.yml の `post-merge-result` と
  # 同じ形にする。**自己解消する**ので、開いている Issue の存在そのものが
  # 「いま drift がある、または drift 検知が壊れている」を意味する。
  #
  # 本文に plan 全文を貼らない。1 晩 1 Issue から「1 本の Issue にコメント追記」
  # へ変わったので、毎晩 55,000 字を積むと読めなくなる。diff 全文は run の
  # Summary tab と artifact にあるので、そこへリンクする。
  #
  # 強制: `__tests__/unit/architecture/status-notifier-self-resolves.test.ts`
  drift-result:
    name: Drift result notice
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [drift-detect]
    # `always()` が無いと **drift の無い run で job ごと skip され、閉じる経路が
    # 消える**。repository ガードは drift-detect と同一にする。ここだけ緩めると
    # fork 側の scheduled 誤発火で前段が skipped になり、それを「緑」と読んで
    # 開いている Issue を閉じてしまう。
    if: ${{ always() && github.repository == 'y2ikgm89/myrrh-rental-space' }}
    permissions:
      contents: read
      issues: write
    steps:
      # ローカル action (`uses: ./…`) を使うため checkout が要る。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide drift status
        id: status
        env:
          # 式展開を run に直接埋めない（script injection 対策・公式 hardening）。
          # 値は全て env 経由で受け取る。
          NEEDS_JSON: ${{ toJSON(needs) }}
          PLAN_EXITCODE: ${{ needs.drift-detect.outputs.exitcode }}
          PLAN_CHANGES: ${{ needs.drift-detect.outputs.changes }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          # 赤は 2 種類ある。どちらも「いま緑ではない」ので同じ Issue で追跡する。
          #
          #   1. drift 検知そのものが失敗した — drift の有無が **分からない**
          #   2. plan が exit 2 を返した — drift が **ある**
          #
          # 1 の判定は「success でも skipped でもないものは失敗」と裏返す。
          # `== "failure"` だけを見ると、timeout で打ち切られた job (cancelled) を
          # 緑と読んでしまう。
          broken=$(printf '%s' "$NEEDS_JSON" \
            | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')

          if [ -n "$broken" ]; then
            {
              echo "report<<__NOTICE_EOF__"
              printf '%s\n' \
                "**drift 検知そのものが失敗しました。** drift があるかどうかは分かりません。" \
                "" \
                "- run: $RUN_URL" \
                "- 失敗した job: $broken" \
                "" \
                "run の log で原因を特定してください（plan error / WIF 認証 / provider API のいずれか）。" \
                "次に drift 無しで完走した run が本 Issue を自動で閉じます。"
              echo "__NOTICE_EOF__"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$PLAN_EXITCODE" = "2" ]; then
            {
              echo "report<<__NOTICE_EOF__"
              printf '%s\n' \
                "**Terraform drift を検知しました。**" \
                "" \
                "- ${PLAN_CHANGES:-Plan: (件数を drift.txt から読み取れませんでした)}" \
                "- run: $RUN_URL — Summary tab に diff 全文があります" \
                "- artifact: \`terraform-drift-$RUN_ID\`（30d retention / \`drift.txt\`）" \
                "" \
                "1. Summary tab か artifact の \`drift.txt\` で差分を確認する" \
                "2. Console / gcloud での正当な変更が Terraform 側に無いなら、module へ足す PR を出す" \
                "3. 意図しない変更なら Console / gcloud で戻すか、次の apply で上書きする" \
                "" \
                "次に drift の無い run が本 Issue を自動で閉じます（手で閉じる必要はありません）。"
              echo "__NOTICE_EOF__"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 空文字 = 緑。status-notice はこれを見て Issue を閉じる。
          echo "report=" >> "$GITHUB_OUTPUT"

      - name: Notify drift status
        uses: ./.github/actions/status-notice
        with:
          # **title に日付や run id を混ぜてはならない。** 混ぜると解消 run が
          # 別 title になり既存 Issue へ辿り着けず、増える一方になる。
          #
          # 赤 2 種類を 1 本の Issue で追跡するので、title は両方を覆う文言に
          # する。どちらの赤かは本文の 1 行目が書き分ける。
          title: Terraform drift check is not green
          marker: "<!-- terraform-drift-status: do not remove (owned by terraform-drift.yml / drift-result) -->"
          report: ${{ steps.status.outputs.report }}
          recovered-message: Terraform drift が解消しました（${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}）。
          label: drift-detection
          label-description: Terraform state drift (self-resolving; owned by drift-result)
          github-token: ${{ secrets.GITHUB_TOKEN }}
