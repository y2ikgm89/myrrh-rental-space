name: Setup Bun dependencies
description: Set up Bun, restore the Bun package cache, and optionally run the CI install.

inputs:
  install:
    description: Run the repository CI install script after restoring the cache.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json

    - name: Cache Bun dependencies
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.bun/install/cache
        key: bun-deps-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          bun-deps-${{ runner.os }}-

    - name: Install dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: sh scripts/bun-ci-install.sh
