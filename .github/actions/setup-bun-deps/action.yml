name: Setup Bun dependencies
description: Set up Bun, restore the Bun package cache, and optionally run the CI install.

inputs:
  install:
    description: Run the repository CI install script after restoring the cache.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json

    # `next` の bin は `#!/usr/bin/env node` なので、build は runner image に載っている
    # Node で走らせないと「CI で緑になった build」と「出荷される build」が別メジャーになる。
    # ubuntu-latest の既定は **22.23.1**、本番 runner は Dockerfile の `node:24-alpine`。
    # ピンを外すと GitHub の runner image 更新で CI 側が黙ってまた別メジャーになる。
    #
    # 1 度目の導入（PR #2189）は Lint & Format を落として revert した。原因は
    # Node 22 → 24 ではなく **eslint の並列度が CI の実メモリすれすれだったこと**で、
    # `--concurrency 2` へ下げて解消済み（PR #2198。実測 264s / 従来 ~300s）。
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24"

    - name: Cache Bun dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-deps-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          bun-deps-${{ runner.os }}-

    - name: Install dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: sh scripts/bun-ci-install.sh
