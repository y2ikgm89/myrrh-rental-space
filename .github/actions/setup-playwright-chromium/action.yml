name: Setup Playwright Browsers
description: Restore cached Playwright browsers and install required system dependencies.

inputs:
  browsers:
    description: >-
      Space-separated `playwright install` browser names. Default is chromium
      only (smoke-e2e / visual-regression の required check を軽量に保つため)。
      webkit-*-mobile project (e2e/mobile/*) を実行する job は "chromium webkit"
      を明示的に渡す (2026-07-31: webkit-mobile project 追加から未実行のまま
      放置されていた設定不備の修正、Phase G 監査)。
    required: false
    default: "chromium"

runs:
  using: composite
  steps:
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        # browsers を key に含める: 既存 (chromium のみ) キャッシュへの誤ヒットで
        # webkit のインストールが恒久的に skip されるのを防ぐ。
        key: playwright-${{ inputs.browsers }}-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          playwright-${{ inputs.browsers }}-${{ runner.os }}-

    - name: Remove stale Microsoft apt repo
      shell: bash
      run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true

    - name: Install Playwright browsers
      if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: bunx playwright install ${{ inputs.browsers }} --with-deps

    - name: Install Playwright system deps
      if: ${{ steps.playwright-cache.outputs.cache-hit == 'true' }}
      shell: bash
      run: bunx playwright install-deps ${{ inputs.browsers }}
