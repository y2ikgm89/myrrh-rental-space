name: Setup Playwright Chromium
description: Restore cached Playwright Chromium browsers and install required system dependencies.

runs:
  using: composite
  steps:
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Remove stale Microsoft apt repo
      shell: bash
      run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true

    - name: Install Playwright browsers
      if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: bunx playwright install chromium --with-deps

    - name: Install Playwright system deps
      if: ${{ steps.playwright-cache.outputs.cache-hit == 'true' }}
      shell: bash
      run: bunx playwright install-deps chromium
