# Cloud Build: Artifact Registry + Cloud Run deploy
#
# Usage:
#   gcloud builds submit --config=cloudbuild.yaml
#
# Required secrets (Secret Manager):
#   DATABASE_URL, BETTER_AUTH_SECRET, ENCRYPTION_KEY, CRON_SECRET, ADMIN_LOGIN_TOKEN

substitutions:
  _REGION: asia-northeast1
  _SERVICE_NAME: myrrh-rental-space
  _REPOSITORY: myrrh-rental-space
  _AR_HOST: asia-northeast1-docker.pkg.dev
  _MEMORY: 1Gi
  _CPU: '1'
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '10'
  _CONCURRENCY: '80'
  _TIMEOUT: '300'
  # Secret versions (固定バージョン推奨)
  _DATABASE_URL_SECRET_VERSION: '1'
  _BETTER_AUTH_SECRET_VERSION: '1'
  _ENCRYPTION_KEY_SECRET_VERSION: '1'
  _CRON_SECRET_VERSION: '1'
  _ADMIN_LOGIN_TOKEN_SECRET_VERSION: '1'
  # NEXT_PUBLIC_* (ビルド時インライン + ランタイム両方で使用)
  _NEXT_PUBLIC_BASE_URL: ''
  _NEXT_PUBLIC_APP_URL: ''
  _NEXT_PUBLIC_SUPABASE_URL: ''
  _NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
  _NEXT_PUBLIC_TURNSTILE_SITE_KEY: ''
  _NEXT_PUBLIC_GA_MEASUREMENT_ID: ''
  # Server-only env vars
  _BETTER_AUTH_URL: ''

options:
  logging: CLOUD_LOGGING_ONLY
  env:
    - DOCKER_BUILDKIT=1

steps:
  # Step 1: Pull cache image (fail-safe)
  - name: gcr.io/cloud-builders/docker
    id: pull-cache
    entrypoint: bash
    args:
      - -c
      - docker pull ${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:cache || true

  # Step 2: Build image (validate + build inside Docker, deps installed once)
  - name: gcr.io/cloud-builders/docker
    id: build-image
    waitFor: [pull-cache]
    args:
      - build
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --cache-from=${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:cache
      - --build-arg=NEXT_PUBLIC_BASE_URL=${_NEXT_PUBLIC_BASE_URL}
      - --build-arg=NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}
      - --build-arg=NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}
      - --build-arg=NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - --build-arg=NEXT_PUBLIC_TURNSTILE_SITE_KEY=${_NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      - --build-arg=NEXT_PUBLIC_GA_MEASUREMENT_ID=${_NEXT_PUBLIC_GA_MEASUREMENT_ID}
      - -t=${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}
      - -t=${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:cache
      - .

  # Step 3: Push all tags
  - name: gcr.io/cloud-builders/docker
    id: push-image
    waitFor: [build-image]
    args:
      - push
      - --all-tags
      - ${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}

  # Step 4: Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    waitFor: [push-image]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --platform=managed
      - --region=${_REGION}
      - --image=${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}
      - --allow-unauthenticated
      - --memory=${_MEMORY}
      - --cpu=${_CPU}
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --concurrency=${_CONCURRENCY}
      - --timeout=${_TIMEOUT}
      - --execution-environment=gen2
      - --cpu-boost
      - --update-env-vars=NODE_ENV=production,NEXT_TELEMETRY_DISABLED=1,NEXT_PUBLIC_BASE_URL=${_NEXT_PUBLIC_BASE_URL},NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL},NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL},NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY},NEXT_PUBLIC_TURNSTILE_SITE_KEY=${_NEXT_PUBLIC_TURNSTILE_SITE_KEY},NEXT_PUBLIC_GA_MEASUREMENT_ID=${_NEXT_PUBLIC_GA_MEASUREMENT_ID},BETTER_AUTH_URL=${_BETTER_AUTH_URL}
      - --update-secrets=DATABASE_URL=DATABASE_URL:${_DATABASE_URL_SECRET_VERSION},BETTER_AUTH_SECRET=BETTER_AUTH_SECRET:${_BETTER_AUTH_SECRET_VERSION},ENCRYPTION_KEY=ENCRYPTION_KEY:${_ENCRYPTION_KEY_SECRET_VERSION},CRON_SECRET=CRON_SECRET:${_CRON_SECRET_VERSION},ADMIN_LOGIN_TOKEN=ADMIN_LOGIN_TOKEN:${_ADMIN_LOGIN_TOKEN_SECRET_VERSION}

images:
  - ${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}
  - ${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:cache

timeout: 1800s
