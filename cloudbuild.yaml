# Cloud Build: Artifact Registry + Cloud Run deploy
#
# Usage:
#   gcloud builds submit --config=cloudbuild.yaml
#
# Required secrets (Secret Manager):
#   DATABASE_URL, BETTER_AUTH_SECRET, ENCRYPTION_KEY, CRON_SECRET, ADMIN_LOGIN_TOKEN
#   NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME, R2_PUBLIC_URL
#
# Required Cloud Run Job (created once per project):
#   prisma-migrate — `bunx prisma migrate deploy` を実行する独立 Job。
#   初回作成手順は docs/operations/deployment.md §8 を参照。

substitutions:
  _REGION: asia-northeast1
  _SERVICE_NAME: myrrh-rental-space
  _REPOSITORY: myrrh-rental-space
  _AR_HOST: asia-northeast1-docker.pkg.dev
  _MIGRATE_JOB_NAME: prisma-migrate
  _MEMORY: 1Gi
  _CPU: "1"
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "1"
  _CONCURRENCY: "80"
  _TIMEOUT: "300"
  _DATABASE_POOL_MAX: "10"
  # Dedicated service account email (Cloud Run runtime + Prisma migrate Job 共通)
  # 作成手順: docs/operations/deployment.md §4
  _SERVICE_ACCOUNT: ""
  # Secret versions (固定バージョン推奨)
  _DATABASE_URL_SECRET_VERSION: "1"
  _BETTER_AUTH_SECRET_VERSION: "1"
  _ENCRYPTION_KEY_SECRET_VERSION: "1"
  _CRON_SECRET_VERSION: "1"
  _ADMIN_LOGIN_TOKEN_SECRET_VERSION: "1"
  _NEXT_SERVER_ACTIONS_ENCRYPTION_KEY_SECRET_VERSION: "1"
  _R2_ACCOUNT_ID_SECRET_VERSION: "1"
  _R2_ACCESS_KEY_ID_SECRET_VERSION: "1"
  _R2_SECRET_ACCESS_KEY_SECRET_VERSION: "1"
  _R2_BUCKET_NAME_SECRET_VERSION: "1"
  _R2_PUBLIC_URL_SECRET_VERSION: "1"
  # NEXT_PUBLIC_* (ビルド時インライン + ランタイム両方で使用)
  _NEXT_PUBLIC_BASE_URL: ""
  _NEXT_PUBLIC_APP_URL: ""
  _NEXT_PUBLIC_TURNSTILE_SITE_KEY: ""
  _NEXT_PUBLIC_GA_MEASUREMENT_ID: ""
  # Server-only env vars
  _BETTER_AUTH_URL: ""

options:
  logging: CLOUD_LOGGING_ONLY
  env:
    - DOCKER_BUILDKIT=1

steps:
  # Step 1: Pull cache image (fail-safe)
  - name: gcr.io/cloud-builders/docker
    id: pull-cache
    entrypoint: bash
    args:
      - -c
      - docker pull ${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:cache || true

  # Step 2: Run unit tests (DB不要のテストのみ)
  - name: "oven/bun:1.3.12"
    id: test
    waitFor: ["-"]
    entrypoint: sh
    args:
      - -c
      - |
        bun install --frozen-lockfile
        bun run db:generate
        bun run test:unit

  # Step 3: Build image (validate + build inside Docker, deps installed once)
  - name: gcr.io/cloud-builders/docker
    id: build-image
    waitFor: [pull-cache, test]
    secretEnv:
      - NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
    args:
      - build
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --cache-from=${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:cache
      - --secret=id=next_server_actions_encryption_key,env=NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
      - --build-arg=NEXT_PUBLIC_BASE_URL=${_NEXT_PUBLIC_BASE_URL}
      - --build-arg=NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}
      - --build-arg=NEXT_PUBLIC_TURNSTILE_SITE_KEY=${_NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      - --build-arg=NEXT_PUBLIC_GA_MEASUREMENT_ID=${_NEXT_PUBLIC_GA_MEASUREMENT_ID}
      - -t=${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}
      - -t=${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:cache
      - .

  # Step 4: Push all tags
  - name: gcr.io/cloud-builders/docker
    id: push-image
    waitFor: [build-image]
    args:
      - push
      - --all-tags
      - ${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}

  # Step 5: Update Prisma migrate Job image (schema drift 防止のためデプロイ前に実行)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: migrate-update
    waitFor: [push-image]
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - ${_MIGRATE_JOB_NAME}
      - --region=${_REGION}
      - --image=${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}

  # Step 6: Execute Prisma migration (fail 時はデプロイ全体を止める)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: migrate-execute
    waitFor: [migrate-update]
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - ${_MIGRATE_JOB_NAME}
      - --region=${_REGION}
      - --wait

  # Step 7: Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    waitFor: [migrate-execute]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --platform=managed
      - --region=${_REGION}
      - --image=${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}
      - --allow-unauthenticated
      - --service-account=${_SERVICE_ACCOUNT}
      - --memory=${_MEMORY}
      - --cpu=${_CPU}
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --concurrency=${_CONCURRENCY}
      - --timeout=${_TIMEOUT}
      - --execution-environment=gen2
      - --cpu-boost
      # fireAndForget / Next.js after() パターン向けに CPU always-allocated
      # https://cloud.google.com/run/docs/configuring/cpu-allocation
      - --no-cpu-throttling
      - --port=8080
      # Probes: startup + liveness を /api/live（DB 非依存・軽量）で統一
      # https://cloud.google.com/run/docs/configuring/healthchecks
      - --startup-probe=httpGet.path=/api/live,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=1,periodSeconds=10,failureThreshold=9
      - --liveness-probe=httpGet.path=/api/live,httpGet.port=8080,initialDelaySeconds=10,timeoutSeconds=1,periodSeconds=30,failureThreshold=3
      - --update-env-vars=NODE_ENV=production,NEXT_TELEMETRY_DISABLED=1,DATABASE_POOL_MAX=${_DATABASE_POOL_MAX},NEXT_PUBLIC_BASE_URL=${_NEXT_PUBLIC_BASE_URL},NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL},NEXT_PUBLIC_TURNSTILE_SITE_KEY=${_NEXT_PUBLIC_TURNSTILE_SITE_KEY},NEXT_PUBLIC_GA_MEASUREMENT_ID=${_NEXT_PUBLIC_GA_MEASUREMENT_ID},BETTER_AUTH_URL=${_BETTER_AUTH_URL}
      - --update-secrets=DATABASE_URL=DATABASE_URL:${_DATABASE_URL_SECRET_VERSION},BETTER_AUTH_SECRET=BETTER_AUTH_SECRET:${_BETTER_AUTH_SECRET_VERSION},ENCRYPTION_KEY=ENCRYPTION_KEY:${_ENCRYPTION_KEY_SECRET_VERSION},CRON_SECRET=CRON_SECRET:${_CRON_SECRET_VERSION},ADMIN_LOGIN_TOKEN=ADMIN_LOGIN_TOKEN:${_ADMIN_LOGIN_TOKEN_SECRET_VERSION},NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:${_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY_SECRET_VERSION},R2_ACCOUNT_ID=R2_ACCOUNT_ID:${_R2_ACCOUNT_ID_SECRET_VERSION},R2_ACCESS_KEY_ID=R2_ACCESS_KEY_ID:${_R2_ACCESS_KEY_ID_SECRET_VERSION},R2_SECRET_ACCESS_KEY=R2_SECRET_ACCESS_KEY:${_R2_SECRET_ACCESS_KEY_SECRET_VERSION},R2_BUCKET_NAME=R2_BUCKET_NAME:${_R2_BUCKET_NAME_SECRET_VERSION},R2_PUBLIC_URL=R2_PUBLIC_URL:${_R2_PUBLIC_URL_SECRET_VERSION}

images:
  - ${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}
  - ${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:cache

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/NEXT_SERVER_ACTIONS_ENCRYPTION_KEY/versions/${_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY_SECRET_VERSION}
      env: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY

timeout: 900s
