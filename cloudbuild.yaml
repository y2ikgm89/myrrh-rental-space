# Cloud Build: Artifact Registry + Cloud Run deploy
#
# Normal production deploy path:
#   .github/workflows/deploy-production.yml authenticates through GitHub WIF
#   and submits this file with fixed production substitutions.
#
# Bootstrap/emergency usage only:
#   gcloud builds submit --config=cloudbuild.yaml
#
# Production setup runbook:
#   docs/gcp-production-setup.md
#
# Required secrets (Secret Manager):
#   DATABASE_URL, BETTER_AUTH_SECRET, ENCRYPTION_KEY, AUDIT_LOG_HMAC_KEY
#   NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME, R2_PUBLIC_URL
#   CLOUDFLARE_ZONE_ID, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ORIGIN_HEADER_SECRET
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
#     - Zone ID: Cloudflare Dashboard → Overview → API セクション（32-char hex）
#     - API Token: My Profile → API Tokens → Create Token。
#       最小権限: Permissions=Zone:Cache Purge:Purge + Zone:Zone:Read、
#       Zone Resources=Include:Specific zone:<対象ドメイン>。
#
# Required Cloud Run Job (created once per project):
#   prisma-migrate — `bunx --bun prisma migrate deploy` を実行する独立 Job（プロジェクト毎に初回 1 回手動作成）。
#   image / memory / command / args / DATABASE_URL secret は Step 4 が毎デプロイ宣言的に再適用する（作成時の値に依存しない）。
#   image は runner（slim）ではなく完全な node_modules を持つ migrator ステージ（:migrate-SHORT_SHA）を使う。
#
# Breaking migration deploy mode:
#   `_BREAKING_MIGRATION_DEPLOY=true` makes Cloud Build temporarily disable the
#   public/admin Cloud Run services before `prisma migrate deploy`, wait for the
#   configured request timeout drain window, then deploy the new clean revision
#   with automatic scaling restored. This is for intentional non-expand/contract
#   migrations such as column renames/drops.
#
#   If `prisma migrate deploy` itself fails while both services are quiesced,
#   Step 5b restores `--scaling=auto` on the previous revisions before
#   propagating the failure. Without this, both services would stay at
#   `--scaling=0` until an operator manually re-enabled them, giving the deploy
#   an unbounded MTTR.

substitutions:
  _REGION: asia-northeast1
  _SERVICE_NAME: myrrh-rental-space
  _ADMIN_SERVICE_NAME: myrrh-rental-space-admin
  # Required production substitutions intentionally have no defaults here.
  # Missing values must fail at `gcloud builds submit` time, before any image
  # is built or pushed. Explicit empty values are rejected by Step 0 below.
  # Required keys:
  #   _IAP_JWT_AUDIENCE
  #     /projects/PROJECT_NUMBER/locations/REGION/services/ADMIN_SERVICE_NAME
  #   _ADMIN_ROLE_GROUP_SUPER_ADMIN_EMAIL
  #   _ADMIN_ROLE_GROUP_ADMIN_EMAIL
  #   _ADMIN_ROLE_GROUP_EDITOR_EMAIL
  #   _ADMIN_ROLE_GROUP_VIEWER_EMAIL
  #   _NEXT_PUBLIC_BASE_URL
  #   _NEXT_PUBLIC_APP_URL
  #   _BETTER_AUTH_URL
  #   _ADMIN_APP_URL
  #   _CRON_OIDC_AUDIENCE
  #   _CRON_SERVICE_ACCOUNT_EMAIL
  #   _NEXT_PUBLIC_TURNSTILE_SITE_KEY
  _REPOSITORY: myrrh-rental-space
  _AR_HOST: asia-northeast1-docker.pkg.dev
  _MIGRATE_JOB_NAME: prisma-migrate
  _WORKER_POOL: myrrh-deploy-pool
  # migrate Job のメモリ。かつて 512Mi では `bunx prisma migrate deploy` が実行時に依存を
  # 再ダウンロード（不完全な runner image が原因）して OOM（signal 11）を起こしたが、
  # migrator ステージ（完全な node_modules）の導入で再DL 自体を排除済み。1Gi は余裕分として維持。
  # Step 4 で migrate Job の実行設定も毎デプロイ宣言的に再適用し作成時の値ドリフトを防ぐ。
  _MIGRATE_MEMORY: 1Gi
  _MEMORY: 1Gi
  _CPU: "1"
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "1"
  # Runtime rate limit backend contract. Only "in-memory" is implemented; a
  # distributed store must be added to src/shared/lib/rate-limit.ts before
  # switching to "redis". The instrumentation startup guard cross-checks this
  # against _MAX_INSTANCES and hard-fails when they are inconsistent.
  _RATE_LIMIT_BACKEND: "in-memory"
  _CONCURRENCY: "80"
  _TIMEOUT: "300"
  _BREAKING_MIGRATION_DEPLOY: "false"
  _BREAKING_MIGRATION_DRAIN_SECONDS: "310"
  # PostgreSQL pool size per Cloud Run instance.
  #
  # ## サイジング契約 (Codex #3564676717 対応)
  #
  # 同一値が public + admin の **2 サービス両方** に注入される (lines below の
  # `DATABASE_POOL_MAX=${_DATABASE_POOL_MAX}`)。実測 pool 消費上限は:
  #
  #   total = _DATABASE_POOL_MAX × 2 (public + admin) × _MAX_INSTANCES
  #
  # 現状 _MAX_INSTANCES=1 で 12 × 2 × 1 = 24 conn。Neon serverless の 30 conn cap
  # に対し 6 conn の headroom を残す — migrate Job (Prisma migrate 中に少数)、
  # ad-hoc `psql` 調査、モニタリング接続 (Neon dashboard 経由) の合計をこの
  # 6 conn 枠でまかなう。
  #
  # public 単独では 12 conn しかないため、reservation rush 時の pool 圧は初期の
  # 10 conn 案よりわずかに緩和される程度 (Codex 前の 25 案は 50 conn = Neon cap
  # 突破の bug で、rush 時に Neon 側で connection reject が起きる worse-than-before
  # 挙動になっていた)。Redis rate-limit backend 化 + horizontal scale 解禁時に
  # 本値の再検討が必須 — total 式で 30 を絶対に超えない範囲で最大化する。
  _DATABASE_POOL_MAX: "12"
  # Dedicated service account email (Cloud Run runtime + Prisma migrate Job 共通、初回 1 回手動作成)
  _SERVICE_ACCOUNT: myrrh-rental-space-runtime@myrrh-rental-space.iam.gserviceaccount.com
  # Dedicated Cloud Build service account. This build config is intentionally
  # not compatible with the default Cloud Build service account path.
  _BUILD_SERVICE_ACCOUNT: myrrh-rental-space-build@myrrh-rental-space.iam.gserviceaccount.com
  # Secret versions (固定バージョン推奨)
  _DATABASE_URL_SECRET_VERSION: "1"
  _BETTER_AUTH_SECRET_VERSION: "1"
  _ENCRYPTION_KEY_SECRET_VERSION: "1"
  # Primary encryption key id (`kid` in the v2 wire format). Must flip in the
  # same deploy as `_ENCRYPTION_KEY_SECRET_VERSION` — routing this via a Cloud
  # Build substitution keeps the two atomically consistent. `--set-env-vars`
  # on Cloud Run is destructive (replaces the full map), so setting
  # `ENCRYPTION_KEY_ID` via a one-off `gcloud run services update` would be
  # wiped on the next deploy. Runbook: docs/runbooks/encryption-key-rotation.md.
  _ENCRYPTION_KEY_ID: "v1"
  # Steady state: SECONDARY_ENCRYPTION_KEYS Secret Manager secret contains "".
  # Rotation window: operator publishes a new version with `kid1:hex64,...`,
  # then bumps this substitution. Runbook: docs/runbooks/encryption-key-rotation.md.
  _SECONDARY_ENCRYPTION_KEYS_SECRET_VERSION: "1"
  _AUDIT_LOG_HMAC_KEY_SECRET_VERSION: "1"
  _AUDIT_LOG_HMAC_KEY_ID: "v1"
  _NEXT_SERVER_ACTIONS_ENCRYPTION_KEY_SECRET_VERSION: "1"
  _R2_ACCOUNT_ID_SECRET_VERSION: "1"
  _R2_ACCESS_KEY_ID_SECRET_VERSION: "1"
  _R2_SECRET_ACCESS_KEY_SECRET_VERSION: "1"
  _R2_BUCKET_NAME_SECRET_VERSION: "1"
  _R2_PUBLIC_URL_SECRET_VERSION: "1"
  _CLOUDFLARE_ZONE_ID_SECRET_VERSION: "1"
  _CLOUDFLARE_API_TOKEN_SECRET_VERSION: "1"
  _CLOUDFLARE_ORIGIN_HEADER_SECRET_VERSION: "1"
  _GOOGLE_CLIENT_ID_SECRET_VERSION: "1"
  _GOOGLE_CLIENT_SECRET_SECRET_VERSION: "1"
  # NEXT_PUBLIC_* (ビルド時インライン + ランタイム両方で使用)
  #
  # _NEXT_PUBLIC_BASE_URL / _NEXT_PUBLIC_APP_URL /
  # _NEXT_PUBLIC_TURNSTILE_SITE_KEY は **production workflow / emergency
  # submit で必須設定**。
  # 空デフォルトを残すと substitution 未設定時に `""` が build に流入し、
  # next build が空文字を client/server bundle にインライン化して
  # `http://localhost:3000` を sitemap / OGP / canonical / breadcrumb に
  # 焼き込む silent SEO 汚染を起こす。デフォルトを削除して
  # `gcloud builds submit` の substitution 未設定エラーで build 投入時点に
  # 早期 fail させる（Dockerfile builder-base の assert と多重防御）。
  _NEXT_PUBLIC_GA_MEASUREMENT_ID: ""
  # _BETTER_AUTH_URL は Better Auth の canonical base URL。production
  # workflow / emergency submit 側で必須指定する。
  # _ADMIN_APP_URL は admin service の canonical custom origin。admin service は
  # external HTTPS Load Balancer 経由のみを正規入口とし、direct run.app URL は
  # 本番契約から除外する。

options:
  logging: CLOUD_LOGGING_ONLY
  pool:
    name: projects/${PROJECT_ID}/locations/${_REGION}/workerPools/${_WORKER_POOL}
  env:
    - DOCKER_BUILDKIT=1

serviceAccount: projects/${PROJECT_ID}/serviceAccounts/${_BUILD_SERVICE_ACCOUNT}

steps:
  # Step 0: Validate explicit empty production substitutions before any image
  # build or push. Missing substitutions are rejected by Cloud Build because
  # this config does not opt in to ALLOW_LOOSE.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: validate-production-substitutions
    entrypoint: bash
    args:
      - -ceu
      - |
        test -n "${_ADMIN_APP_URL}" || {
          echo "_ADMIN_APP_URL is required";
          exit 1;
        }
        test -n "${_BETTER_AUTH_URL}" || {
          echo "_BETTER_AUTH_URL is required";
          exit 1;
        }
        test -n "${_IAP_JWT_AUDIENCE}" || {
          echo "_IAP_JWT_AUDIENCE is required";
          exit 1;
        }
        test -n "${_ADMIN_ROLE_GROUP_SUPER_ADMIN_EMAIL}" || {
          echo "_ADMIN_ROLE_GROUP_SUPER_ADMIN_EMAIL is required";
          exit 1;
        }
        test -n "${_ADMIN_ROLE_GROUP_ADMIN_EMAIL}" || {
          echo "_ADMIN_ROLE_GROUP_ADMIN_EMAIL is required";
          exit 1;
        }
        test -n "${_ADMIN_ROLE_GROUP_EDITOR_EMAIL}" || {
          echo "_ADMIN_ROLE_GROUP_EDITOR_EMAIL is required";
          exit 1;
        }
        test -n "${_ADMIN_ROLE_GROUP_VIEWER_EMAIL}" || {
          echo "_ADMIN_ROLE_GROUP_VIEWER_EMAIL is required";
          exit 1;
        }
        test -n "${_NEXT_PUBLIC_APP_URL}" || {
          echo "_NEXT_PUBLIC_APP_URL is required";
          exit 1;
        }
        test -n "${_NEXT_PUBLIC_BASE_URL}" || {
          echo "_NEXT_PUBLIC_BASE_URL is required";
          exit 1;
        }
        test -n "${_NEXT_PUBLIC_TURNSTILE_SITE_KEY}" || {
          echo "_NEXT_PUBLIC_TURNSTILE_SITE_KEY is required";
          exit 1;
        }
        test -n "${_CRON_OIDC_AUDIENCE}" || {
          echo "_CRON_OIDC_AUDIENCE is required";
          exit 1;
        }
        test -n "${_CRON_SERVICE_ACCOUNT_EMAIL}" || {
          echo "_CRON_SERVICE_ACCOUNT_EMAIL is required";
          exit 1;
        }

        case "${_BREAKING_MIGRATION_DEPLOY}" in
          true|false) ;;
          *)
            echo "_BREAKING_MIGRATION_DEPLOY must be true or false";
            exit 1;
            ;;
        esac

        case "${_BREAKING_MIGRATION_DRAIN_SECONDS}" in
          ''|*[!0-9]*)
            echo "_BREAKING_MIGRATION_DRAIN_SECONDS must be a non-negative integer";
            exit 1;
            ;;
          *) ;;
        esac

        case "${_IAP_JWT_AUDIENCE}" in
          /projects/*/locations/${_REGION}/services/${_ADMIN_SERVICE_NAME}) ;;
          *)
            echo "_IAP_JWT_AUDIENCE must match /projects/PROJECT_NUMBER/locations/${_REGION}/services/${_ADMIN_SERVICE_NAME}";
            exit 1;
            ;;
        esac

        case "${_ADMIN_APP_URL}" in
          https://*) ;;
          *)
            echo "_ADMIN_APP_URL must be an https URL";
            exit 1;
            ;;
        esac
        case "${_ADMIN_APP_URL}" in
          */)
            echo "_ADMIN_APP_URL must not end with a trailing slash";
            exit 1;
            ;;
        esac
        case "${_ADMIN_APP_URL}" in
          https://admin.myrrh-jp.com) ;;
          *)
            echo "_ADMIN_APP_URL must be https://admin.myrrh-jp.com";
            exit 1;
            ;;
        esac

        case "${_BETTER_AUTH_URL}" in
          https://*) ;;
          *)
            echo "_BETTER_AUTH_URL must be an https URL";
            exit 1;
            ;;
        esac
        case "${_BETTER_AUTH_URL}" in
          */)
            echo "_BETTER_AUTH_URL must not end with a trailing slash";
            exit 1;
            ;;
        esac

        case "${_NEXT_PUBLIC_APP_URL}" in
          https://*) ;;
          *)
            echo "_NEXT_PUBLIC_APP_URL must be an https URL";
            exit 1;
            ;;
        esac
        case "${_NEXT_PUBLIC_APP_URL}" in
          */)
            echo "_NEXT_PUBLIC_APP_URL must not end with a trailing slash";
            exit 1;
            ;;
        esac

        case "${_NEXT_PUBLIC_BASE_URL}" in
          https://*) ;;
          *)
            echo "_NEXT_PUBLIC_BASE_URL must be an https URL";
            exit 1;
            ;;
        esac
        case "${_NEXT_PUBLIC_BASE_URL}" in
          */)
            echo "_NEXT_PUBLIC_BASE_URL must not end with a trailing slash";
            exit 1;
            ;;
        esac

        case "${_CRON_OIDC_AUDIENCE}" in
          https://*) ;;
          *)
            echo "_CRON_OIDC_AUDIENCE must be an https URL";
            exit 1;
            ;;
        esac
        case "${_CRON_OIDC_AUDIENCE}" in
          */)
            echo "_CRON_OIDC_AUDIENCE must not end with a trailing slash";
            exit 1;
            ;;
        esac

        if [ "${_NEXT_PUBLIC_APP_URL}" != "${_NEXT_PUBLIC_BASE_URL}" ]; then
          echo "_NEXT_PUBLIC_APP_URL must match _NEXT_PUBLIC_BASE_URL for the single production image";
          exit 1;
        fi
        if [ "${_BETTER_AUTH_URL}" != "${_NEXT_PUBLIC_BASE_URL}" ]; then
          echo "_BETTER_AUTH_URL must match _NEXT_PUBLIC_BASE_URL for the public service";
          exit 1;
        fi
        if [ "${_CRON_OIDC_AUDIENCE}" != "${_NEXT_PUBLIC_BASE_URL}" ]; then
          echo "_CRON_OIDC_AUDIENCE must match _NEXT_PUBLIC_BASE_URL";
          exit 1;
        fi

  # Step 1: Pull cache image (fail-safe)
  - name: gcr.io/cloud-builders/docker
    id: pull-cache
    entrypoint: bash
    args:
      - -c
      - docker pull ${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:cache || true

  # Step 2: Build runner (service) image。
  # 型チェック・lint・unit/integration テストは PR CI（.github/workflows/ci.yml の
  # type-check / lint-format / unit-tests job）が required status check として merge 前に
  # 担保する。deploy pipeline は push-to-main＝マージ後にしか走らないため、ここで再実行する
  # のは冗長。さらに旧 test step の `tsc` 二重型チェックは既定ワーカー（e2-standard-2 / 8GB）を
  # メモリ枯渇で VM ごと落とし `INTERNAL_ERROR` を起こしていた（#600 で 2/2 再現）。deploy pipeline
  # は private pool で十分な worker を確保し、検証は CI の責務に一本化して deploy pipeline から
  # 除去した。service イメージの型安全は下記 `next build` が app を型チェックして担保する。
  # `--target=runner` を必ず明示する。Dockerfile には migrator ステージも在り、
  # `--target` 未指定だと Docker は「末尾ステージ」をビルドするため、ステージ追加・
  # 並べ替えで service タグに別イメージが入る事故を構造的に防ぐ（#599 回帰の再発防止）。
  - name: gcr.io/cloud-builders/docker
    id: build-image
    waitFor: [pull-cache]
    secretEnv:
      - NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
    args:
      - build
      - --target=runner
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --cache-from=${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:cache
      - --secret=id=next_server_actions_encryption_key,env=NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
      - --build-arg=NEXT_PUBLIC_BASE_URL=${_NEXT_PUBLIC_BASE_URL}
      - --build-arg=NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}
      - --build-arg=NEXT_PUBLIC_TURNSTILE_SITE_KEY=${_NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      - --build-arg=NEXT_PUBLIC_GA_MEASUREMENT_ID=${_NEXT_PUBLIC_GA_MEASUREMENT_ID}
      - -t=${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}
      - -t=${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:cache
      - .

  # Step 2b: Build migrator image (Cloud Run migrate Job 専用・完全な node_modules)
  # deps ステージは build-image が local daemon に build 済みのため再利用される
  # （追加は thin な COPY prisma.config.ts レイヤのみ）。runner とは別タグで push する。
  - name: gcr.io/cloud-builders/docker
    id: build-migrator
    waitFor: [build-image]
    args:
      - build
      - --target=migrator
      - --cache-from=${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:cache
      - -t=${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:migrate-${SHORT_SHA}
      - .

  # Step 3: Push all tags (runner :SHORT_SHA / :cache ＋ migrator :migrate-SHORT_SHA)
  - name: gcr.io/cloud-builders/docker
    id: push-image
    waitFor: [build-image, build-migrator]
    args:
      - push
      - --all-tags
      - ${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}

  # Step 4: Update Prisma migrate Job image (schema drift 防止のためデプロイ前に実行)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: migrate-update
    waitFor: [push-image]
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - ${_MIGRATE_JOB_NAME}
      - --region=${_REGION}
      # migrator イメージ（完全な node_modules）を使う。runner の :${SHORT_SHA} ではなく
      # :migrate-${SHORT_SHA}。実行時再DL を排除し prisma.config.ts を確実にロードさせる。
      - --image=${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:migrate-${SHORT_SHA}
      - --memory=${_MIGRATE_MEMORY}
      - --cpu=1
      - --tasks=1
      - --parallelism=1
      - --max-retries=0
      - --task-timeout=600s
      - --service-account=${_SERVICE_ACCOUNT}
      # command / args も毎デプロイ再適用し、Job 作成後の手動変更による drift を防ぐ。
      - --command=bunx
      - --args=--bun,prisma,migrate,deploy
      # DATABASE_URL を毎デプロイ宣言的に再適用（Job 作成時設定へのドリフト防止）。
      - --set-secrets=DATABASE_URL=DATABASE_URL:${_DATABASE_URL_SECRET_VERSION}

  # Step 5a: For intentional breaking migrations, stop new requests before DB
  # schema changes. Cloud Run lets in-flight requests finish; the drain step
  # below waits longer than the configured request timeout before migration.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: disable-public-for-breaking-migration
    waitFor: [migrate-update]
    entrypoint: bash
    args:
      - -ceu
      - |
        if [ "${_BREAKING_MIGRATION_DEPLOY}" != "true" ]; then
          echo "Skipping public service quiesce for non-breaking migration deploy";
          exit 0;
        fi
        if ! gcloud run services describe ${_SERVICE_NAME} \
          --platform=managed \
          --region=${_REGION} >/dev/null 2>&1; then
          echo "Public Cloud Run service ${_SERVICE_NAME} does not exist; skipping quiesce";
          exit 0;
        fi
        gcloud run services update ${_SERVICE_NAME} \
          --platform=managed \
          --region=${_REGION} \
          --scaling=0 \
          --quiet

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: disable-admin-for-breaking-migration
    waitFor: [migrate-update]
    entrypoint: bash
    args:
      - -ceu
      - |
        if [ "${_BREAKING_MIGRATION_DEPLOY}" != "true" ]; then
          echo "Skipping admin service quiesce for non-breaking migration deploy";
          exit 0;
        fi
        if ! gcloud run services describe ${_ADMIN_SERVICE_NAME} \
          --platform=managed \
          --region=${_REGION} >/dev/null 2>&1; then
          echo "Admin Cloud Run service ${_ADMIN_SERVICE_NAME} does not exist; skipping quiesce";
          exit 0;
        fi
        gcloud run services update ${_ADMIN_SERVICE_NAME} \
          --platform=managed \
          --region=${_REGION} \
          --scaling=0 \
          --quiet

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: wait-for-breaking-migration-drain
    waitFor:
      - disable-public-for-breaking-migration
      - disable-admin-for-breaking-migration
    entrypoint: bash
    args:
      - -ceu
      - |
        if [ "${_BREAKING_MIGRATION_DEPLOY}" != "true" ]; then
          echo "Skipping request drain for non-breaking migration deploy";
          exit 0;
        fi
        echo "Waiting ${_BREAKING_MIGRATION_DRAIN_SECONDS}s for old Cloud Run revisions to drain";
        sleep ${_BREAKING_MIGRATION_DRAIN_SECONDS}

  # Step 5b: Execute Prisma migration.
  #
  # Failure semantics:
  #   - non-breaking mode  : services never quiesced (Step 5a/5b skipped), so we
  #     simply propagate the migrate failure and Cloud Build aborts the deploy.
  #   - breaking mode      : both services were forced to `--scaling=0` before
  #     the drain wait. If migrate execute fails now and we do nothing, both
  #     revisions stay at scaling=0 indefinitely (MTTR unbounded, requires manual
  #     `gcloud run services update --scaling=auto`). Restore auto scaling on
  #     the *previous* revision before propagating the failure so the site is
  #     available again while the migration issue is investigated.
  #
  # `--scaling=auto` on an already-serving Cloud Run service is a metadata-only
  # traffic-safe update (no cold restart) and idempotent, so re-applying it in a
  # failure branch is safe.
  # Bash-local shell variables inside this step MUST be escaped with a doubled
  # dollar sign in yaml so Cloud Build does not interpret them as substitution
  # references. Cloud Build user substitutions (underscore-prefixed) stay
  # single-dollar because they are resolved at Cloud Build parse time.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: migrate-execute
    waitFor: [wait-for-breaking-migration-drain]
    entrypoint: bash
    args:
      - -ceu
      - |
        restore_scaling() {
          local svc="$$1"
          if ! gcloud run services describe "$$svc" \
            --platform=managed \
            --region=${_REGION} >/dev/null 2>&1; then
            echo "Service $$svc does not exist; skipping scaling restore" >&2
            return 0
          fi
          echo "Restoring --scaling=auto for $$svc after failed migration" >&2
          gcloud run services update "$$svc" \
            --platform=managed \
            --region=${_REGION} \
            --scaling=auto \
            --quiet || echo "scaling restore for $$svc failed; manual intervention required" >&2
        }

        if gcloud run jobs execute ${_MIGRATE_JOB_NAME} \
          --region=${_REGION} \
          --wait; then
          exit 0
        fi

        echo "prisma-migrate execution failed" >&2
        if [ "${_BREAKING_MIGRATION_DEPLOY}" = "true" ]; then
          echo "Breaking migration mode: restoring service scaling before aborting" >&2
          restore_scaling ${_SERVICE_NAME}
          restore_scaling ${_ADMIN_SERVICE_NAME}
        fi
        exit 1

  # NOTE: Secret Manager IAM (runtime SA / build SA への secretAccessor 付与)
  # は Terraform (`terraform/secret_iam.tf`) が SSoT。cloudbuild.yaml は Cloud Run
  # `--set-secrets=` binding を宣言するだけで、実際の IAM 反映は
  # `.github/workflows/terraform.yml` の apply job が担う。
  #
  # 設計履歴:
  #   PR #1051-#1053: Cloud Build に `grant-secret-access` step を置き自動反映
  #     → Cloud Build SA が `secretmanager.secrets.setIamPolicy` を持つと、
  #     compromise 時に self-grant で secretAccessor を付与し全 secret を読める
  #     (Codex Cloud Review P1)。
  #   PR #1054-#1056: setup script (bash) が project owner 手動実行の SSoT。
  #   Terraform Phase 1: Terraform runner SA に Deny Policy
  #     (secretmanager.googleapis.com/versions.access を deny) と IAM Conditions
  #     (grantable roles を secretAccessor に限定) の二重防御を貼り、compromise
  #     時にも secret 漏洩ゼロを設計層で保証。
  #
  # 新規 secret を追加する場合: cloudbuild.yaml の `--set-secrets=` と
  # terraform/secret_iam.tf の `runtime_secrets` local を両方更新する。
  # 同期は architecture-boundaries.test.ts の drift gate が CI で強制する。

  # Step 6a: Deploy public Cloud Run service
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-public
    waitFor: [migrate-execute]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --platform=managed
      - --region=${_REGION}
      - --image=${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}
      - --allow-unauthenticated
      - --ingress=all
      - --service-account=${_SERVICE_ACCOUNT}
      - --memory=${_MEMORY}
      - --cpu=${_CPU}
      - --scaling=auto
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --concurrency=${_CONCURRENCY}
      - --timeout=${_TIMEOUT}
      - --execution-environment=gen2
      - --cpu-boost
      # fireAndForget / Next.js after() パターン向けに CPU always-allocated
      # https://cloud.google.com/run/docs/configuring/cpu-allocation
      - --no-cpu-throttling
      - --port=8080
      # Probes: startup + liveness を /api/live（DB 非依存・軽量）で統一
      # https://cloud.google.com/run/docs/configuring/healthchecks
      - --startup-probe=httpGet.path=/api/live,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=1,periodSeconds=10,failureThreshold=9
      - --liveness-probe=httpGet.path=/api/live,httpGet.port=8080,initialDelaySeconds=10,timeoutSeconds=1,periodSeconds=30,failureThreshold=3
      - --set-env-vars=NODE_ENV=production,NEXT_TELEMETRY_DISABLED=1,APP_SURFACE=public,ADMIN_APP_URL=${_ADMIN_APP_URL},DATABASE_POOL_MAX=${_DATABASE_POOL_MAX},AUDIT_LOG_HMAC_KEY_ID=${_AUDIT_LOG_HMAC_KEY_ID},ENCRYPTION_KEY_ID=${_ENCRYPTION_KEY_ID},CRON_OIDC_AUDIENCE=${_CRON_OIDC_AUDIENCE},CRON_SERVICE_ACCOUNT_EMAIL=${_CRON_SERVICE_ACCOUNT_EMAIL},NEXT_PUBLIC_BASE_URL=${_NEXT_PUBLIC_BASE_URL},NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL},NEXT_PUBLIC_TURNSTILE_SITE_KEY=${_NEXT_PUBLIC_TURNSTILE_SITE_KEY},NEXT_PUBLIC_GA_MEASUREMENT_ID=${_NEXT_PUBLIC_GA_MEASUREMENT_ID},BETTER_AUTH_URL=${_BETTER_AUTH_URL},MAX_INSTANCES_HINT=${_MAX_INSTANCES},RATE_LIMIT_BACKEND=${_RATE_LIMIT_BACKEND}
      - --set-secrets=DATABASE_URL=DATABASE_URL:${_DATABASE_URL_SECRET_VERSION},BETTER_AUTH_SECRET=BETTER_AUTH_SECRET:${_BETTER_AUTH_SECRET_VERSION},ENCRYPTION_KEY=ENCRYPTION_KEY:${_ENCRYPTION_KEY_SECRET_VERSION},SECONDARY_ENCRYPTION_KEYS=SECONDARY_ENCRYPTION_KEYS:${_SECONDARY_ENCRYPTION_KEYS_SECRET_VERSION},AUDIT_LOG_HMAC_KEY=AUDIT_LOG_HMAC_KEY:${_AUDIT_LOG_HMAC_KEY_SECRET_VERSION},NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:${_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY_SECRET_VERSION},R2_ACCOUNT_ID=R2_ACCOUNT_ID:${_R2_ACCOUNT_ID_SECRET_VERSION},R2_ACCESS_KEY_ID=R2_ACCESS_KEY_ID:${_R2_ACCESS_KEY_ID_SECRET_VERSION},R2_SECRET_ACCESS_KEY=R2_SECRET_ACCESS_KEY:${_R2_SECRET_ACCESS_KEY_SECRET_VERSION},R2_BUCKET_NAME=R2_BUCKET_NAME:${_R2_BUCKET_NAME_SECRET_VERSION},R2_PUBLIC_URL=R2_PUBLIC_URL:${_R2_PUBLIC_URL_SECRET_VERSION},CLOUDFLARE_ZONE_ID=CLOUDFLARE_ZONE_ID:${_CLOUDFLARE_ZONE_ID_SECRET_VERSION},CLOUDFLARE_API_TOKEN=CLOUDFLARE_API_TOKEN:${_CLOUDFLARE_API_TOKEN_SECRET_VERSION},CLOUDFLARE_ORIGIN_HEADER_SECRET=CLOUDFLARE_ORIGIN_HEADER_SECRET:${_CLOUDFLARE_ORIGIN_HEADER_SECRET_VERSION},GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:${_GOOGLE_CLIENT_ID_SECRET_VERSION},GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:${_GOOGLE_CLIENT_SECRET_SECRET_VERSION}

  # Step 6b: Deploy admin Cloud Run service. Direct IAP and authenticated-only
  # access are enabled once by the production setup runbook and verified by
  # `bun run gcp:audit-production-iap`; recurring deploys update the revision
  # and runtime config without mutating service IAM/IAP policy. Admin ingress is
  # intentionally limited to Cloud Load Balancing and the default run.app URL is
  # disabled, so the canonical admin entrypoint is only https://admin.myrrh-jp.com.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-admin
    waitFor: [migrate-execute]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_ADMIN_SERVICE_NAME}
      - --platform=managed
      - --region=${_REGION}
      - --image=${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}
      - --ingress=internal-and-cloud-load-balancing
      - --no-default-url
      - --service-account=${_SERVICE_ACCOUNT}
      - --memory=${_MEMORY}
      - --cpu=${_CPU}
      - --scaling=auto
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --concurrency=${_CONCURRENCY}
      - --timeout=${_TIMEOUT}
      - --execution-environment=gen2
      - --cpu-boost
      - --no-cpu-throttling
      - --port=8080
      - --startup-probe=httpGet.path=/api/live,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=1,periodSeconds=10,failureThreshold=9
      - --liveness-probe=httpGet.path=/api/live,httpGet.port=8080,initialDelaySeconds=10,timeoutSeconds=1,periodSeconds=30,failureThreshold=3
      - --set-env-vars=NODE_ENV=production,NEXT_TELEMETRY_DISABLED=1,APP_SURFACE=admin,ADMIN_APP_URL=${_ADMIN_APP_URL},IAP_JWT_AUDIENCE=${_IAP_JWT_AUDIENCE},ADMIN_ROLE_GROUP_SUPER_ADMIN_EMAIL=${_ADMIN_ROLE_GROUP_SUPER_ADMIN_EMAIL},ADMIN_ROLE_GROUP_ADMIN_EMAIL=${_ADMIN_ROLE_GROUP_ADMIN_EMAIL},ADMIN_ROLE_GROUP_EDITOR_EMAIL=${_ADMIN_ROLE_GROUP_EDITOR_EMAIL},ADMIN_ROLE_GROUP_VIEWER_EMAIL=${_ADMIN_ROLE_GROUP_VIEWER_EMAIL},DATABASE_POOL_MAX=${_DATABASE_POOL_MAX},AUDIT_LOG_HMAC_KEY_ID=${_AUDIT_LOG_HMAC_KEY_ID},ENCRYPTION_KEY_ID=${_ENCRYPTION_KEY_ID},CRON_OIDC_AUDIENCE=${_CRON_OIDC_AUDIENCE},CRON_SERVICE_ACCOUNT_EMAIL=${_CRON_SERVICE_ACCOUNT_EMAIL},NEXT_PUBLIC_BASE_URL=${_NEXT_PUBLIC_BASE_URL},NEXT_PUBLIC_APP_URL=${_ADMIN_APP_URL},NEXT_PUBLIC_TURNSTILE_SITE_KEY=${_NEXT_PUBLIC_TURNSTILE_SITE_KEY},NEXT_PUBLIC_GA_MEASUREMENT_ID=${_NEXT_PUBLIC_GA_MEASUREMENT_ID},BETTER_AUTH_URL=${_ADMIN_APP_URL},MAX_INSTANCES_HINT=${_MAX_INSTANCES},RATE_LIMIT_BACKEND=${_RATE_LIMIT_BACKEND}
      - --set-secrets=DATABASE_URL=DATABASE_URL:${_DATABASE_URL_SECRET_VERSION},BETTER_AUTH_SECRET=BETTER_AUTH_SECRET:${_BETTER_AUTH_SECRET_VERSION},ENCRYPTION_KEY=ENCRYPTION_KEY:${_ENCRYPTION_KEY_SECRET_VERSION},SECONDARY_ENCRYPTION_KEYS=SECONDARY_ENCRYPTION_KEYS:${_SECONDARY_ENCRYPTION_KEYS_SECRET_VERSION},AUDIT_LOG_HMAC_KEY=AUDIT_LOG_HMAC_KEY:${_AUDIT_LOG_HMAC_KEY_SECRET_VERSION},NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:${_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY_SECRET_VERSION},R2_ACCOUNT_ID=R2_ACCOUNT_ID:${_R2_ACCOUNT_ID_SECRET_VERSION},R2_ACCESS_KEY_ID=R2_ACCESS_KEY_ID:${_R2_ACCESS_KEY_ID_SECRET_VERSION},R2_SECRET_ACCESS_KEY=R2_SECRET_ACCESS_KEY:${_R2_SECRET_ACCESS_KEY_SECRET_VERSION},R2_BUCKET_NAME=R2_BUCKET_NAME:${_R2_BUCKET_NAME_SECRET_VERSION},R2_PUBLIC_URL=R2_PUBLIC_URL:${_R2_PUBLIC_URL_SECRET_VERSION},CLOUDFLARE_ZONE_ID=CLOUDFLARE_ZONE_ID:${_CLOUDFLARE_ZONE_ID_SECRET_VERSION},CLOUDFLARE_API_TOKEN=CLOUDFLARE_API_TOKEN:${_CLOUDFLARE_API_TOKEN_SECRET_VERSION},CLOUDFLARE_ORIGIN_HEADER_SECRET=CLOUDFLARE_ORIGIN_HEADER_SECRET:${_CLOUDFLARE_ORIGIN_HEADER_SECRET_VERSION},GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:${_GOOGLE_CLIENT_ID_SECRET_VERSION},GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:${_GOOGLE_CLIENT_SECRET_SECRET_VERSION}

images:
  - ${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}
  - ${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:migrate-${SHORT_SHA}
  - ${_AR_HOST}/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:cache

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/NEXT_SERVER_ACTIONS_ENCRYPTION_KEY/versions/${_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY_SECRET_VERSION}
      env: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY

timeout: 3600s
