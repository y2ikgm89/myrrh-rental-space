# ==============================================
# Myrrh Rental Space - Cloud Build Configuration
# Deploy to Cloud Run
# ==============================================
#
# Usage:
#   gcloud builds submit --config=cloudbuild.yaml
#
# Required substitutions:
#   - _REGION: Cloud Run region (e.g., asia-northeast1)
#   - _SERVICE_NAME: Cloud Run service name (e.g., myrrh-rental-space)
#
# Required secrets in Secret Manager:
#   - DATABASE_URL
#   - DIRECT_URL
#   - NEXTAUTH_SECRET
#   - RESEND_API_KEY
#   - NEXT_PUBLIC_SUPABASE_URL
#   - NEXT_PUBLIC_SUPABASE_ANON_KEY
#   - TURNSTILE_SECRET_KEY
#
# ==============================================

substitutions:
  _REGION: asia-northeast1
  _SERVICE_NAME: myrrh-rental-space
  _MEMORY: 1Gi
  _CPU: 1
  _MIN_INSTANCES: 0
  _MAX_INSTANCES: 10

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:latest'
      - '.'
    id: 'build-image'

  # Step 2: Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:${SHORT_SHA}'
    id: 'push-image-sha'
    waitFor: ['build-image']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:latest'
    id: 'push-image-latest'
    waitFor: ['build-image']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=${_MEMORY}'
      - '--cpu=${_CPU}'
      - '--min-instances=${_MIN_INSTANCES}'
      - '--max-instances=${_MAX_INSTANCES}'
      - '--port=3000'
      - '--set-env-vars=NODE_ENV=production'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DIRECT_URL:latest,AUTH_SECRET=NEXTAUTH_SECRET:latest,RESEND_API_KEY=RESEND_API_KEY:latest,NEXT_PUBLIC_SUPABASE_URL=NEXT_PUBLIC_SUPABASE_URL:latest,NEXT_PUBLIC_SUPABASE_ANON_KEY=NEXT_PUBLIC_SUPABASE_ANON_KEY:latest,TURNSTILE_SECRET_KEY=TURNSTILE_SECRET_KEY:latest'
    id: 'deploy-cloud-run'
    waitFor: ['push-image-sha']

images:
  - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:${SHORT_SHA}'
  - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:latest'

timeout: '1200s'
