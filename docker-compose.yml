# Docker Compose - Myrrh Rental Space 開発環境
#
# PostgreSQL 18 — **本番 Neon（18.4）と同じ系に揃えてある**。ここと
# `.github/workflows/ci.yml` の ECR ミラー image は必ず同時に動かすこと。片方だけ
# 上げると「ローカルと CI と本番が三者三様」になり、環境差の切り分けができなくなる。
#
# **16 から上げたときは volume を作り直す。** PostgreSQL のデータディレクトリは
# メジャーバージョン間で互換性が無く、16 のデータが入った volume では 18 が起動しない
# （`database files are incompatible with server`）。
#
#   docker compose down -v && bun run setup

services:
  db:
    image: postgres:18-alpine
    container_name: myrrh-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myrrh_rental
    volumes:
      # PG18 の `PGDATA` は `/var/lib/postgresql/18/docker`（メジャー版ごとのサブ
      # ディレクトリ）で、image の `VOLUME` も `/var/lib/postgresql` に変わった。
      # 17 以前の `/var/lib/postgresql/data` に付けると**この volume は実データを
      # 覆わず**、クラスタは匿名 volume に入る → `down` して `up` すると黙って
      # 空の DB が初期化される。17 以前は逆（`/var/lib/postgresql` に付けると
      # 永続しない）だったので、上げるときに必ず踏む。
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  test-db:
    image: postgres:18-alpine
    container_name: myrrh-postgres-test
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myrrh_test
    volumes:
      # マウント先が `/var/lib/postgresql` である理由は db service 側のコメント参照。
      - postgres_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myrrh_test"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  postgres_test_data:
