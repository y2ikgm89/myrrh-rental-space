# Codecov設定
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  # カバレッジ閾値設定
  status:
    project:
      default:
        target: 80%
        threshold: 2%
    patch:
      default:
        target: 70%
        threshold: 5%

  # カバレッジ計算から除外するパス
  ignore:
    - "**/*.d.ts"
    - "**/types/**"
    - "**/__mocks__/**"
    - "**/__tests__/**"
    - "**/generated/**"
    - "prisma/seed.ts"
    - "e2e/**"

# PRコメント設定
comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true
