# claude-code-harness 設定ファイル
# ドキュメント: /skill-list で利用可能なスキル一覧を確認

i18n:
  language: ja  # ja | en

workflow:
  mode: solo  # solo | 2agent

review:
  codex:
    enabled: true  # Codex MCP によるセカンドオピニオンレビュー
    # 要件: Codex MCP サーバーが設定されていること
    # 使用方法: /codex-review で手動実行

skills_gate:
  enabled: false  # スキル制限（上級者向け）
