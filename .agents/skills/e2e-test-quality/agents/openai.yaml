interface:
  display_name: "E2E Test Quality"
  short_description: "Playwright tests without flaky waits"
  default_prompt: "Use $e2e-test-quality when adding or fixing Playwright tests."

dependencies:
  tools:
    - type: "mcp"
      value: "context7"
      description: "Current Playwright documentation"
      transport: "streamable_http"
      url: "https://mcp.context7.com/mcp"

policy:
  allow_implicit_invocation: true
