interface:
  display_name: "Next DB Cache Boundaries"
  short_description: "Routes, Prisma, env, cache safety"
  default_prompt: "Use $next-db-cache-boundaries when changing routes, Prisma, env, cache, cron, webhooks, or deploy config."

dependencies:
