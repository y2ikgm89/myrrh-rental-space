# Lefthook: https://lefthook.dev/
#
# インストール:
#   bun install  (postinstall で自動的に lefthook install)
#   または: bunx lefthook install
#
# スキップ:
#   LEFTHOOK=0 git commit   # 全 hook スキップ
#   git commit --no-verify  # 非推奨
#
# 設計原則:
# - pre-commit は staged files のみを対象（高速）
# - pre-push はブランチ全体の validate（遅いが安全）
# - parallel: true で並列実行
# - stage_fixed: true で auto-fix を staging に戻す

pre-commit:
  parallel: true
  jobs:
    # ESLint: staged .ts/.tsx/.js/.jsx/.mjs/.cjs に対して --fix
    - name: eslint-fix
      glob:
        - "*.ts"
        - "*.tsx"
        - "*.js"
        - "*.jsx"
        - "*.mjs"
        - "*.cjs"
      run: bunx eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true

    # Prettier: staged files 全般（eslint と並列実行）
    - name: prettier-fix
      glob:
        - "*.{ts,tsx,js,jsx,mjs,cjs,json,md,yml,yaml,css}"
      run: bunx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    # 保護ファイルへのコミット防止
    # 実装: scripts/check-protected-files.sh
    # - .env*                    常にブロック（秘密情報）
    # - prisma/migrations/*.sql  既存ファイル改変（diff-filter=M）のみブロック。
    #                            新規追加（A、prisma migrate dev 出力）は許可。
    # - bun.lock                 package.json 同時 stage 時のみ許可
    - name: protected-files
      run: bash scripts/check-protected-files.sh

    # Terraform fmt: staged terraform/**/*.tf に対して auto-format。
    # CI (terraform.yml validate job) は `terraform fmt -check -recursive` で
    # gate しているが、fmt error は push 後に判明 → 修正 push → CI 再走の
    # 1 ラウンドトリップを消費する。pre-commit で先に auto-fix すれば
    # 開発ループが短縮される（CI gate は残るので regression risk ゼロ）。
    #
    # terraform CLI 未 install の dev 環境では graceful degrade (skip)。
    # CI 側の -check が最終防衛線として残るため fmt 未適用 push は捕捉される。
    - name: terraform-fmt
      glob: "terraform/**/*.tf"
      run: |
        if command -v terraform >/dev/null 2>&1; then
          terraform fmt {staged_files}
        else
          echo "[lefthook] terraform CLI not found — skipping fmt (CI will catch)"
        fi
      stage_fixed: true

pre-push:
  parallel: false
  jobs:
    # push 前に type-check を実行（staged files 対応が困難なため全件）
    - name: type-check
      run: bun run type-check
      tags: slow

    # architecture-boundaries test（Prisma gateway 規約等の違反検出）と、
    # __tests__/unit/architecture/ 配下の派生 gate（migration timestamp / cron OIDC /
    # feature module drift / next.config Cache-Tag 契約 / type-safety cast gate 等の
    # per-concern 分割 test 群）を同時に走らせる。run-tests.ts はディレクトリ引数を
    # 再帰的に展開するため、architecture/ 以下の全 gate が pre-push で強制される。
    # 素の bun test 禁止（mock.module() のプロセスグローバル干渉 / Lexical 循環 import の
    # TDZ を runner の --conditions production が回避する。.claude/rules/testing-unit.md）
    - name: architecture-boundaries
      run: >-
        bun scripts/run-tests.ts
        __tests__/unit/architecture-boundaries.test.ts
        __tests__/unit/architecture
      tags: slow

# commit-msg: Conventional Commits 形式チェック
# 実装: scripts/check-commit-msg.sh（lefthook sh -c "..." の quote 問題回避）
commit-msg:
  jobs:
    - name: conventional-commits
      run: bash scripts/check-commit-msg.sh {1}
