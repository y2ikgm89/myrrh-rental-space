# Bun設定ファイル
# https://bun.sh/docs/runtime/bunfig

[test]
# テストファイルのプリロード（DOM 環境 + グローバル設定）
preload = ["./__tests__/setup-dom.ts", "./__tests__/setup.ts"]

# E2E テスト（Playwright）を除外
root = "./__tests__"

# カバレッジ設定
coverage = true
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"

# カバレッジ閾値は未設定（Bun の coverageThreshold は終了コードと不整合になることがある）。

# カバレッジ除外パターン
coverageSkipTestFiles = true
coverageIgnoreSourcemaps = true
coveragePathIgnorePatterns = ["**/__tests__/setup.ts", "**/__tests__/setup-dom.ts"]

# タイムアウト設定（5秒）
timeout = 5000
