# Bun 設定ファイル
# https://bun.com/docs/runtime/bunfig
#
# Bun 1.3.x 公式仕様準拠。運用方針は以下の通り。
#
# - install: `bun install --frozen-lockfile` (CI) / `bun install` (local) でデフォルト動作
# - run: package.json scripts は `bunx --bun <bin>` で bun runtime を明示
# - scripts: scripts/* は .ts native + Bun runtime API (Bun.spawn / Bun.file / Bun.Glob)
#
# Note: `[run] noOrphans` (Bun 1.3.14+) は Lexical の dynamic import 経路で
# TDZ regression を起こすため、Bun 1.3.13 base に統一し当機能は未採用。

[test]
# テストファイルのプリロード（DOM 環境 + グローバル設定）
preload = ["./__tests__/setup-dom.ts", "./__tests__/setup.ts"]

# E2E テスト（Playwright）を除外
root = "./__tests__"

# タイムアウト設定（5 秒）
timeout = 5000

# Coverage は設定しない。
# per-file isolation runner (scripts/run-tests.ts) が複数プロセスを順次起動するため
# lcov が上書きされ、mock.module() の干渉で計測値も不正確になる。
# 必要時は `bun test --coverage <specific-file>` を単発で実行し参考値として扱う。
